<div>
  <!-- Toolbar -->
  <mat-toolbar *ngIf="!disableToolbar" class="section-toolbar">
    <!-- Title Section -->
    <ng-content select="[title]">
      <div class="title-section" *ngIf="title">
        <mat-icon class="title-icon">{{ displayTitleIcon }}</mat-icon>
        <span class="title-text">{{ title }}</span>

    </ng-content>

    <span class="spacer"></span>

    <!-- Random Button -->
    <button mat-icon-button
            [disabled]="recipes.length === 0"
            (click)="navigateRandom()"
            class="random-button">
      <mat-icon>casino</mat-icon>
      <span class="button-text">Random</span>

    <!-- Sort Menu -->
    <button mat-icon-button
            *ngIf="!disableSort"
            [matMenuTriggerFor]="sortMenu"
            [disabled]="sortLoading"
            class="sort-button">
      <mat-icon>{{ preferences.sortIcon }}</mat-icon>
      <span class="button-text">Sort</span>

    <mat-menu #sortMenu="matMenu"></mat-menu>
      <mat-list class="flex flex-col gap-sm">
        <mat-list-item *ngFor="let item of sortMenuItems"</mat-list-item></mat-list>
                       (click)="sortRecipes(item.event)"
                       class="sort-menu-item">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.title }}</span>

    <!-- Context Menu -->
    <button mat-icon-button
            *ngIf="!isMobile"
            [matMenuTriggerFor]="contextMenu"
            class="context-button">
      <mat-icon>more_vert</mat-icon>

    <mat-menu #contextMenu="matMenu"></mat-menu>
      <mat-list class="flex flex-col gap-sm">
        <mat-list-item *ngFor="let item of contextMenuItems"</mat-list-item></mat-list>
                       (click)="onContextMenuClick(item.event)"
                       class="context-menu-item">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.title }}</span>
  </mat-toolbar>

  <!-- Recipe Cards -->
  <div *ngIf="recipes && ready" class="recipe-cards-container">
    <!-- Desktop Cards -->
    <div *ngIf="!useMobileCards" class="desktop-cards">
      <div class="recipe-card-wrapper"
           *ngFor="let recipe of recipes; trackBy: trackByRecipeId"
           [class.single-column]="singleColumn">
        <app-recipe-card
          [name]="recipe.name"
          [description]="recipe.description"
          [slug]="recipe.slug"
          [rating]="recipe.rating"
          [image]="recipe.image"
          [tags]="recipe.tags"
          [recipeId]="recipe.id"></app-recipe-card></<app-recipe-card</app-recipe-card></app-recipe-card<>[name]="recipe.name"
          [description]="recipe.description"
          [slug]="recipe.slug"
          [rating]="recipe.rating"
          [image]="recipe.image"
          [tags]="recipe.tags"
          [recipeId]="recipe.id">>

    <!-- Mobile Cards -->
    <div *ngIf="useMobileCards" class="mobile-cards">
      <div class="recipe-card-wrapper"
           *ngFor="let recipe of recipes; trackBy: trackByRecipeId"
           [class.single-column]="singleColumn">
        <app-recipe-card-mobile
          [name]="recipe.name"
          [description]="recipe.description"
          [slug]="recipe.slug"
          [rating]="recipe.rating"
          [image]="recipe.image"
          [tags]="recipe.tags"
          [recipeId]="recipe.id"></app-recipe-card-mobile></<app-recipe-card-mobile</app-recipe-card-mobile></app-recipe-card-mobile<>[name]="recipe.name"
          [description]="recipe.description"
          [slug]="recipe.slug"
          [rating]="recipe.rating"
          [image]="recipe.image"
          [tags]="recipe.tags"
          [recipeId]="recipe.id">>

    <!-- Infinite Scroll Trigger -->
    <div class="scroll-trigger" (intersection)="handleInfiniteScroll()"></div>

    <!-- Loading Spinner -->
    <div *ngIf="loading" class="flex items-center justify-center py-xl">
      <mat-spinner diameter="40"></mat-spinner>
      <p class="loading-text text-secondary mb-sm">Loading more recipes...</p>

    <!-- No Recipes Message -->
    <div *ngIf="recipes.length === 0 && !loading" class="no-recipes">
      <mat-icon class="empty-icon">restaurant_menu</mat-icon>
      <p class="text-lg font-medium mb-sm">No recipes found</p>

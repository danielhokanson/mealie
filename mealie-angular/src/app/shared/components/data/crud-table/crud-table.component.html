<div class="crud-table-container">
    <!-- Table Actions -->
    <mat-card-actions class="table-actions">
        <!-- Column Visibility Menu -->
        <mat-menu *ngIf="tableConfig.hideColumns" #columnMenu="matMenu">
            <ng-template matMenuTrigger>
                <button mat-raised-button color="accent">
                    <mat-icon>settings</mat-icon>
                </button>
            </ng-template>
            <mat-card>
                <mat-card-content>
                    <mat-checkbox
                        *ngFor="let header of localHeaders"
                        [checked]="header.show"
                        (change)="onHeaderVisibilityChange(header, $event.checked)"
                        class="column-checkbox">
                        {{ header.text }}
                    </mat-checkbox>
                </mat-card-content>
            </mat-card>
        </mat-menu>

        <!-- Bulk Actions -->
        <app-base-overflow-button
            *ngIf="bulkActions.length > 0"
            [items]="getBulkActionItems()"
            [disabled]="selected.length < 1"
            color="info"
            btnClass="elevated"
            (itemClick)="onBulkAction($event)">
        </app-base-overflow-button>

        <!-- Custom Button Row -->
        <ng-content select="[slot=button-row]"></ng-content>
    </mat-card-actions>

    <!-- Search Field -->
    <div class="search-container">
        <mat-form-field class="search-field">
            <mat-label>Search</mat-label>
            <input
                matInput
                [(ngModel)]="search"
                (ngModelChange)="onSearchChange()"
                placeholder="Search...">
            <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
    </div>

    <!-- Data Table -->
    <table mat-table
           [dataSource]="filteredData"
           matSort
           [matSortActive]="sortBy[0]?.active || ''"
           [matSortDirection]="sortBy[0]?.direction || 'asc'"
           (matSortChange)="onSortChange($event)"
           class="data-table">

        <!-- Selection Column -->
        <ng-container *ngIf="bulkActions.length > 0" matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef>
                <mat-checkbox
                    (change)="$event ? masterToggle() : null"
                    [checked]="selection.hasValue() && isAllSelected()"
                    [indeterminate]="selection.hasValue() && !isAllSelected()">
                </mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let row">
                <mat-checkbox
                    (click)="$event.stopPropagation()"
                    (change)="$event ? selection.toggle(row) : null"
                    [checked]="selection.isSelected(row)">
                </mat-checkbox>
            </td>
        </ng-container>

        <!-- Dynamic Columns -->
        <ng-container *ngFor="let header of headersWithoutActions" [matColumnDef]="header.value">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
                {{ header.text }}
            </th>
            <td mat-cell *matCellDef="let element">
                <ng-content [attr.select]="'item.' + header.value" [attr.data-item]="element">
                    {{ element[header.value] }}
                </ng-content>
            </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let element">
                <app-base-button-group
                    [buttons]="[
                        {
                            icon: 'edit',
                            text: 'Edit',
                            event: 'edit',
                            color: 'primary'
                        },
                        {
                            icon: 'delete',
                            text: 'Delete',
                            event: 'delete',
                            color: 'warn'
                        }
                    ]"
                    (buttonClick)="onActionClick($event, element)">
                </app-base-button-group>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="activeHeaders"></tr>
        <tr mat-row *matRowDef="let row; columns: activeHeaders;" 
            [class.selected]="selection.isSelected(row)"
            (click)="onRowClick(row)">
        </tr>
    </table>

    <!-- Paginator -->
    <mat-paginator
        [pageSize]="15"
        [pageSizeOptions]="[5, 10, 15, 25, 50]"
        (page)="onPageChange($event)"
        class="table-paginator">
    </mat-paginator>

    <!-- Bottom Actions -->
    <mat-card-actions class="bottom-actions">
        <ng-content select="[slot=button-bottom]"></ng-content>
        
        <app-base-button
            *ngIf="tableConfig.canExport"
            color="info"
            (click)="downloadAsJson(filteredData, 'export.json')">
            <mat-icon>download</mat-icon>
            Download
        </app-base-button>
    </mat-card-actions>
</div>

<button
  mat-icon-button
  [matMenuTriggerFor]="contextMenu"
  class="context-menu-button"
  [style.color]="color">
  <mat-icon>{{ menuIcon }}</mat-icon>

<mat-menu #contextMenu="matMenu" class="context-menu">
  <button
    *ngIf="useItems.edit"
    mat-menu-item
    (click)="onUpdate()">
    <mat-icon>edit</mat-icon>
    <span>Edit</span>
  </mat-menu>
  
  <button
    *ngIf="useItems.delete"
    mat-menu-item
    (click)="onDelete()">
    <mat-icon>delete</mat-icon>
    <span>Delete</span>

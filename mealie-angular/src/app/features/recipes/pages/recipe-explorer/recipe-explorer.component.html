<section class="recipe-explorer page-container">
  <!-- Search Container -->
  <header class="card mb-lg">
    <!-- Header with Create Button -->
    <div class="flex justify-between items-center mb-md">
      <h1 class="text-2xl font-medium m-0 text-2xl font-medium mb-md text-2xl font-medium mb-md">Recipe Explorer</h1>
      <button 
        mat-raised-button 
        class="btn btn-primary" 
        (click)="onCreateRecipe()">
        <mat-icon>add</mat-icon>
        Create Recipe
      </button>
    </div>
    
    <form (ngSubmit)="onSearch()">
      <!-- Search Bar -->
      <mat-form-field appearance="outline" class="w-full mb-md w-full">
        <mat-icon matPrefix>search</mat-icon>
        <input 
          matInput 
          [(ngModel)]="searchQuery"
          name="searchQuery"
          placeholder="Search recipes..."
          (input)="onSearchQueryChange($event)">
        <button 
          *ngIf="searchQuery" 
          matSuffix 
          mat-icon-button 
          type="button"
          (click)="searchQuery = ''; onSearchQueryChange('')"
          aria-label="Clear search">
          <mat-icon>clear</mat-icon>
        </button>
      </mat-form-field>

      <!-- Filter Row -->
      <div class="flex flex-wrap gap-sm items-center mb-md">
        <!-- Categories Filter -->
        <app-search-filter
          *ngIf="categories.length > 0"
          [items]="categories"
          [(selectedItems)]="selectedCategories"
          [(requireAll)]="requireAllCategories"
          (selectionChange)="onFilterChange()"
          label="Categories"
          icon="category">
        </app-search-filter>

        <!-- Tags Filter -->
        <app-search-filter
          *ngIf="tags.length > 0"
          [items]="tags"
          [(selectedItems)]="selectedTags"
          [(requireAll)]="requireAllTags"
          (selectionChange)="onFilterChange()"
          label="Tags"
          icon="local_offer">
        </app-search-filter>

        <!-- Tools Filter -->
        <app-search-filter
          *ngIf="tools.length > 0"
          [items]="tools"
          [(selectedItems)]="selectedTools"
          [(requireAll)]="requireAllTools"
          (selectionChange)="onFilterChange()"
          label="Tools"
          icon="build">
        </app-search-filter>

        <!-- Foods Filter -->
        <app-search-filter
          *ngIf="foods.length > 0"
          [items]="foods"
          [(selectedItems)]="selectedFoods"
          [(requireAll)]="requireAllFoods"
          (selectionChange)="onFilterChange()"
          label="Foods"
          icon="restaurant">
        </app-search-filter>

        <!-- Sort Options -->
        <mat-menu #sortMenu="matMenu">
          <ng-template matMenuContent>
            <button mat-menu-item (click)="onSortChange('name')">
              <mat-icon>sort_by_alpha</mat-icon>
              <span>Name</span>
            </button>
            <button mat-menu-item (click)="onSortChange('createdAt')">
              <mat-icon>schedule</mat-icon>
              <span>Created Date</span>
            </button>
            <button mat-menu-item (click)="onSortChange('updatedAt')">
              <mat-icon>update</mat-icon>
              <span>Updated Date</span>
            </button>
            <button mat-menu-item (click)="onSortChange('rating')">
              <mat-icon>star</mat-icon>
              <span>Rating</span>
            </button>
            <button mat-menu-item (click)="onSortChange('totalTime')">
              <mat-icon>timer</mat-icon>
              <span>Total Time</span>
            </button>
            <mat-divider></mat-divider>
            <button mat-menu-item (click)="onOrderDirectionChange()">
              <mat-icon>{{ orderDirection === 'asc' ? 'arrow_downward' : 'arrow_upward' }}</mat-icon>
              <span>{{ orderDirection === 'asc' ? 'Descending' : 'Ascending' }}</span>
            </button>
          </ng-template>
        </mat-menu>

        <button 
          mat-stroked-button 
          [matMenuTriggerFor]="sortMenu"
          class="btn btn-secondary">
          <mat-icon>{{ orderDirection === 'asc' ? 'arrow_upward' : 'arrow_downward' }}</mat-icon>
          Sort
        </button>

        <!-- Settings Menu -->
        <mat-menu #settingsMenu="matMenu">
          <ng-template matMenuContent>
            <div class="p-md">
              <mat-slide-toggle 
                [(ngModel)]="autoSearch"
                name="autoSearch"
                class="mb-sm">
                Auto Search
              </mat-slide-toggle>
              <button 
                mat-stroked-button 
                (click)="onReset()"
                class="w-full">
                Reset Filters
              </button>
            </div>
          </ng-template>
        </mat-menu>

        <button 
          mat-icon-button 
          [matMenuTriggerFor]="settingsMenu"
          matTooltip="Settings">
          <mat-icon>settings</mat-icon>
        </button>
      </div>

      <!-- Search Button (when auto-search is disabled) -->
      <button 
        *ngIf="!autoSearch" 
        mat-raised-button 
        class="btn btn-primary w-full"
        type="submit">
        <mat-icon>search</mat-icon>
        Search
      </button>
    </form>
  </header>

  <!-- Active Filters Display -->
  <mat-chip-listbox 
    *ngIf="selectedCategories.length > 0 || selectedTags.length > 0 || selectedTools.length > 0 || selectedFoods.length > 0" 
    class="mb-md">
    <mat-chip 
      *ngFor="let category of selectedCategories"
      (removed)="removeCategory(category)"
      removable>
      {{ getCategoryName(category) }}
      <mat-icon matChipRemove>cancel</mat-icon>
    </mat-chip>
    <mat-chip 
      *ngFor="let tag of selectedTags"
      (removed)="removeTag(tag)"
      removable>
      {{ getTagName(tag) }}
      <mat-icon matChipRemove>cancel</mat-icon>
    </mat-chip>
    <mat-chip 
      *ngFor="let tool of selectedTools"
      (removed)="removeTool(tool)"
      removable>
      {{ getToolName(tool) }}
      <mat-icon matChipRemove>cancel</mat-icon>
    </mat-chip>
    <mat-chip 
      *ngFor="let food of selectedFoods"
      (removed)="removeFood(food)"
      removable>
      {{ getFoodName(food) }}
      <mat-icon matChipRemove>cancel</mat-icon>
    </mat-chip>
  </mat-chip-listbox>

  <!-- Loading Spinner -->
  <div *ngIf="loading" class="flex flex-col items-center justify-center py-xl">
    <mat-spinner></mat-spinner>
    <p class="mt-md text-secondary text-secondary mb-sm text-secondary mb-sm">Loading recipes...</p>
  </div>

  <!-- Recipe Grid -->
  <div *ngIf="!loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-md mb-lg">
    <!-- No Results -->
    <div *ngIf="recipes.length === 0" class="col-span-full flex flex-col items-center justify-center py-xl text-center">
      <mat-icon class="text-6xl text-tertiary mb-md">search_off</mat-icon>
      <h3 class="text-xl font-medium mb-sm text-lg font-medium mb-sm text-lg font-medium mb-sm">No recipes found</h3>
      <p class="text-secondary text-secondary mb-sm text-secondary mb-sm">Try adjusting your search criteria or filters.</p>
    </div>

    <!-- Recipe Cards -->
    <app-recipe-card 
      *ngFor="let recipe of recipes"
      [recipe]="recipe">
    </app-recipe-card>
  </div>

  <!-- Pagination -->
  <mat-paginator 
    *ngIf="totalRecipes > pageSize"
    [length]="totalRecipes"
    [pageSize]="pageSize"
    [pageIndex]="currentPage - 1"
    [pageSizeOptions]="[10, 20, 50, 100]"
    (page)="onPageChange($event.pageIndex + 1)"
    class="surface-secondary rounded-lg">
  </mat-paginator>

  <!-- Floating Action Button for Create Recipe -->
  <button 
    mat-fab 
    class="fixed bottom-6 right-6 z-fixed"
    style="background-color: var(--primary-600); color: white;"
    (click)="onCreateRecipe()"
    matTooltip="Create New Recipe"
    aria-label="Create new recipe">
    <mat-icon>add</mat-icon>
  </button>
</section>

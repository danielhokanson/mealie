<div *ngIf="notes.length > 0 || edit" class="recipe-notes">
  <h2 class="notes-title text-xl font-medium mb-md text-xl font-medium mb-md">Notes</h2>
  
  <form [formGroup]="notesForm" class="notes-form">
    <div formArrayName="notes">
      <div *ngFor="let note of notes; let i = index" 
           [id]="'note' + i"
           class="note-item">
        
        <!-- Edit Mode -->
        <mat-card *ngIf="edit" class="note-card card">
          <mat-card-content class="card">
            <div class="note-header">
              <mat-form-field appearance="outline" class="note-title-field w-full">
                <mat-label>Title</mat-label>
                <input 
                  matInput 
                  [formControlName]="i"
                  formControlName="title"
                  placeholder="Enter note title">
                <mat-error *ngFor="let error of getFormErrors(getNoteTitleControl(i))">
                  {{ error }}
                </mat-error>
              </mat-form-field>
              
              <button 
                type="button"
                mat-icon-button 
                class="btn btn-error"
                class="remove-note-btn"
                [matTooltip]="'Remove note'"
                (click)="removeNote(i)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
            
            <mat-form-field appearance="outline" class="note-text-field w-full">
              <mat-label>Note</mat-label>
              <textarea 
                matInput 
                [formControlName]="i"
                formControlName="text"
                placeholder="Enter note content"
                rows="3"
                cdkTextareaAutosize
                cdkAutosizeMinRows="3"
                cdkAutosizeMaxRows="10">
              </textarea>
              <mat-error *ngFor="let error of getFormErrors(getNoteTextControl(i))">
                {{ error }}
              </mat-error>
            </mat-form-field>
          </mat-card-content>
        </mat-card>

        <!-- View Mode -->
        <div *ngIf="!edit" class="note-view">
          <h3 class="note-title text-lg font-medium mb-sm text-lg font-medium mb-sm">{{ note.title }}</h3>
          <div class="note-content">
            <app-safe-markdown [source]="note.text"></app-safe-markdown>
          </div>
      </div>
  </form>

  <!-- Add Note Button -->
  <div *ngIf="edit" class="add-note-section">
    <app-base-button 
      [primary]="true"
      (click)="addNote()">
      <mat-icon>add</mat-icon>
      Add Note
    </app-base-button>
  </section>

<div class="text-center">
  <!-- Recipe Share Dialog -->
  <app-recipe-dialog-share 
    [(open)]="shareDialog" 
    [recipeId]="recipeId" 
    [name]="name">
  </app-recipe-dialog-share>

  <!-- Recipe Print Preferences Dialog -->
  <app-recipe-dialog-print-preferences 
    [(open)]="printPreferencesDialog" 
    [recipe]="recipeRef || undefined">
  </app-recipe-dialog-print-preferences>

  <!-- Recipe Delete Dialog -->
  <app-base-dialog
    [(modelValue)]="recipeDeleteDialog"
    title="Delete Recipe"
    color="error"
    icon="warning"
    [canConfirm]="true"
    (confirm)="deleteRecipe()">
    <div class="dialog-content">
      <p *ngIf="isAdminAndNotOwner" class="text-secondary mb-sm text-secondary mb-sm">
        Are you sure you want to delete this recipe? This action cannot be undone.
      </p>
      <p *ngIf="!isAdminAndNotOwner" class="text-secondary mb-sm text-secondary mb-sm">
        Are you sure you want to delete this recipe? This action cannot be undone.
      </p>
    </div>
  </app-base-dialog>

  <!-- Recipe Duplicate Dialog -->
  <app-base-dialog
    [(modelValue)]="recipeDuplicateDialog"
    title="Duplicate Recipe"
    class="btn btn-primary"
    icon="content_copy"
    [canConfirm]="true"
    (confirm)="duplicateRecipe()">
    <div class="dialog-content">
      <mat-form-field appearance="outline" class="full-width w-full">
        <mat-label>Recipe Name</mat-label>
        <input matInput
               [(ngModel)]="recipeName"
               (keyup.enter)="duplicateRecipe()"
               autofocus>
      </mat-form-field>
    </div>
  </app-base-dialog>

  <!-- Meal Planner Dialog -->
  <app-base-dialog
    [(modelValue)]="mealplannerDialog"
    title="Add Recipe to Meal Plan"
    class="btn btn-primary"
    icon="calendar_today"
    [canConfirm]="true"
    (confirm)="addRecipeToPlan()">
    <div class="dialog-content">
      <!-- Date Picker -->
      <mat-form-field appearance="outline" class="full-width w-full">
        <mat-label>Date</mat-label>
        <input matInput
               [value]="newMealdateString"
               readonly
               (click)="pickerMenu = true">
        <mat-icon matPrefix>calendar_today</mat-icon>
      </mat-form-field>

      <!-- Date Picker Menu -->
      <div class="date-picker-container" *ngIf="pickerMenu">
        <mat-calendar
          [(selected)]="newMealdate"
          (selectedChange)="pickerMenu = false">
        </mat-calendar>
      </div>

      <!-- Meal Type Selector -->
      <mat-form-field appearance="outline" class="full-width w-full">
        <mat-label>Entry Type</mat-label>
        <mat-select [(ngModel)]="newMealType">
          <mat-option *ngFor="let option of planTypeOptions" 
                      [value]="option.value">
            {{ option.text }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </app-base-dialog>

  <!-- Shopping List Dialog -->
  <app-recipe-dialog-add-to-shopping-list
    *ngIf="shoppingLists && recipeRefWithScale"
    [(open)]="shoppingListDialog"
    [recipes]="recipeRefWithScale ? [recipeRefWithScale] : []"
    [shoppingLists]="shoppingLists">
  </app-recipe-dialog-add-to-shopping-list>

  <!-- Context Menu -->
  <button mat-icon-button
          [class.fab-button]="fab"
          [class.menu-button]="!fab"
          [color]="fab ? 'accent' : color"
          [matMenuTriggerFor]="contextMenu"
          (click)="$event.preventDefault()">
    <mat-icon [class.fab-icon]="fab">{{ icon }}</mat-icon>
  </button>

  <mat-menu #contextMenu="matMenu" 
            [hasBackdrop]="true"
            [class.menu-top]="menuTop"
            [class.menu-bottom]="!menuTop">
    
    <mat-list class="flex flex-col gap-sm">
      <!-- Menu Items -->
      <mat-list-item *ngFor="let item of menuItems; let index = index"
                     (click)="contextMenuEventHandler(item.event)"
                     class="menu-item">
        <mat-icon matListItemIcon [color]="item.color">
          {{ item.icon }}
        </mat-icon>
        <span matListItemTitle>{{ item.title }}</span>
      </mat-list-item>

      <!-- Recipe Actions Divider -->
      <mat-divider *ngIf="useItems.recipeActions && recipeActions && recipeActions.length">
      </mat-divider>

      <!-- Recipe Actions -->
      <mat-list-item *ngFor="let action of recipeActions; let index = index"
                     (click)="executeRecipeAction(action)"
                     class="menu-item">
        <mat-icon matListItemIcon>add_link</mat-icon>
        <span matListItemTitle>{{ action.title }}</span>
      </mat-list-item>
    </mat-list>
  </mat-menu>
</section>

<div class="flex flex-col items-center justify-center py-xl text-center">
  <mat-icon class="text-6xl text-error mb-md">error</mat-icon>
  <h3 class="text-lg font-medium mb-sm">{{ title }}</h3>
  <p class="text-secondary">{{ message }}</p>
  <button 
    *ngIf="showRetry"
    mat-raised-button 
    class="btn btn-primary mt-md"
    (click)="onRetry()">
    {{ retryText }}
  </button>
</div>

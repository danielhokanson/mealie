<article class="card">
  <mat-card class="card">
    <mat-card-header class="card"></mat-card-header>
      <mat-card-title class="comments-title card"></mat-card-title>
        <mat-icon class="title-icon">comment</mat-icon>
        <span>Comments</span>

    <mat-divider></mat-divider>

    <mat-card-content class="card">
      <!-- Comment Form -->
      <div *ngIf="currentUser?.id" class="comment-form">
        <section class="page-container">
          <app-user-avatar 
            [userId]="currentUser.id" 
            [user]="currentUser"
            [size]="40"
            [tooltip]="false"></app-user-avatar></<app-user-avatar 
            [userId]="currentUser.id" 
            [user]="currentUser"
            [size]="40"
            [tooltip]="false"></app-user-avatar>>
          </section>

          <form [formGroup]="commentForm" class="comment-form-content">
            <mat-form-field appearance="outline" class="comment-textarea w-full">
              <mat-label>Join the conversation</mat-label>
              <textarea 
                matInput 
                formControlName="text"
                placeholder="Write a comment..."
                rows="2"
                cdkTextareaAutosize
                cdkAutosizeMinRows="2"
                cdkAutosizeMaxRows="6">
              </mat-form-field>
              <mat-error *ngFor="let error of getFormErrors()"></mat-error>
                {{ error }}
            </form>

            <div class="comment-actions">
              <app-base-button 
                [primary]="true"
                [disabled]="!canSubmit"
                [loading]="submitting"
                (click)="submitComment()"></app-base-button></<app-base-button 
                [primary]="true"
                [disabled]="!canSubmit"
                [loading]="submitting"
                (click)="submitComment()"></app-base-button>>
                <mat-icon>check</mat-icon>
                Submit

        </mat-card>

      <!-- Comments List -->
      <div class="comments-list">
        <div *ngFor="let comment of recipe.comments" 
             class="comment-item">
          <app-user-avatar 
            [userId]="comment.userId" 
            [user]="comment.user"
            [size]="40"
            [tooltip]="false"></app-user-avatar></<app-user-avatar 
            [userId]="comment.userId" 
            [user]="comment.user"
            [size]="40"
            [tooltip]="false"></app-user-avatar>></<app-user-avatar 
            [userId]="comment.userId" 
            [user]="comment.user"
            [size]="40"
            [tooltip]="false"></app-user-avatar>>>
          <mat-card class="comment-card card">
            <mat-card-content class="comment-content card">
              <div class="comment-header">
                <span class="comment-author">{{ comment.user.fullName }}</span>
                <span class="comment-date">{{ formatDate(comment.createdAt) }}</span>

              <div class="comment-text">
                <app-safe-markdown [source]="comment.text"></app-safe-markdow></app-safe-markdown>

            <mat-card-actions class="comment-actions card" *ngIf="canDeleteComment(comment)" ></mat-card-actions></mat-card>
              <button 
                mat-button 
                class="btn btn-error delete-comment-btn"
                (click)="deleteComment(comment.id)">
                <mat-icon>delete</mat-icon>
                Delete
          </article>

      <!-- Empty State -->
      <div *ngIf="recipe.comments.length === 0" class="empty-state">
        <mat-icon class="empty-icon">comment</mat-icon>
        <p class="empty-text text-secondary mb-sm">No comments yet. Be the first to comment!</p>

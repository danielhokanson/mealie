<section class="page-container">
  <header class="flex justify-between items-center mb-lg"></header>
    <h1 class="text-2xl font-medium">Shopping Lists</h1>
    <button 
      mat-raised-button 
      class="btn btn-primary"
      (click)="createNewList()">
      <mat-icon>add</mat-icon>
      New List
  </section>

  <!-- Loading State -->
  <div *ngIf="loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-md stagger-animation">
    <app-skeleton-loader 
      *ngFor="let item of [1,2,3,4,5,6]"
      type="card"></app-skeleton-loader></<app-skeleton-loader 
      *ngFor="let item of [1,2,3,4,5,6]"
      type="card"></app-skeleton-loader>>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="flex flex-col items-center justify-center py-xl text-center">
    <mat-icon class="text-6xl text-error mb-md">error</mat-icon>
    <p class="text-secondary mb-md">{{ error }}</p>
    <button 
      mat-raised-button 
      class="btn btn-primary"
      (click)="loadData()">
      Retry

  <!-- Content -->
  <main *ngIf="!loading && !error">
    <!-- Empty State -->
    <div *ngIf="shoppingLists.length === 0" class="flex flex-col items-center justify-center py-xl text-center">
      <mat-icon class="text-6xl text-tertiary mb-md">shopping_cart</mat-icon>
      <h2 class="text-xl font-medium mb-sm">No Shopping Lists</h2>
      <p class="text-secondary mb-md">Create your first shopping list to get started</p>
      <button 
        mat-raised-button 
        class="btn btn-primary"
        (click)="createNewList()">
        <mat-icon>add</mat-icon>
        Create First List

    </main>

    <!-- Shopping Lists Grid -->
    <div *ngIf="shoppingLists.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-md stagger-animation">
      <app-shopping-list
        *ngFor="let list of shoppingLists; trackBy: trackByListId"
        [shoppingList]="list"
        [labels]="labels"
        [units]="units"
        [foods]="foods"
        [recipes]="recipes"
        [showLabels]="true"
        (itemChecked)="onItemChecked($event)"
        (itemUpdated)="onItemUpdated($event)"
        (itemDeleted)="onItemDeleted($event)"
        (listDeleted)="onListDeleted($event)"></app-shopping-list></<app-shopping-list
        *ngFor="let list of shoppingLists; trackBy: trackByListId"
        [shoppingList]="list"
        [labels]="labels"
        [units]="units"
        [foods]="foods"
        [recipes]="recipes"
        [showLabels]="true"
        (itemChecked)="onItemChecked($event)"
        (itemUpdated)="onItemUpdated($event)"
        (itemDeleted)="onItemDeleted($event)"
        (listDeleted)="onListDeleted($event)"></app-shopping-list>></<app-shopping-list
        *ngFor="let list of shoppingLists; trackBy: trackByListId"
        [shoppingList]="list"
        [labels]="labels"
        [units]="units"
        [foods]="foods"
        [recipes]="recipes"
        [showLabels]="true"
        (itemChecked)="onItemChecked($event)"
        (itemUpdated)="onItemUpdated($event)"
        (itemDeleted)="onItemDeleted($event)"
        (listDeleted)="onListDeleted($event)"></app-shopping-list>>>

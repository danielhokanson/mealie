<div class="text-center">
  <!-- Dialog Trigger Button -->
  <app-base-button
    (click)="openDialog()">
    Bulk Add
  </div>

  <!-- Dialog -->
  <div *ngIf="dialog" class="dialog-overlay" (click)="closeDialog()">
    <div class="dialog-content" (click)="$event.stopPropagation()">
      <mat-card class="dialog-card card">
        <!-- Dialog Header -->
        <mat-toolbar class="btn btn-primary dialog-header">
          <mat-icon class="header-icon">add_circle</mat-icon>
          <span class="header-title">Bulk Add</span>
          <span class="spacer"></span>
        </mat-toolbar>

        <!-- Dialog Body -->
        <div class="dialog-body">
          <!-- Text Input Area -->
          <mat-form-field appearance="outline" class="text-input w-full">
            <mat-label>Recipe Data</mat-label>
            <textarea matInput
                      [(ngModel)]="inputText"
                      rows="12"
                      placeholder="Paste in your recipe data. Each line will be treated as an item in a list">
            </mat-form-field>
          </div>

          <mat-divider class="section-divider"></mat-divider>

          <!-- Utilities Section -->
          <div class="utilities-section">
            <div *ngFor="let util of utilities; let last = last" class="utility-item">
              <mat-list-item class="utility-list-item">
                
                  <div class="utility-description">
                    {{ util.description }}
                  
                  <app-base-button
                    size="small"
                    class="btn btn-secondary"
                    (click)="util.action()"
                    class="utility-button">
                    <mat-icon>smart_toy</mat-icon>
                    Run
                  </div>
                </mat-list-item>
              </div>
              <mat-divider *ngIf="!last" class="utility-divider"></mat-divider>
            </div>
        </mat-card>

        <!-- Dialog Actions -->
        <mat-divider class="action-divider"></mat-divider>
        <div class="dialog-actions">
          <app-base-button
            cancel
            (click)="closeDialog()">
            Cancel
          </div>

          <app-base-button
            save
            color="success"
            (click)="save()">
            Save
          </div>
        </div>

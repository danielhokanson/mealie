<mat-sidenav-container class="sidenav-container">
  <!-- Side Navigation -->
  <mat-sidenav 
    #drawer 
    class="sidenav" 
    fixedInViewport
    [attr.role]="'navigation'"
    [mode]="'side'"
    [opened]="sidenavOpened">
    
    <mat-toolbar class="sidenav-header">
      <span class="text-lg font-medium">Menu</span>
    </mat-toolbar>
    
    <mat-nav-list class="flex-1">
      <a mat-list-item routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <mat-icon matListItemIcon>restaurant</mat-icon>
        <span matListItemTitle>Recipes</span>
      </a>
      <a mat-list-item routerLink="/meal-plans" routerLinkActive="active">
        <mat-icon matListItemIcon>calendar_today</mat-icon>
        <span matListItemTitle>Meal Plans</span>
      </a>
      <a mat-list-item routerLink="/shopping-lists" routerLinkActive="active">
        <mat-icon matListItemIcon>shopping_cart</mat-icon>
        <span matListItemTitle>Shopping Lists</span>
      </a>
      <a mat-list-item routerLink="/settings" routerLinkActive="active">
        <mat-icon matListItemIcon>settings</mat-icon>
        <span matListItemTitle>Settings</span>
      </a>
    </mat-nav-list>
    
    <!-- Theme Toggle at Bottom -->
    <div class="theme-toggle-container border-t px-md py-md">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-sm">
          <mat-icon>{{ isDarkTheme ? 'dark_mode' : 'light_mode' }}</mat-icon>
          <span class="text-sm">{{ isDarkTheme ? 'Dark' : 'Light' }} Theme</span>
        </div>
        <mat-slide-toggle 
          [checked]="isDarkTheme" 
          (change)="toggleTheme()"
          class="btn btn-primary">
        </mat-slide-toggle>
      </div>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content class="sidenav-content">
    <!-- Top Toolbar -->
    <mat-toolbar class="toolbar">
      <button 
        type="button" 
        aria-label="Toggle sidenav" 
        mat-icon-button 
        (click)="toggleSidenav()">
        <mat-icon>menu</mat-icon>
      </button>
      
      <span class="toolbar-title font-medium">{{ title }}</span>
      
      <span class="flex-1"></span>
      
      <!-- Search shortcut -->
      <button mat-icon-button (click)="focusSearch()" matTooltip="Press '/' to search">
        <mat-icon>search</mat-icon>
      </button>
      
      <!-- User menu -->
      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
      
      <mat-menu #userMenu="matMenu">
        <!-- Show Login and Register when not authenticated -->
        <button *ngIf="!isAuthenticated" mat-menu-item (click)="onLogin()">
          <mat-icon>login</mat-icon>
          <span>Login</span>
        </button>
        <button *ngIf="!isAuthenticated" mat-menu-item (click)="onRegister()">
          <mat-icon>person_add</mat-icon>
          <span>Register</span>
        </button>
        
        <!-- Show Profile, Settings, Logout when authenticated -->
        <button *ngIf="isAuthenticated" mat-menu-item (click)="onProfile()">
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button *ngIf="isAuthenticated" mat-menu-item (click)="onSettings()">
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <button *ngIf="isAuthenticated" mat-menu-item (click)="onLogout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <!-- Page Content -->
    <main class="page-container">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

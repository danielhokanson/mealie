<div class="ingredient-item">
  <!-- Quantity -->
  <app-safe-markdown
    *ngIf="parsedIngredient.quantity"
    [markdown]="parsedIngredient.quantity"
    class="d-inline">
  </div>

  <!-- Unit -->
  <span *ngIf="parsedIngredient.unit" class="unit-text">
    {{ parsedIngredient.unit }}
  </span>

  <!-- Note (when no name) -->
  <app-safe-markdown
    *ngIf="parsedIngredient.note && !parsedIngredient.name"
    [markdown]="parsedIngredient.note"
    class="text-bold d-inline">

  <!-- Name and Note -->
  <ng-container *ngIf="parsedIngredient.name">
    <app-safe-markdown
      [markdown]="parsedIngredient.name"
      class="text-bold d-inline">
    </ng-container>
    
    <app-safe-markdown
      *ngIf="parsedIngredient.note"
      [markdown]="parsedIngredient.note"
      class="note">

<div class="registration-form">
  <mat-card class="card">
    <mat-card-header class="card"></mat-card-header>
      <mat-card-title class="form-title card"></mat-card-title>
        <mat-icon class="title-icon">person</mat-icon>
        <span>Account Details</span>

    <mat-divider></mat-divider>

    <mat-card-content class="card">
      <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" class="form-content">
        
        <!-- Username Field -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Username</mat-label>
          <input 
            matInput 
            formControlName="username"
            placeholder="Enter username"
            (blur)="onUsernameBlur()"
            autocomplete="username">
          <mat-icon matPrefix>person</mat-icon>
          <mat-error *ngFor="let error of getFormErrors('username')"></mat-error>
            {{ error }}
        </mat-form-field>

        <!-- Full Name Field -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Full Name</mat-label>
          <input 
            matInput 
            formControlName="fullName"
            placeholder="Enter your full name"
            autocomplete="name">
          <mat-icon matPrefix>person</mat-icon>
          <mat-error *ngFor="let error of getFormErrors('fullName')"></mat-error>
            {{ error }}
        </mat-form-field>

        <!-- Email Field -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Email</mat-label>
          <input 
            matInput 
            formControlName="email"
            type="email"
            placeholder="Enter your email"
            (blur)="onEmailBlur()"
            autocomplete="email">
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngFor="let error of getFormErrors('email')"></mat-error>
            {{ error }}
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Password</mat-label>
          <input 
            matInput 
            formControlName="password"
            [type]="getPasswordInputType()"
            placeholder="Enter password"
            autocomplete="new-password">
          <mat-icon matPrefix>lock</mat-icon>
          <button 
            mat-icon-button 
            matSuffix 
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="showPassword">
            <mat-icon>{{ getPasswordIcon() }}</mat-icon>
          </mat-form-field>
          <mat-error *ngFor="let error of getFormErrors('password')"></mat-error>
            {{ error }}
        </form>

        <!-- Password Strength -->
        <app-user-password-strength 
          [password]="registrationForm.get('password')?.value"></app-user-password-strength></<app-user-password-strength 
          [password]="registrationForm.get('password')?.value"></app-user-password-strength>>

        <!-- Confirm Password Field -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Confirm Password</mat-label>
          <input 
            matInput 
            formControlName="confirmPassword"
            [type]="getConfirmPasswordInputType()"
            placeholder="Confirm your password"
            autocomplete="new-password">
          <mat-icon matPrefix>lock</mat-icon>
          <button 
            mat-icon-button 
            matSuffix 
            type="button"
            (click)="toggleConfirmPasswordVisibility()"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="showConfirmPassword">
            <mat-icon>{{ getConfirmPasswordIcon() }}</mat-icon>
          </mat-form-field>
          <mat-error *ngFor="let error of getFormErrors('confirmPassword')"></mat-error>
            {{ error }}
          <mat-error *ngIf="getPasswordMatchError()"></mat-error>
            {{ getPasswordMatchError() }}
        </mat-card>

        <!-- Advanced Options -->
        <div class="advanced-options">
          <mat-checkbox formControlName="advancedOptions" class="advanced-checkbox"></mat-checkbox>
            Enable Advanced Content
          <p class="advanced-description text-secondary mb-sm"></p>
            Enable advanced features and content that may not be suitable for all users.

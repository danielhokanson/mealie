<!-- Activator slot -->
<ng-content select="[slot=activator]"></ng-content>

<!-- Dialog Overlay -->
<div 
  *ngIf="dialog()"
  class="fixed inset-0 bg-overlay flex items-center justify-center z-modal-backdrop"
  (click)="onCancel()"
  (keydown)="onKeyDown($event)"
  tabindex="0">
  
  <mat-card 
    class="card relative z-modal w-full mx-md"
    [style.max-width]="dialogMaxWidth || '600px'"
    [class]="dialogClass"
    (click)="$event.stopPropagation()" class="card">
    
    <!-- Toolbar -->
    <mat-toolbar class="flex items-center gap-sm mb-md -mx-lg -mt-lg rounded-t-lg">
      <mat-icon *ngIf="icon">{{ icon }}</mat-icon>
      <span class="text-lg font-medium">{{ title }}</span>
    </mat-toolbar>
    
    <!-- Progress bar -->
    <mat-progress-bar 
      *ngIf="loading"
      mode="indeterminate"
      class="absolute top-0 left-0 right-0">
    </mat-progress-bar>
    
    <!-- Content -->
    <div class="py-md">
      <ng-content></ng-content>
    </div>
    
    <!-- Divider -->
    <mat-divider class="my-md"></mat-divider>
    
    <!-- Actions -->
    <div class="flex items-center justify-end gap-sm">
      <ng-content select="[slot=card-actions]">
        <!-- Default actions -->
        <button 
          mat-button
          class="btn btn-secondary"
          (click)="onCancel()">
          Cancel
        </button>
        
        <div class="flex-1"></div>
        
        <ng-content select="[slot=custom-card-action]"></ng-content>
        
        <app-base-button
          *ngIf="canDelete"
          [delete]="true"
          [secondary]="true"
          (click)="onDelete()">
        </app-base-button>
        
        <app-base-button
          *ngIf="canConfirm"
          [color]="color"
          [disabled]="submitDisabled"
          (click)="onConfirm()">
          <mat-icon>check</mat-icon>
          Confirm
        </app-base-button>
        
        <app-base-button
          *ngIf="canSubmit"
          [disabled]="submitDisabled || loading"
          (click)="onSubmit()">
          <mat-icon *ngIf="submitIcon">{{ submitIcon }}</mat-icon>
          {{ submitText }}
        </app-base-button>
      </ng-content>
    </div>
    
    <!-- Below actions -->
    <div *ngIf="hasBelowActionsSlot" class="mt-md pt-md border-t">
      <ng-content select="[slot=below-actions]"></ng-content>
    </div>
  </mat-card>
</section>

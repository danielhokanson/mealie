<div>
  <!-- Dialog Trigger Slot -->
  <ng-content></ng-content>

  <!-- Search Dialog -->
  <div *ngIf="dialog" class="dialog-overlay" (click)="closeDialog()">
    <div class="dialog-content" (click)="$event.stopPropagation()">
      <mat-card class="search-dialog card">
        <!-- Search Header -->
        <mat-toolbar class="btn btn-primary search-header">
          <mat-form-field appearance="outline" class="search-input w-full">
            <mat-label>Search</mat-label>
            <input matInput
                   id="arrow-search"
                   [(ngModel)]="searchQuery"
                   (input)="onSearchQueryChange()"
                   autofocus
                   autocomplete="off"
                   placeholder="Search recipes...">
            <mat-icon matPrefix>search</mat-icon>
          </mat-form-field>
          
          <button mat-icon-button
                  (click)="closeDialog()"
                  class="close-button">
            <mat-icon>close</mat-icon>
          </mat-toolbar>
        </mat-card>

        <!-- Search Results -->
        <div class="search-results" [class.loading]="loading">
          <div class="results-header">
            <span class="results-count">Results</span>
          </div>

          <section class="page-container">
            <app-recipe-card-mobile
              *ngFor="let recipe of searchResults; let index = index"
              [name]="recipe.name"
              [description]="recipe.description"
              [slug]="recipe.slug"
              [rating]="recipe.rating"
              [image]="recipe.image"
              [recipeId]="recipe.id"
              [tabindex]="index"
              class="arrow-nav"
              [class.selected]="selected && index === selectedIndex"
              (click)="handleSelect(recipe)">
            </section>

            <div *ngIf="searchResults.length === 0 && !loading" class="flex flex-col items-center justify-center py-xl text-center">
              <mat-icon class="no-results-icon">search_off</mat-icon>
              <p class="no-results-text text-secondary mb-sm">No recipes found</p>
            </div>
        </div>
      </div>
    </div>

</div>

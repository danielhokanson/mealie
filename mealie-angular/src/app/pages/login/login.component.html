<section class="page-container">
  <mat-card class="login-card card">
    <mat-card-header class="card"></mat-card-header>
      <mat-card-title >Login to Mealie</mat-card-title>
      <mat-card-subtitle >Enter your credentials to continue</mat-card-subtitle>
    
    <mat-card-content class="card">
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <mat-form-field appearance="outline" class="full-width w-full"></mat-form-field>
          <mat-label>Username</mat-label>
          <input 
            matInput 
            [(ngModel)]="username" 
            name="username"
            required
            placeholder="Enter your username">
          <mat-icon matPrefix>person</mat-icon>
        
        <mat-form-field appearance="outline" class="full-width w-full">
          <mat-label>Password</mat-label>
          <input 
            matInput 
            type="password"
            [(ngModel)]="password" 
            name="password"
            required
            placeholder="Enter your password">
          <mat-icon matPrefix>lock</mat-icon>
        </mat-form-field>
        
        <div class="remember-me">
          <mat-checkbox [(ngModel)]="rememberMe" name="rememberMe"></mat-checkbox>
            Remember me

        <div *ngIf="errorMessage" class="text-error mb-md">
          {{ errorMessage }}

        <section class="page-container">
          <button mat-raised-button class="btn btn-primary login-button" type="submit" [disabled]="isLoading || !username || !password" > <mat-icon *ngIf="!isLoading">login</mat-icon> <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner> {{ isLoading ? 'Logging in...' : 'Login' }}</button>
          
          <button mat-button type="button" (click)="onCancel()" class="btn btn-secondary"> Cancel</button>
      <div class="register-link">
        <p class="text-secondary mb-sm">Don't have an account?</p>
          <button mat-button class="btn btn-secondary" (click)="navigateToRegister()">Register here</button>

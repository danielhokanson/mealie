<table mat-table class="w-full report-table" [dataSource]="items" >
  <!-- Category Column -->
  <ng-container matColumnDef="category">
    <th mat-header-cell *matHeaderCellDef>Category</th>
    <td mat-cell *matCellDef="let item" (click)="onRowClick(item)">
      {{ capitalize(item.category) }}

  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let item" (click)="onRowClick(item)">
      {{ item.name }}

  </ng-container>

  <!-- Timestamp Column -->
  <ng-container matColumnDef="timestamp">
    <th mat-header-cell *matHeaderCellDef>Timestamp</th>
    <td mat-cell *matCellDef="let item" (click)="onRowClick(item)">
      {{ formatDate(item.timestamp) }}

  </ng-container>

  <!-- Status Column -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let item" (click)="onRowClick(item)">
      {{ capitalize(item.status) }}

  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let item">
      <buttonmat-icon-button class="btn btn-error delete-button" (click)="onDelete(item.id)"> <mat-icon>delete</mat-icon> <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr> <tr mat-row *matRowDef="let row; columns: displayedColumns;"</button>
      [class.clickable]="row.status !== 'in-progress'"
      class="table-row"></tr>
</table>

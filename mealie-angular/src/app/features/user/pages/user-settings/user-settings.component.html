<section class="page-container">
  <div class="settings-content" *ngIf="!loading">
    <div class="settings-header">
      <h2 class="text-xl font-medium mb-md">User Settings</h2>
      <p class="text-secondary mb-sm">Manage your account preferences and settings</p>

    <mat-tab-group class="settings-tabs">
      <!-- Profile Tab -->
      <mat-tab label="Profile">
        
          <form [formGroup]="profileForm" class="settings-form">
            <div class="form-section">
              <h3 class="text-lg font-medium mb-sm">Profile Information</h3>
              
              <div class="avatar-section">
                <div class="avatar-preview">
                  <mat-icon class="avatar-icon">account_circle</mat-icon>
                
                <div class="avatar-actions">
                  <button mat-raised-button class="btn btn-primary" type="button">
                    <mat-icon>upload</mat-icon>
                    Upload Photo

                  <button mat-stroked-button type="button">
                    <mat-icon>delete</mat-icon>
                    Remove Photo

              <div class="form-row">
                <mat-form-field class="w-full"></mat-form-field>
                  <mat-label>Display Name</mat-label>
                  <input matInput formControlName="displayName" placeholder="Enter your display name">
                  <mat-error *ngIf="profileForm.get('displayName')?.hasError('required')"></mat-error>
                    Display name is required
                  <mat-error *ngIf="profileForm.get('displayName')?.hasError('maxlength')"></mat-error>
                    Display name must be no more than 50 characters

              <div class="form-row">
                <mat-form-field class="w-full"></mat-form-field>
                  <mat-label>Email</mat-label>
                  <input matInput formControlName="email" type="email" placeholder="Enter your email">
                  <mat-error *ngIf="profileForm.get('email')?.hasError('required')"></mat-error>
                    Email is required
                  <mat-error *ngIf="profileForm.get('email')?.hasError('email')"></mat-error>
                    Please enter a valid email address

              <div class="form-row">
                <mat-form-field class="w-full"></mat-form-field>
                  <mat-label>Bio</mat-label>
                  <textarea matInput formControlName="bio" placeholder="Tell us about yourself" rows="3"></textarea>
                  <mat-hint>{{ getBioLength() }}/{{ getMaxBioLength() }}</mat-hint>
                  <mat-error *ngIf="profileForm.get('bio')?.hasError('maxlength')"></mat-error>
                    Bio must be no more than 500 characters

      <!-- Preferences Tab -->
      <mat-tab label="Preferences">
        
          <form [formGroup]="preferencesForm" class="settings-form">
            <div class="form-section">
              <h3 class="text-lg font-medium mb-sm">Display Preferences</h3>
              
              <div class="form-row">
                <mat-slide-toggle formControlName="darkMode"></mat-slide-toggle>
                  Dark Mode
                <span class="preference-description">Use dark theme for better viewing in low light</span>

              <div class="form-row">
                <mat-slide-toggle formControlName="compactMode"></mat-slide-toggle>
                  Compact Mode
                <span class="preference-description">Show more content in less space</span>

              <div class="form-row">
                <mat-slide-toggle formControlName="showNutrition"></mat-slide-toggle>
                  Show Nutrition Information
                <span class="preference-description">Display nutrition facts on recipe cards</span>

              <div class="form-row">
                <mat-slide-toggle formControlName="showImages"></mat-slide-toggle>
                  Show Recipe Images
                <span class="preference-description">Display images in recipe lists and cards</span>

            <div class="form-section">
              <h3 class="text-lg font-medium mb-sm">Notification Preferences</h3>
              
              <div class="form-row">
                <mat-slide-toggle formControlName="emailNotifications"></mat-slide-toggle>
                  Email Notifications
                <span class="preference-description">Receive notifications via email</span>

              <div class="form-row">
                <mat-slide-toggle formControlName="pushNotifications"></mat-slide-toggle>
                  Push Notifications
                <span class="preference-description">Receive push notifications in browser</span>

              <div class="form-row">
                <mat-slide-toggle formControlName="mealPlanReminders"></mat-slide-toggle>
                  Meal Plan Reminders
                <span class="preference-description">Get reminded about upcoming meal plans</span>

              <div class="form-row">
                <mat-slide-toggle formControlName="shoppingListReminders"></mat-slide-toggle>
                  Shopping List Reminders
                <span class="preference-description">Get reminded about incomplete shopping lists</span>

            <div class="form-section">
              <h3 class="text-lg font-medium mb-sm">Privacy Settings</h3>
              
              <div class="form-row">
                <mat-slide-toggle formControlName="publicProfile"></mat-slide-toggle>
                  Public Profile
                <span class="preference-description">Allow others to view your profile</span>

              <div class="form-row">
                <mat-slide-toggle formControlName="showEmail"></mat-slide-toggle>
                  Show Email Address
                <span class="preference-description">Display email in public profile</span>

              <div class="form-row">
                <mat-slide-toggle formControlName="allowRecipeSharing"></mat-slide-toggle>
                  Allow Recipe Sharing
                <span class="preference-description">Allow others to share your recipes</span>

      <!-- Security Tab -->
      <mat-tab label="Security">
        
          <form [formGroup]="securityForm" class="settings-form">
            <div class="form-section">
              <h3 class="text-lg font-medium mb-sm">Password</h3>
              
              <div class="form-row">
                <mat-form-field class="w-full"></mat-form-field>
                  <mat-label>Current Password</mat-label>
                  <input matInput formControlName="currentPassword" type="password" placeholder="Enter current password">
                  <mat-error *ngIf="securityForm.get('currentPassword')?.hasError('required')"></mat-error>
                    Current password is required

              <div class="form-row">
                <mat-form-field class="w-full"></mat-form-field>
                  <mat-label>New Password</mat-label>
                  <input matInput formControlName="newPassword" type="password" placeholder="Enter new password">
                  <mat-error *ngIf="securityForm.get('newPassword')?.hasError('required')"></mat-error>
                    New password is required
                  <mat-error *ngIf="securityForm.get('newPassword')?.hasError('minlength')"></mat-error>
                    Password must be at least 8 characters

              <div class="form-row">
                <mat-form-field class="w-full"></mat-form-field>
                  <mat-label>Confirm New Password</mat-label>
                  <input matInput formControlName="confirmPassword" type="password" placeholder="Confirm new password">
                  <mat-error *ngIf="securityForm.get('confirmPassword')?.hasError('required')"></mat-error>
                    Please confirm your new password
                  <mat-error *ngIf="securityForm.hasError('passwordMismatch')"></mat-error>
                    Passwords do not match

              <div class="form-row">
                <button mat-raised-button class="btn btn-primary" type="button" (click)="onChangePassword()" [disabled]="!canChangePassword()">
                  <mat-icon>lock</mat-icon>
                  Change Password

            <div class="form-section">
              <h3 class="text-lg font-medium mb-sm">Two-Factor Authentication</h3>
              
              <div class="form-row">
                <mat-slide-toggle formControlName="twoFactorEnabled"></mat-slide-toggle>
                  Enable Two-Factor Authentication
                <span class="preference-description">Add an extra layer of security to your account</span>

              <div class="form-row" *ngIf="securityForm.get('twoFactorEnabled')?.value">
                <button mat-stroked-button type="button" (click)="onSetupTwoFactor()">
                  <mat-icon>qr_code</mat-icon>
                  Setup Two-Factor Authentication

            <div class="form-section">
              <h3 class="text-lg font-medium mb-sm">Session Management</h3>
              
              <div class="form-row">
                <button mat-stroked-button type="button" (click)="onViewActiveSessions()">
                  <mat-icon>devices</mat-icon>
                  View Active Sessions

              <div class="form-row">
                <button mat-stroked-button type="button" (click)="onLogoutAllDevices()">
                  <mat-icon>logout</mat-icon>
                  Logout All Devices

      <!-- Data Tab -->
      <mat-tab label="Data">
        
          <div class="settings-form">
            <div class="form-section">
              <h3 class="text-lg font-medium mb-sm">Data Export</h3>
              
              <div class="form-row">
                <button mat-raised-button class="btn btn-primary" type="button" (click)="onExportData()">
                  <mat-icon>download</mat-icon>
                  Export My Data

                <span class="preference-description">Download all your data in JSON format</span>

            <div class="form-section">
              <h3 class="text-lg font-medium mb-sm">Data Import</h3>
              
              <div class="form-row">
                <button mat-stroked-button type="button" (click)="onImportData()">
                  <mat-icon>upload</mat-icon>
                  Import Data

                <span class="preference-description">Import data from a JSON file</span>

            <div class="form-section">
              <h3 class="text-lg font-medium mb-sm">Account Deletion</h3>
              
              <div class="form-row">
                <button mat-raised-button class="btn btn-error" type="button" (click)="onDeleteAccount()">
                  <mat-icon>delete_forever</mat-icon>
                  Delete Account

                <span class="preference-description">Permanently delete your account and all data</span>

    <div class="settings-actions">
      <button mat-raised-button class="btn btn-primary" (click)="onSaveSettings()" [disabled]="!canSaveSettings()">
        <mat-spinner diameter="20" *ngIf="saving"></mat-spinner>
        <mat-icon *ngIf="!saving">save</mat-icon>
        Save Settings

      <button mat-stroked-button (click)="onCancel()">
        Cancel

  <ng-template #loadingTemplate>
    <div class="flex items-center justify-center py-xl">
      <mat-spinner diameter="40"></mat-spinner>
      <p class="text-secondary mb-sm">Loading user settings...</p>

  </ng-template>

</mat-tab>

</form>
</mat-tab>

</form>
</mat-tab>
</form>
</mat-tab>
</mat-tab-group>

</section>

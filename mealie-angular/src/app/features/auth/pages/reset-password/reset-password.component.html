<section class="page-container">
  <div class="reset-password-card">
    <mat-card class="card">
      <mat-card-header class="card"></mat-card-header>
        <mat-card-title >Reset Password</mat-card-title>
        <mat-card-subtitle >Enter your new password</mat-card-subtitle>

      <mat-card-content class="card">
        <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="reset-password-form">
          <!-- New Password Field -->
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>New Password</mat-label>
            <input 
              matInput 
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Enter your new password"
              autocomplete="new-password">
            <mat-icon matPrefix>lock</mat-icon>
            <button 
              mat-icon-button 
              matSuffix 
              type="button"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </mat-form-field>
            <mat-error *ngIf="resetPasswordForm.get('password')?.invalid && resetPasswordForm.get('password')?.touched"></mat-error>
              {{ getErrorMessage('password') }}
          </form>

          <!-- Password Strength Indicator -->
          <div *ngIf="resetPasswordForm.get('password')?.value" class="password-strength">
            <div class="strength-bar">
              <div 
                class="strength-fill"
                [style.background-color]="getPasswordStrengthColor()"
                [style.width]="getPasswordStrength() === 'weak' ? '33%' : getPasswordStrength() === 'medium' ? '66%' : '100%'">

            <span class="strength-text" [style.color]="getPasswordStrengthColor()"></span>
              Password strength: {{ getPasswordStrength() }}

          <!-- Confirm Password Field -->
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Confirm New Password</mat-label>
            <input 
              matInput 
              [type]="showConfirmPassword ? 'text' : 'password'"
              formControlName="confirmPassword"
              placeholder="Confirm your new password"
              autocomplete="new-password">
            <mat-icon matPrefix>lock</mat-icon>
            <button 
              mat-icon-button 
              matSuffix 
              type="button"
              (click)="toggleConfirmPasswordVisibility()"
              [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
              <mat-icon>{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </mat-form-field>
            <mat-error *ngIf="resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched"></mat-error>
              {{ getErrorMessage('confirmPassword') }}

          <!-- Submit Button -->
          <button 
            mat-raised-button 
            class="btn btn-primary btn btn-primary" 
            type="submit"
            
            [disabled]="loading || resetPasswordForm.invalid">
            <mat-spinner *ngIf="loading" diameter="20" class="spinner"></mat-spinner>
            <span *ngIf="!loading">Reset Password</span>
          </mat-card>

      </section>

      <mat-card-actions class="flex justify-end gap-sm pt-md card"></mat-card-actions>
        <button 
          mat-button 
          class="btn btn-primary back-to-login"
          (click)="onBackToLogin()"
          >
          Back to Login

<app-base-dialog
  [(modelValue)]="open"
  icon="print_settings"
  title="Print Preferences"
  width="70%"
  maxWidth="816px"
  (modelValueChange)="onDialogChange($event)"></app-base-dialog></<app-base-dialog
  [(modelValue)]="open"
  icon="print_settings"
  title="Print Preferences"
  width="70%"
  maxWidth="816px"
  (modelValueChange)="onDialogChange($event)"></app-base-dialog>>
    <!-- Print Configuration -->
    <div class="print-config">
      <div class="config-row">
        <!-- Image Position -->
        <div class="image-position-section">
          <div class="section-title">
            Recipe Image
          
          <mat-button-toggle-group
            [(ngModel)]="imagePositionValue"
            class="image-position-toggle">
            <mat-button-toggle [value]="ImagePosition.Left"></mat-button-toggle>
              <mat-icon>dock_left</mat-icon>
            <mat-button-toggle [value]="ImagePosition.Right"></mat-button-toggle>
              <mat-icon>dock_right</mat-icon>
            <mat-button-toggle [value]="ImagePosition.Hidden"></mat-button-toggle>
              <mat-icon>close</mat-icon>

        <!-- Content Options -->
        <div class="content-options">
          <div class="option-group">
            <mat-slide-toggle
              [(ngModel)]="preferences.showDescription"
              class="btn btn-primary">
              Description

          <div class="option-group">
            <mat-slide-toggle
              [(ngModel)]="preferences.showNotes"
              class="btn btn-primary">
              Notes

        <!-- Nutrition Options -->
        <div class="nutrition-options">
          <div class="option-group">
            <mat-slide-toggle
              [(ngModel)]="preferences.showNutrition"
              class="btn btn-primary">
              Nutrition

    <!-- Print Preview -->
    <mat-card class="print-preview card" *ngIf="recipe" ></mat-card>
      <app-recipe-print-view
        [recipe]="recipe"
        [preferences]="preferences"></app-recipe-print-view></<app-recipe-print-view
        [recipe]="recipe"
        [preferences]="preferences"></app-recipe-print-view>>

<div class="timeline-item" [class]="attrs.class" [style.width]="width">
  <div class="timeline-icon">
    <mat-icon class="icon">{{ icon }}</mat-icon>
  </div>
  
  <div class="timeline-content">
    <!-- Date Chip (Desktop) -->
    <div *ngIf="!useMobileFormat && event.timestamp" class="date-chip">
      <mat-chip class="btn btn-primary date-chip-content">
        <mat-icon class="date-icon">calendar_today</mat-icon>
        {{ formattedDate }}
      </mat-chip>
    </div>
    
    <!-- Timeline Card -->
    <mat-card class="timeline-card" (click)="onCardClick()" class="card">
      <mat-card-header class="card-header card">
        <div class="header-content">
          <!-- User Avatar -->
          <div class="avatar-section" [class]="attrs.avatar.class">
            <app-user-avatar
              [userId]="event.userId"
              [size]="attrs.avatar.size">
            </app-user-avatar>
          </div>
          
          <!-- Date Chip (Mobile) -->
          <div *ngIf="useMobileFormat && event.timestamp" class="mobile-date">
            <mat-chip class="btn btn-primary">
              <mat-icon>calendar_today</mat-icon>
              {{ formattedDate }}
            </mat-chip>
          </div>
          
          <!-- Subject (Desktop) -->
          <div *ngIf="!useMobileFormat" class="subject-section">
            {{ event.subject }}
          </div>
          
          <!-- Spacer -->
          <div class="spacer"></div>
          
          <!-- Context Menu -->
          <div class="context-menu-section">
            <app-recipe-timeline-context-menu
              *ngIf="canEdit"
              [event]="event"
              [useMobileFormat]="useMobileFormat"
              (update)="update.emit()"
              (delete)="delete.emit()">
            </app-recipe-timeline-context-menu>
          </div>
      </mat-card-header>
      
      <!-- Recipe Card (if enabled) -->
      <mat-card-content *ngIf="showRecipeCards && recipe" class="recipe-card-content card">
        <div class="recipe-card-wrapper" [class]="useMobileFormat ? 'py-3 mx-0' : 'py-3 mx-0'">
          <app-recipe-card-mobile
            [name]="recipe.name"
            [slug]="recipe.slug"
            [description]="recipe.description"
            [rating]="recipe.rating"
            [image]="recipe.image"
            [recipeId]="recipe.id"
            [isFlat]="true"
            [vertical]="useMobileFormat">
          </app-recipe-card-mobile>
        </div>
      </mat-card-content>
      
      <!-- Divider -->
      <mat-divider *ngIf="showRecipeCards && recipe && (useMobileFormat || event.eventMessage)"></mat-divider>
      
      <!-- Event Content -->
      <mat-card-content class="event-content card">
        <div class="content-wrapper">
          <!-- Subject (Mobile) -->
          <strong *ngIf="useMobileFormat" class="mobile-subject">{{ event.subject }}</strong>
          
          <!-- Event Image -->
          <img
            *ngIf="eventImageUrl && !hideImage"
            [src]="eventImageUrl"
            [alt]="event.subject"
            class="event-image"
            [style.max-height.px]="attrs.image.maxHeight"
            [class]="attrs.image.class"
            (error)="onImageError()">
          
          <!-- Event Message -->
          <div *ngIf="event.eventMessage" class="event-message" [class]="useMobileFormat ? 'text-caption' : ''">
            <app-safe-markdown [source]="event.eventMessage"></app-safe-markdown>
          </div>
      </mat-card-content>
    </mat-card>
  </section>

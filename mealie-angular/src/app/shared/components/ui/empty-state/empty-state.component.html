<div class="empty-state-container">
  <mat-icon class="empty-icon">{{ icon }}</mat-icon>
  <h3>{{ title }}</h3>
  <p>{{ message }}</p>
  <button 
    *ngIf="showAction"
    mat-raised-button 
    color="primary"
    (click)="onAction()">
    <mat-icon>{{ actionIcon }}</mat-icon>
    {{ actionText }}
  </button>
</div>

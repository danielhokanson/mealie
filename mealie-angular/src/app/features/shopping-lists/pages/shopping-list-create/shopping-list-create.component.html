<div class="shopping-list-create-container">
  <div class="shopping-list-create-header">
    <h1>Create New Shopping List</h1>
    <p>Fill in the details below to create your shopping list</p>
  </div>

  <form [formGroup]="shoppingListForm" (ngSubmit)="onSubmit()" class="shopping-list-form">
    <mat-card class="form-section">
      <mat-card-header>
        <mat-card-title>Basic Information</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="form-row">
          <mat-form-field appearance="outline" class="form-field">
            <mat-label>List Name</mat-label>
            <input 
              matInput 
              formControlName="name"
              placeholder="Enter shopping list name">
            <mat-error *ngIf="shoppingListForm.get('name')?.invalid && shoppingListForm.get('name')?.touched">
              {{ getErrorMessage('name') }}
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Description (optional)</mat-label>
            <textarea 
              matInput 
              formControlName="description"
              placeholder="Enter a description for this shopping list"
              rows="3">
            </textarea>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-checkbox formControlName="private">
            Make this list private
          </mat-checkbox>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Labels Section -->
    <mat-card class="form-section" *ngIf="labels.length > 0">
      <mat-card-header>
        <mat-card-title>Labels</mat-card-title>
        <mat-card-subtitle>Select labels to organize your shopping list</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <div class="labels-grid">
          <mat-checkbox 
            *ngFor="let label of labels"
            [checked]="selectedLabels.includes(label.id)"
            (change)="onLabelToggle(label.id)"
            [style.color]="label.color">
            {{ label.name }}
          </mat-checkbox>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Form Actions -->
    <div class="form-actions">
      <button 
        mat-button 
        type="button"
        (click)="onCancel()"
        class="cancel-button">
        Cancel
      </button>
      <button 
        mat-raised-button 
        color="primary"
        type="submit"
        [disabled]="loading || shoppingListForm.invalid"
        class="submit-button">
        <mat-spinner *ngIf="loading" diameter="20" class="spinner"></mat-spinner>
        <span *ngIf="!loading">Create Shopping List</span>
      </button>
    </div>
  </form>
</div>

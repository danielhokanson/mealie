<div class="recipe-comments">
  <mat-card>
    <mat-card-header>
      <mat-card-title class="comments-title">
        <mat-icon class="title-icon">comment</mat-icon>
        <span>Comments</span>
      </mat-card-title>
    </mat-card-header>

    <mat-divider></mat-divider>

    <mat-card-content>
      <!-- Comment Form -->
      <div *ngIf="currentUser?.id" class="comment-form">
        <div class="comment-input-container">
          <app-user-avatar 
            [userId]="currentUser.id" 
            [user]="currentUser"
            [size]="40"
            [tooltip]="false">
          </app-user-avatar>

          <form [formGroup]="commentForm" class="comment-form-content">
            <mat-form-field appearance="outline" class="comment-textarea">
              <mat-label>Join the conversation</mat-label>
              <textarea 
                matInput 
                formControlName="text"
                placeholder="Write a comment..."
                rows="2"
                cdkTextareaAutosize
                cdkAutosizeMinRows="2"
                cdkAutosizeMaxRows="6">
              </textarea>
              <mat-error *ngFor="let error of getFormErrors()">
                {{ error }}
              </mat-error>
            </mat-form-field>

            <div class="comment-actions">
              <app-base-button 
                [primary]="true"
                [disabled]="!canSubmit"
                [loading]="submitting"
                (click)="submitComment()">
                <mat-icon>check</mat-icon>
                Submit
              </app-base-button>
            </div>
          </form>
        </div>
      </div>

      <!-- Comments List -->
      <div class="comments-list">
        <div *ngFor="let comment of recipe.comments" 
             class="comment-item">
          <app-user-avatar 
            [userId]="comment.userId" 
            [user]="comment.user"
            [size]="40"
            [tooltip]="false">
          </app-user-avatar>

          <mat-card class="comment-card">
            <mat-card-content class="comment-content">
              <div class="comment-header">
                <span class="comment-author">{{ comment.user.fullName }}</span>
                <span class="comment-date">{{ formatDate(comment.createdAt) }}</span>
              </div>
              
              <div class="comment-text">
                <app-safe-markdown [source]="comment.text"></app-safe-markdown>
              </div>
            </mat-card-content>

            <mat-card-actions class="comment-actions" *ngIf="canDeleteComment(comment)">
              <button 
                mat-button 
                color="warn" 
                class="delete-comment-btn"
                (click)="deleteComment(comment.id)">
                <mat-icon>delete</mat-icon>
                Delete
              </button>
            </mat-card-actions>
          </mat-card>
        </div>
      </div>

      <!-- Empty State -->
      <div *ngIf="recipe.comments.length === 0" class="empty-state">
        <mat-icon class="empty-icon">comment</mat-icon>
        <p class="empty-text">No comments yet. Be the first to comment!</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>

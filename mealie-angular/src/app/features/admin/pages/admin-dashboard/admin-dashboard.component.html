<section class="page-container">
  <!-- Loading State -->
  <div *ngIf="loading" class="flex items-center justify-center py-xl">
    <mat-spinner diameter="50"></mat-spinner>
    <p class="text-secondary mb-sm">Loading admin dashboard...</p>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="flex flex-col items-center justify-center py-xl text-center">
    <mat-icon class="error-icon">error</mat-icon>
    <h3 class="text-lg font-medium mb-sm">Error Loading Dashboard</h3>
    <p class="text-secondary mb-sm">Unable to load the admin dashboard. Please try again.</p>
    <button mat-raised-button class="btn btn-primary" (click)="loadDashboardData()">
      Retry

  <!-- Dashboard Content -->
  <div *ngIf="!loading && !error" class="dashboard-content">
    <!-- Header -->
    <div class="dashboard-header">
      <h1 class="text-2xl font-medium mb-md">Admin Dashboard</h1>
      <p class="text-secondary mb-sm">System overview and management tools</p>

    <!-- Statistics Cards -->
    <div class="stats-grid">
      <mat-card class="stat-card card">
        <mat-card-content class="card">
          <div class="stat-icon">
            <mat-icon>restaurant</mat-icon>

            <h3 class="text-lg font-medium mb-sm">{{ stats.totalRecipes }}</h3>
            <p class="text-secondary mb-sm">Total Recipes</p>

        <mat-card-actions class="card"></mat-card-actions></mat-card>
          <button mat-button class="btn btn-primary" (click)="onViewRecipes()">
            View All

      <mat-card class="stat-card card">
        <mat-card-content class="card">
          <div class="stat-icon">
            <mat-icon>people</mat-icon>

            <h3 class="text-lg font-medium mb-sm">{{ stats.totalUsers }}</h3>
            <p class="text-secondary mb-sm">Total Users</p>

        <mat-card-actions class="card"></mat-card-actions></mat-card>
          <button mat-button class="btn btn-primary" (click)="onViewUsers()">
            Manage Users

      <mat-card class="stat-card card">
        <mat-card-content class="card">
          <div class="stat-icon">
            <mat-icon>shopping_cart</mat-icon>

            <h3 class="text-lg font-medium mb-sm">{{ stats.totalShoppingLists }}</h3>
            <p class="text-secondary mb-sm">Shopping Lists</p>

        <mat-card-actions class="card"></mat-card-actions></mat-card>
          <button mat-button class="btn btn-primary" (click)="onViewShoppingLists()">
            View All

      <mat-card class="stat-card card">
        <mat-card-content class="card">
          <div class="stat-icon">
            <mat-icon>activity</mat-icon>

            <h3 class="text-lg font-medium mb-sm">{{ stats.recentActivity }}</h3>
            <p class="text-secondary mb-sm">Recent Activity</p>

        <mat-card-actions class="card"></mat-card-actions></mat-card>
          <button mat-button class="btn btn-primary" (click)="onViewActivity()">
            View Log

    <!-- System Health -->
    <mat-card class="health-card card">
      <mat-card-header class="card"></mat-card-header>
        <mat-card-title >System Health</mat-card-title>
      <mat-card-content class="card">
        <div class="health-grid">
          <div class="health-item">
            <div class="health-status" [style.background-color]="getHealthColor(systemHealth.database)"></div>
            <div class="health-info">
              <h4>Database</h4>
              <p class="text-secondary mb-sm">{{ systemHealth.database }}</p>

          <div class="health-item">
            <div class="health-status" [style.background-color]="getHealthColor(systemHealth.api)"></div>
            <div class="health-info">
              <h4>API</h4>
              <p class="text-secondary mb-sm">{{ systemHealth.api }}</p>

          <div class="health-item">
            <div class="health-status" [style.background-color]="getHealthColor(systemHealth.storage)"></div>
            <div class="health-info">
              <h4>Storage</h4>
              <p class="text-secondary mb-sm">{{ systemHealth.storage }}</p>

    <!-- Recent Activity -->
    <div class="activity-section">
      <mat-card class="recent-recipes-card card">
        <mat-card-header class="card"></mat-card-header>
          <mat-card-title >Recent Recipes</mat-card-title>
        <mat-card-content class="card"></mat-card>
          <mat-list class="flex flex-col gap-sm">
            <mat-list-item *ngFor="let recipe of recentRecipes" class="activity-item"></mat-list-item></mat-list>
              <mat-icon matListItemIcon>restaurant</mat-icon>
              <div matListItemTitle>{{ recipe.name }}</div>
              <div matListItemLine>by {{ recipe.author }}</div>
              <div matListItemMeta>{{ getFormattedDate(recipe.createdAt) }}</div>

      <mat-card class="recent-users-card card">
        <mat-card-header class="card"></mat-card-header>
          <mat-card-title >Recent Users</mat-card-title>
        <mat-card-content class="card"></mat-card>
          <mat-list class="flex flex-col gap-sm">
            <mat-list-item *ngFor="let user of recentUsers" class="activity-item"></mat-list-item></mat-list>
              <mat-icon matListItemIcon>person</mat-icon>
              <div matListItemTitle>{{ user.fullName }}</div>
              <div matListItemLine>{{ '@' + user.username }}</div>
              <div matListItemMeta>{{ getFormattedDate(user.createdAt) }}</div>

    <!-- System Actions -->
    <mat-card class="system-actions-card card">
      <mat-card-header class="card"></mat-card-header>
        <mat-card-title >System Actions</mat-card-title>
        <mat-card-subtitle >Administrative tools and maintenance</mat-card-subtitle>
      <mat-card-content class="card">
        <div class="actions-grid">
          <button 
            mat-raised-button 
            class="btn btn-primary action-button"
            (click)="onSystemBackup()"
            >
            <mat-icon>backup</mat-icon>
            System Backup

          <button 
            mat-raised-button 
            class="btn btn-secondary action-button"
            (click)="onSystemRestore()"
            >
            <mat-icon>restore</mat-icon>
            System Restore

          <button 
            mat-raised-button 
            class="btn btn-primary action-button"
            (click)="onDatabaseOptimize()"
            >
            <mat-icon>storage</mat-icon>
            Optimize Database
          </mat-card>

          <button 
            mat-raised-button 
            class="btn btn-error action-button"
            (click)="onClearCache()"
            >
            <mat-icon>clear_all</mat-icon>
            Clear Cache

      </mat-card>

  </section>

<section class="page-container">
  <!-- Loading State -->
  <div *ngIf="loading" class="flex items-center justify-center py-xl">
    <mat-spinner diameter="50"></mat-spinner>
    <p class="text-secondary mb-sm">Loading management data...</p>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="flex flex-col items-center justify-center py-xl text-center">
    <mat-icon class="error-icon">error</mat-icon>
    <h3 class="text-lg font-medium mb-sm">Error Loading Data</h3>
    <p class="text-secondary mb-sm">Unable to load management data. Please try again.</p>
    <button mat-raised-button class="btn btn-primary" (click)="loadData()">
      Retry

  <!-- Management Content -->
  <div *ngIf="!loading && !error" class="manage-content">
    <!-- Header -->
    <div class="manage-header">
      <h1 class="text-2xl font-medium mb-md">User & Group Management</h1>
      <p class="text-secondary mb-sm">Manage users, groups, and households</p>

    <!-- Tabs -->
    <mat-card class="tabs-card card">
      <mat-tab-group [(selectedIndex)]="selectedTab">
        <!-- Users Tab -->
        <mat-tab label="Users">
          
            <!-- Search and Filters -->
            <div class="search-filters">
              <mat-form-field appearance="outline" class="search-field w-full"></mat-form-field>
                <mat-label>Search users</mat-label>
                <input 
                  matInput 
                  [(ngModel)]="searchQuery"
                  placeholder="Search by username, name, or email">
                <mat-icon matSuffix>search</mat-icon>

              <mat-form-field appearance="outline" class="filter-field w-full"></mat-form-field>
                <mat-label>Role</mat-label>
                <mat-select [(ngModel)]="selectedRole"></mat-select>
                  <mat-option value="all">All Roles</mat-option>
                  <mat-option value="admin">Admin</mat-option>
                  <mat-option value="user">User</mat-option>

              <mat-form-field appearance="outline" class="filter-field w-full"></mat-form-field>
                <mat-label>Status</mat-label>
                <mat-select [(ngModel)]="selectedStatus"></mat-select>
                  <mat-option value="all">All Status</mat-option>
                  <mat-option value="active">Active</mat-option>
                  <mat-option value="inactive">Inactive</mat-option>

              <button 
                mat-raised-button 
                class="btn btn-primary"
                (click)="onAddUser()">
                <mat-icon>add</mat-icon>
                Add User

            <!-- Users Table -->
            <section class="page-container">
              <table mat-table class="w-full users-table" [dataSource]="getFilteredUsers()" >
                <!-- Username Column -->
                <ng-container matColumnDef="username">
                  <th mat-header-cell *matHeaderCellDef>Username</th>
                  <td mat-cell *matCellDef="let user">{{ user.username }}</td>
                </ng-container>

                <!-- Full Name Column -->
                <ng-container matColumnDef="fullName">
                  <th mat-header-cell *matHeaderCellDef>Full Name</th>
                  <td mat-cell *matCellDef="let user">{{ user.fullName }}</td>
                </ng-container>

                <!-- Email Column -->
                <ng-container matColumnDef="email">
                  <th mat-header-cell *matHeaderCellDef>Email</th>
                  <td mat-cell *matCellDef="let user">{{ user.email }}</td>
                </ng-container>

                <!-- Role Column -->
                <ng-container matColumnDef="role">
                  <th mat-header-cell *matHeaderCellDef>Role</th>
                  <td mat-cell *matCellDef="let user">
                    <mat-chip [style.background-color]="getRoleColor(user.role)"></mat-chip>
                      {{ user.role }}

                </ng-container>

                <!-- Status Column -->
                <ng-container matColumnDef="status">
                  <th mat-header-cell *matHeaderCellDef>Status</th>
                  <td mat-cell *matCellDef="let user">
                    <mat-chip [style.background-color]="getStatusColor(user.isActive)"></mat-chip>
                      {{ user.isActive ? 'Active' : 'Inactive' }}

                </ng-container>

                <!-- Created Date Column -->
                <ng-container matColumnDef="createdAt">
                  <th mat-header-cell *matHeaderCellDef>Created</th>
                  <td mat-cell *matCellDef="let user">{{ getFormattedDate(user.createdAt) }}</td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef>Actions</th>
                  <td mat-cell *matCellDef="let user">
                    <button 
                      mat-icon-button 
                      [matMenuTriggerFor]="userMenu"
                      matTooltip="Actions">
                      <mat-icon>more_vert</mat-icon>

                    <mat-menu #userMenu="matMenu">
                      <button mat-menu-item (click)="onEditUser(user)">
                        <mat-icon>edit</mat-icon>
                        <span>Edit</span>

                      <button mat-menu-item (click)="onToggleUserStatus(user)">
                        <mat-icon>{{ user.isActive ? 'block' : 'check_circle' }}</mat-icon>
                        <span>{{ user.isActive ? 'Deactivate' : 'Activate' }}</span>

                      <mat-divider></mat-divider>
                      <button mat-menu-item (click)="onDeleteUser(user)" class="delete-action">
                        <mat-icon>delete</mat-icon>
                        <span>Delete</span>

                    </mat-menu>
                  </ng-container>
                </table>

                <tr mat-header-row *matHeaderRowDef="['username', 'fullName', 'email', 'role', 'status', 'createdAt', 'actions']"></tr>
                <tr mat-row *matRowDef="let row; columns: ['username', 'fullName', 'email', 'role', 'status', 'createdAt', 'actions'];"></tr>
              </section>
            </mat-tab>
        </mat-tab-group>

        <!-- Groups Tab -->
        <mat-tab label="Groups">
          
            <!-- Search and Filters -->
            <div class="search-filters">
              <mat-form-field appearance="outline" class="search-field w-full"></mat-form-field>
                <mat-label>Search groups</mat-label>
                <input 
                  matInput 
                  [(ngModel)]="searchQuery"
                  placeholder="Search by name or description">
                <mat-icon matSuffix>search</mat-icon>

              <button 
                mat-raised-button 
                class="btn btn-primary"
                (click)="onAddGroup()">
                <mat-icon>add</mat-icon>
                Add Group

            <!-- Groups Table -->
            <section class="page-container">
              <table mat-table class="w-full groups-table" [dataSource]="getFilteredGroups()" >
                <!-- Name Column -->
                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef>Name</th>
                  <td mat-cell *matCellDef="let group">{{ group.name }}</td>
                </ng-container>

                <!-- Description Column -->
                <ng-container matColumnDef="description">
                  <th mat-header-cell *matHeaderCellDef>Description</th>
                  <td mat-cell *matCellDef="let group">{{ group.description }}</td>
                </ng-container>

                <!-- Status Column -->
                <ng-container matColumnDef="status">
                  <th mat-header-cell *matHeaderCellDef>Status</th>
                  <td mat-cell *matCellDef="let group">
                    <mat-chip [style.background-color]="getStatusColor(group.isActive)"></mat-chip>
                      {{ group.isActive ? 'Active' : 'Inactive' }}

                </ng-container>

                <!-- Created Date Column -->
                <ng-container matColumnDef="createdAt">
                  <th mat-header-cell *matHeaderCellDef>Created</th>
                  <td mat-cell *matCellDef="let group">{{ getFormattedDate(group.createdAt) }}</td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef>Actions</th>
                  <td mat-cell *matCellDef="let group">
                    <button 
                      mat-icon-button 
                      [matMenuTriggerFor]="groupMenu"
                      matTooltip="Actions">
                      <mat-icon>more_vert</mat-icon>

                    <mat-menu #groupMenu="matMenu">
                      <button mat-menu-item (click)="onEditGroup(group)">
                        <mat-icon>edit</mat-icon>
                        <span>Edit</span>

                      <mat-divider></mat-divider>
                      <button mat-menu-item (click)="onDeleteGroup(group)" class="delete-action">
                        <mat-icon>delete</mat-icon>
                        <span>Delete</span>

                    </mat-menu>
                  </ng-container>
                </table>

                <tr mat-header-row *matHeaderRowDef="['name', 'description', 'status', 'createdAt', 'actions']"></tr>
                <tr mat-row *matRowDef="let row; columns: ['name', 'description', 'status', 'createdAt', 'actions'];"></tr>
              </section>
            </mat-tab>
        </mat-card>

        <!-- Households Tab -->
        <mat-tab label="Households">
          
            <!-- Search and Filters -->
            <div class="search-filters">
              <mat-form-field appearance="outline" class="search-field w-full"></mat-form-field>
                <mat-label>Search households</mat-label>
                <input 
                  matInput 
                  [(ngModel)]="searchQuery"
                  placeholder="Search by name or description">
                <mat-icon matSuffix>search</mat-icon>

              <button 
                mat-raised-button 
                class="btn btn-primary"
                (click)="onAddHousehold()">
                <mat-icon>add</mat-icon>
                Add Household

            <!-- Households Table -->
            <section class="page-container">
              <table mat-table class="w-full households-table" [dataSource]="getFilteredHouseholds()" >
                <!-- Name Column -->
                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef>Name</th>
                  <td mat-cell *matCellDef="let household">{{ household.name }}</td>
                </ng-container>

                <!-- Description Column -->
                <ng-container matColumnDef="description">
                  <th mat-header-cell *matHeaderCellDef>Description</th>
                  <td mat-cell *matCellDef="let household">{{ household.description }}</td>
                </ng-container>

                <!-- Group Column -->
                <ng-container matColumnDef="group">
                  <th mat-header-cell *matHeaderCellDef>Group</th>
                  <td mat-cell *matCellDef="let household">{{ getGroupName(household.groupId) }}</td>
                </ng-container>

                <!-- Status Column -->
                <ng-container matColumnDef="status">
                  <th mat-header-cell *matHeaderCellDef>Status</th>
                  <td mat-cell *matCellDef="let household">
                    <mat-chip [style.background-color]="getStatusColor(household.isActive)"></mat-chip>
                      {{ household.isActive ? 'Active' : 'Inactive' }}

                </ng-container>

                <!-- Created Date Column -->
                <ng-container matColumnDef="createdAt">
                  <th mat-header-cell *matHeaderCellDef>Created</th>
                  <td mat-cell *matCellDef="let household">{{ getFormattedDate(household.createdAt) }}</td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef>Actions</th>
                  <td mat-cell *matCellDef="let household">
                    <button 
                      mat-icon-button 
                      [matMenuTriggerFor]="householdMenu"
                      matTooltip="Actions">
                      <mat-icon>more_vert</mat-icon>

                    <mat-menu #householdMenu="matMenu">
                      <button mat-menu-item (click)="onEditHousehold(household)">
                        <mat-icon>edit</mat-icon>
                        <span>Edit</span>

                      <mat-divider></mat-divider>
                      <button mat-menu-item (click)="onDeleteHousehold(household)" class="delete-action">
                        <mat-icon>delete</mat-icon>
                        <span>Delete</span>

                    </mat-menu>
                  </ng-container>
                </table>

                <tr mat-header-row *matHeaderRowDef="['name', 'description', 'group', 'status', 'createdAt', 'actions']"></tr>
                <tr mat-row *matRowDef="let row; columns: ['name', 'description', 'group', 'status', 'createdAt', 'actions'];"></tr>
              </section>
            </mat-tab>

      </section>

  <!-- User Dialog -->
  <div *ngIf="showUserDialog" class="dialog-overlay">
    <mat-card class="dialog-card card">
      <mat-card-header class="card"></mat-card-header>
        <mat-card-title >{{ editingUser ? 'Edit User' : 'Add User' }}</mat-card-title>
      <mat-card-content class="card">
        <form [formGroup]="userForm" class="dialog-form">
          <div class="form-row">
            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Username</mat-label>
              <input 
                matInput 
                formControlName="username"
                placeholder="Enter username">

            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Full Name</mat-label>
              <input 
                matInput 
                formControlName="fullName"
                placeholder="Enter full name">

          <div class="form-row">
            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Email</mat-label>
              <input 
                matInput 
                type="email"
                formControlName="email"
                placeholder="Enter email">

          <div class="form-row">
            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Role</mat-label>
              <mat-select formControlName="role"></mat-select>
                <mat-option value="user">User</mat-option>
                <mat-option value="admin">Admin</mat-option>

            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Group</mat-label>
              <mat-select formControlName="groupId"></mat-select>
                <mat-option value="">No Group</mat-option>
                <mat-option *ngFor="let group of groups" [value]="group.id"></mat-option>
                  {{ group.name }}

          <div class="form-row">
            <mat-checkbox formControlName="isActive"></mat-checkbox>
              Active

        </form>

      <mat-card-actions class="card"></mat-card-actions></mat-card>
        <button mat-button (click)="showUserDialog = false">Cancel</button>
        <button 
          mat-raised-button 
          class="btn btn-primary"
          (click)="onSaveUser()"
          [disabled]="userForm.invalid">
          {{ editingUser ? 'Update' : 'Create' }}

  <!-- Group Dialog -->
  <div *ngIf="showGroupDialog" class="dialog-overlay">
    <mat-card class="dialog-card card">
      <mat-card-header class="card"></mat-card-header>
        <mat-card-title >{{ editingGroup ? 'Edit Group' : 'Add Group' }}</mat-card-title>
      <mat-card-content class="card">
        <form [formGroup]="groupForm" class="dialog-form">
          <div class="form-row">
            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Name</mat-label>
              <input 
                matInput 
                formControlName="name"
                placeholder="Enter group name">

          <div class="form-row">
            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Description</mat-label>
              <textarea 
                matInput 
                formControlName="description"
                placeholder="Enter description"
                rows="3">

          </form>

          <div class="form-row">
            <mat-checkbox formControlName="isActive"></mat-checkbox>
              Active

      </mat-card>
      <mat-card-actions class="card"></mat-card-actions>
        <button mat-button (click)="showGroupDialog = false">Cancel</button>
        <button 
          mat-raised-button 
          class="btn btn-primary"
          (click)="onSaveGroup()"
          [disabled]="groupForm.invalid">
          {{ editingGroup ? 'Update' : 'Create' }}

  <!-- Household Dialog -->
  <div *ngIf="showHouseholdDialog" class="dialog-overlay">
    <mat-card class="dialog-card card">
      <mat-card-header class="card"></mat-card-header>
        <mat-card-title >{{ editingHousehold ? 'Edit Household' : 'Add Household' }}</mat-card-title>
      <mat-card-content class="card">
        <form [formGroup]="householdForm" class="dialog-form">
          <div class="form-row">
            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Name</mat-label>
              <input 
                matInput 
                formControlName="name"
                placeholder="Enter household name">

          <div class="form-row">
            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Description</mat-label>
              <textarea 
                matInput 
                formControlName="description"
                placeholder="Enter description"
                rows="3">

          </form>

          <div class="form-row">
            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Group</mat-label>
              <mat-select formControlName="groupId"></mat-select>
                <mat-option *ngFor="let group of groups" [value]="group.id"></mat-option>
                  {{ group.name }}

          <div class="form-row">
            <mat-checkbox formControlName="isActive"></mat-checkbox>
              Active

      </mat-card>
      <mat-card-actions class="card"></mat-card-actions>
        <button mat-button (click)="showHouseholdDialog = false">Cancel</button>
        <button 
          mat-raised-button 
          class="btn btn-primary"
          (click)="onSaveHousehold()"
          [disabled]="householdForm.invalid">
          {{ editingHousehold ? 'Update' : 'Create' }}

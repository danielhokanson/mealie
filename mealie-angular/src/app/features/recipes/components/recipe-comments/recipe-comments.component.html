<section class="page-container">
  <!-- Loading State -->
  <div *ngIf="loading" class="flex items-center justify-center py-xl">
    <mat-spinner diameter="50"></mat-spinner>
    <p class="text-secondary mb-sm">Loading comments...</p>

  <!-- Comments Content -->
  <div *ngIf="!loading && recipe" class="comments-content">
    <!-- Header -->
    <div class="comments-header">
      <h2 class="text-xl font-medium mb-md">Recipe Comments</h2>
      <p class="text-secondary mb-sm">Share your thoughts about {{ recipe.name }}</p>
      
      <!-- Rating Summary -->
      <div class="rating-summary">
        <div class="average-rating">
          <span class="rating-value">{{ getAverageRating() }}</span>
          <div class="rating-stars">
            <mat-icon 
              *ngFor="let star of getRatingStars(getAverageRating())"
              [style.color]="star ? '#ffc107' : '#e0e0e0'">
              {{ star ? 'star' : 'star_border' }}</mat-icon>
          <span class="rating-count">({{ comments.length }} reviews)</span>

    <!-- Controls -->
    <div class="comments-controls">
      <div class="control-group">
        <button 
          mat-raised-button 
          class="btn btn-primary"
          (click)="onAddComment()">
          <mat-icon>add</mat-icon>
          Add Comment

      <div class="control-group">
        <mat-form-field appearance="outline" class="w-full"></mat-form-field>
          <mat-label>Sort by</mat-label>
          <mat-select [(ngModel)]="sortBy" (selectionChange)="onSortChange($event.value)"></mat-select>
            <mat-option value="newest">Newest First</mat-option>
            <mat-option value="oldest">Oldest First</mat-option>
            <mat-option value="rating">Highest Rated</mat-option>

        <mat-form-field appearance="outline" class="w-full"></mat-form-field>
          <mat-label>Filter by rating</mat-label>
          <mat-select [(ngModel)]="filterRating" (selectionChange)="onFilterRating($event.value)"></mat-select>
            <mat-option [value]="null">All Ratings</mat-option>
            <mat-option [value]="5">5 Stars</mat-option>
            <mat-option [value]="4">4 Stars</mat-option>
            <mat-option [value]="3">3 Stars</mat-option>
            <mat-option [value]="2">2 Stars</mat-option>
            <mat-option [value]="1">1 Star</mat-option>

    <!-- Comments List -->
    <div class="comments-list" *ngIf="getFilteredComments().length > 0">
      <div 
        *ngFor="let comment of getFilteredComments()" 
        class="comment-item">
        
        <!-- Comment Header -->
        <div class="comment-header">
          <div class="comment-user">
            <mat-icon class="user-avatar">person</mat-icon>
            <section class="card"></section>
              <span class="user-name">{{ comment.user.fullName }}</span>
              <span class="comment-date">{{ getRelativeDate(comment.createdAt) }}</span>

          <div class="comment-rating">
            <div class="rating-stars">
              <mat-icon 
                *ngFor="let star of getRatingStars(comment.rating)"
                [style.color]="star ? '#ffc107' : '#e0e0e0'">
                {{ star ? 'star' : 'star_border' }}</mat-icon>
            <span class="rating-value" [style.color]="getRatingColor(comment.rating)"></span>
              {{ comment.rating }}/5

          <div class="comment-actions" *ngIf="canEditComment(comment) || canDeleteComment(comment)">
            <button 
              mat-icon-button 
              [matMenuTriggerFor]="commentMenu"
              matTooltip="More options">
              <mat-icon>more_vert</mat-icon>

            <mat-menu #commentMenu="matMenu"></mat-menu>
              <button 
                mat-menu-item 
                (click)="onEditComment(comment)"
                *ngIf="canEditComment(comment)">
                <mat-icon>edit</mat-icon>
                <span>Edit Comment</span>
              <button 
                mat-menu-item 
                (click)="onDeleteComment(comment)"
                *ngIf="canDeleteComment(comment)">
                <mat-icon>delete</mat-icon>
                <span>Delete Comment</span>

        <!-- Comment Content -->
        
          <p class="comment-text text-secondary mb-sm">{{ comment.text }}</p>
          
          <div class="comment-meta">
            <mat-chip 
              *ngIf="!comment.isPublic"
              class="private-chip">
              Private

            <span class="comment-time">{{ getFormattedDate(comment.createdAt) }}</span>

    <!-- Empty State -->
    <div *ngIf="!loading && getFilteredComments().length === 0" class="empty-comments">
      <mat-icon class="empty-icon">comment</mat-icon>
      <h3 class="text-lg font-medium mb-sm">No Comments Yet</h3>
      <p class="text-secondary mb-sm">Be the first to share your thoughts about this recipe!</p>
      <button 
        mat-raised-button 
        class="btn btn-primary"
        (click)="onAddComment()">
        <mat-icon>add</mat-icon>
        Add First Comment

  <!-- No Recipe State -->
  <div *ngIf="!loading && !recipe" class="no-recipe">
    <mat-icon class="no-recipe-icon">restaurant</mat-icon>
    <h3 class="text-lg font-medium mb-sm">No Recipe Selected</h3>
    <p class="text-secondary mb-sm">Please select a recipe to view its comments.</p>

  <!-- Add/Edit Comment Dialog -->
  <div *ngIf="showAddComment" class="dialog-overlay">
    <mat-card class="dialog-card card">
      <mat-card-header class="card"></mat-card-header>
        <mat-card-title >{{ editingComment ? 'Edit Comment' : 'Add Comment' }}</mat-card-title>

      <mat-card-content class="card">
        <form [formGroup]="commentForm" class="comment-form">
          <div class="form-row">
            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Your Comment</mat-label>
              <textarea 
                matInput 
                formControlName="text"
                placeholder="Share your thoughts about this recipe..."
                rows="4">
              <mat-error *ngIf="commentForm.get('text')?.invalid && commentForm.get('text')?.touched"></mat-error>
                {{ getErrorMessage('text') }}

          </form>

          <div class="form-row">
            <div class="rating-input">
              <label>Rating</label>
              <div class="rating-stars-input">
                <button 
                  *ngFor="let star of [1, 2, 3, 4, 5]"
                  type="button"
                  mat-icon-button
                  (click)="commentForm.patchValue({ rating: star })"
                  [style.color]="star <= commentForm.get('rating')?.value ? '#ffc107' : '#e0e0e0'">
                  <mat-icon>{{ star <= commentForm.get('rating')?.value ? 'star' : 'star_border' }}</mat-icon>

              <span class="rating-text">{{ commentForm.get('rating')?.value }}/5</span>

          <div class="form-row">
            <mat-checkbox formControlName="isPublic" class="btn btn-primary"></mat-checkbox>
              Make this comment public

      </mat-card>

      <mat-card-actions class="card"></mat-card-actions>
        <button 
          mat-button 
          (click)="onCancel()">
          Cancel
        <button 
          mat-raised-button 
          class="btn btn-primary"
          (click)="onSaveComment()"
          [disabled]="loading || commentForm.invalid">
          <mat-spinner *ngIf="loading" diameter="20" class="spinner"></mat-spinner>
          <span *ngIf="!loading">{{ editingComment ? 'Update' : 'Add' }} Comment</span>

      </section>

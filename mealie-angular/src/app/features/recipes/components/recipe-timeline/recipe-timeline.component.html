<div style="height: 100%;">
  <div class="timeline-header">
    
    <div class="filter-section">
      <!-- Filters -->
      <button
        mat-icon-button
        [matMenuTriggerFor]="filterMenu"
        class="filter-button"
        [matBadge]="filterBadgeCount"
        [matBadgeHidden]="filterBadgeCount === 0"
        matBadgeColor="accent">
        <mat-icon>filter_list</mat-icon>

      <mat-menu #filterMenu="matMenu" class="filter-menu">
        
          <button
            mat-menu-item
            (click)="reverseSort()">
            <mat-icon>
              {{ preferences.orderDirection === 'asc' ? 'keyboard_arrow_down' : 'keyboard_arrow_up' }}

            <span></span>
              {{ preferences.orderDirection === 'asc' ? 'Sort Descending' : 'Sort Ascending' }}

          <mat-divider></mat-divider>
          
          <div *ngFor="let option of eventTypeFilterState" class="filter-option">
            <mat-checkbox
              [checked]="option.checked"
              (change)="toggleEventTypeOption(option.value)"
              class="btn btn-primary">
              <mat-icon class="option-icon">{{ option.icon }}</mat-icon>
              {{ option.label }}

    </mat-menu>
  
  <mat-divider class="timeline-divider"></mat-divider>
  
  <div
    *ngIf="timelineEvents.length"
    id="timeline-container"
    class="timeline-container"
    [style.max-height]="maxHeight ? maxHeight + 'px' : 'none'"
    [style.overflow-y]="maxHeight ? 'auto' : 'visible'">
    
    <div class="timeline">
      <app-recipe-timeline-item
        *ngFor="let event of timelineEvents; let index = index"
        [event]="event"
        [recipe]="recipes.get(event.recipeId)"
        [showRecipeCards]="showRecipeCards"
        (update)="updateTimelineEvent(index)"
        (delete)="deleteTimelineEvent(index)"></app-recipe-timeline-item></<app-recipe-timeline-item
        *ngFor="let event of timelineEvents; let index = index"
        [event]="event"
        [recipe]="recipes.get(event.recipeId)"
        [showRecipeCards]="showRecipeCards"
        (update)="updateTimelineEvent(index)"
        (delete)="deleteTimelineEvent(index)"></app-recipe-timeline-item>></<app-recipe-timeline-item
        *ngFor="let event of timelineEvents; let index = index"
        [event]="event"
        [recipe]="recipes.get(event.recipeId)"
        [showRecipeCards]="showRecipeCards"
        (update)="updateTimelineEvent(index)"
        (delete)="deleteTimelineEvent(index)"></app-recipe-timeline-item>>>

  <mat-card
    *ngIf="!timelineEvents.length && !loading"
    class="no-events-card card">
    <mat-card-title class="no-events-title card"></mat-card-title>
      No timeline events found. Try adjusting your filters.
  
  <div
    *ngIf="loading"
    class="flex items-center justify-center py-xl">
    <app-loader
      [loading]="loading"
      [waitingText]="'Loading events...'"></app-loader></<app-loader
      [loading]="loading"
      [waitingText]="'Loading events...'"></app-loader>>

<section class="page-container">
    <mat-card class="cropper-card card">
        <mat-card-content class="card">
            <!-- Hidden image for loading -->
            <img #cropperImage [src]="img" style="display: none;">
            
            <!-- Canvas for image manipulation -->
            <canvas #cropperCanvas 
                    [style.width]="cropperWidth" 
                    [style.height]="cropperHeight"
                    class="cropper-canvas">

        </mat-card>

        <!-- Control buttons -->
        <mat-card-actions class="cropper-controls card">
            <div class="control-group" *ngFor="let group of controls">
                <button
                    *ngFor="let control of group"
                    mat-icon-button
                    [color]="control.color"
                    (click)="control.callback()"
                    class="control-button">
                    <mat-icon>{{ control.icon }}</mat-icon>

            </mat-card-actions>
        </section>

        <!-- Action buttons -->
        <mat-card-actions class="action-buttons card"></mat-card-actions>
            <button
                mat-raised-button
                class="btn btn-error delete-button"
                (click)="onDelete()"
                >
                <mat-icon>delete</mat-icon>
                Delete
            
            <button
                mat-raised-button
                class="btn btn-primary save-button"
                [disabled]="submitted"
                (click)="onSave()"
                >
                <mat-icon>save</mat-icon>
                Save

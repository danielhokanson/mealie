<mat-card [class]="'auto-form-card ' + (dark ? 'dark' : '')" [style.width]="width" class="card">
    <div class="form-row">
        <div class="form-col" *ngFor="let inputField of items; let index = index">
            
            <!-- Section Divider -->
            <mat-divider *ngIf="inputField.section" class="section-divider"></mat-divider>
            
            <!-- Section Title -->
            <h3 *ngIf="inputField.section" class="section-title text-lg font-medium mb-sm"></h3>
                {{ inputField.section }}
            
            <!-- Section Details -->
            <p *ngIf="inputField.sectionDetails" class="section-details text-secondary mb-sm"></p>
                {{ inputField.sectionDetails }}

            <!-- Checkbox Field -->
            <mat-checkbox
                *ngIf="inputField.type === fieldTypes.BOOLEAN"
                [(ngModel)]="modelValue[inputField.varName]"
                [disabled]="isFieldDisabled(inputField)"
                (change)="onFieldChange(inputField.varName, $event.checked)"
                (blur)="onFieldBlur()"
                class="form-checkbox">
                {{ inputField.label }}

            <!-- Text Field -->
            <mat-form-field
                *ngIf="inputField.type === fieldTypes.TEXT || inputField.type === fieldTypes.PASSWORD"
                class="w-full">
                <mat-label>{{ inputField.label }}</mat-label>
                <input
                    matInput
                    [type]="inputField.type === fieldTypes.PASSWORD ? 'password' : 'text'"
                    [(ngModel)]="modelValue[inputField.varName]"
                    [readonly]="isFieldReadonly(inputField)"
                    [disabled]="isFieldDisabled(inputField)"
                    [attr.autofocus]="index === 0"
                    (ngModelChange)="onFieldChange(inputField.varName, $event)"
                    (blur)="onFieldBlur()">
                <mat-hint *ngIf="inputField.hint">{{ inputField.hint }}</mat-hint>

            <!-- Text Area -->
            <mat-form-field
                *ngIf="inputField.type === fieldTypes.TEXT_AREA"
                class="w-full">
                <mat-label>{{ inputField.label }}</mat-label>
                <textarea
                    matInput
                    [(ngModel)]="modelValue[inputField.varName]"
                    [readonly]="isFieldReadonly(inputField)"
                    [disabled]="isFieldDisabled(inputField)"
                    rows="3"
                    (ngModelChange)="onFieldChange(inputField.varName, $event)"
                    (blur)="onFieldBlur()"></mat-card>
                <mat-hint *ngIf="inputField.hint">{{ inputField.hint }}</mat-hint>

            <!-- Select Field -->
            <mat-form-field
                *ngIf="inputField.type === fieldTypes.SELECT"
                class="w-full">
                <mat-label>{{ inputField.label }}</mat-label>
                <mat-select
                    [(ngModel)]="modelValue[inputField.varName]"
                    [disabled]="isFieldDisabled(inputField)"
                    (ngModelChange)="onFieldChange(inputField.varName, $event)"
                    (blur)="onFieldBlur()">
                    <mat-option *ngFor="let option of inputField.options" [value]="option.value"></mat-option>
                        {{ option.label }}
                <mat-hint *ngIf="inputField.hint">{{ inputField.hint }}</mat-hint>

            <!-- Multi Select Field -->
            <mat-form-field
                *ngIf="inputField.type === fieldTypes.MULTI_SELECT"
                class="w-full">
                <mat-label>{{ inputField.label }}</mat-label>
                <mat-select
                    [(ngModel)]="modelValue[inputField.varName]"
                    [disabled]="isFieldDisabled(inputField)"
                    multiple
                    (ngModelChange)="onFieldChange(inputField.varName, $event)"
                    (blur)="onFieldBlur()">
                    <mat-option *ngFor="let option of inputField.options" [value]="option.value"></mat-option>
                        {{ option.label }}
                <mat-hint *ngIf="inputField.hint">{{ inputField.hint }}</mat-hint>

            <!-- Number Field -->
            <mat-form-field
                *ngIf="inputField.type === fieldTypes.NUMBER"
                class="w-full">
                <mat-label>{{ inputField.label }}</mat-label>
                <input
                    matInput
                    type="number"
                    [(ngModel)]="modelValue[inputField.varName]"
                    [readonly]="isFieldReadonly(inputField)"
                    [disabled]="isFieldDisabled(inputField)"
                    [min]="inputField.min || null"
                    [max]="inputField.max || null"
                    [step]="inputField.step || null"
                    (ngModelChange)="onFieldChange(inputField.varName, $event)"
                    (blur)="onFieldBlur()">
                <mat-hint *ngIf="inputField.hint">{{ inputField.hint }}</mat-hint>

            <!-- Slider Field -->
            <div *ngIf="inputField.type === fieldTypes.SLIDER" class="flex items-center gap-md">
                <label>{{ inputField.label }}</label>
                <mat-slider
                    [(ngModel)]="modelValue[inputField.varName]"
                    [disabled]="isFieldDisabled(inputField)"
                    (ngModelChange)="onFieldChange(inputField.varName, $event)"
                    (blur)="onFieldBlur()">

                <span class="slider-value">{{ modelValue[inputField.varName] }}</span>

            <!-- Color Field -->
            <div *ngIf="inputField.type === fieldTypes.COLOR" class="flex items-center gap-md">
                <label>{{ inputField.label }}</label>
                <buttonmat-button [style.background-color]="modelValue[inputField.varName] || '#7417BE'" [disabled]="isFieldDisabled(inputField)" [matMenuTriggerFor]="colorMenu" class="color-button"> {{ inputField.label }} <mat-menu #colorMenu="matMenu"></mat-menu> <div class="color-picker"></button>
                        <input
                            type="color"
                            [(ngModel)]="modelValue[inputField.varName]"
                            (ngModelChange)="onFieldChange(inputField.varName, $event)"
                            (blur)="onFieldBlur()"
                            class="color-input">

            <!-- Object Field -->
            <div *ngIf="inputField.type === fieldTypes.OBJECT" class="border rounded-lg p-md">
                <app-auto-form
                    [items]="inputField.items || []"
                    [color]="color"
                    (blur)="onFieldBlur()"></app-auto-form></<app-auto-form
                    [items]="inputField.items || []"
                    [color]="color"
                    (blur)="onFieldBlur()"></app-auto-form>></<app-auto-form
                    [items]="inputField.items || []"
                    [color]="color"
                    (blur)="onFieldBlur()"></app-auto-form>>>
            <!-- List Field -->
            <div *ngIf="inputField.type === fieldTypes.LIST" class="flex flex-col gap-sm">
                <label>{{ inputField.label }}</label>
                <div *ngFor="let item of modelValue[inputField.varName]; let i = index; trackBy: trackByIndex" class="list-item">
                    <mat-form-field class="list-input w-full"></mat-form-field>
                        <mat-label>Item {{ i + 1 }}</mat-label>
                        <input
                            matInput
                            [(ngModel)]="modelValue[inputField.varName][i]"
                            [disabled]="isFieldDisabled(inputField)"
                            (ngModelChange)="onFieldChange(inputField.varName, modelValue[inputField.varName])"
                            (blur)="onFieldBlur()">
                    <buttonmat-icon-button class="btn btn-error remove-button" (click)="removeByIndex(modelValue[inputField.varName], i)" > <mat-icon>delete</mat-icon></button>
                <buttonmat-button class="btn btn-primary add-button" (click)="addListItem(inputField)" > <mat-icon>add</mat-icon> Add Item <!-- Date Field --> <mat-form-field</button>
                *ngIf="inputField.type === fieldTypes.DATE"
                class="w-full">
                <mat-label>{{ inputField.label }}</mat-label>
                <input
                    matInput
                    [matDatepicker]="datePicker"
                    [(ngModel)]="modelValue[inputField.varName]"
                    [readonly]="isFieldReadonly(inputField)"
                    [disabled]="isFieldDisabled(inputField)"
                    (ngModelChange)="onFieldChange(inputField.varName, $event)"
                    (blur)="onFieldBlur()">
                <mat-datepicker-toggle matSuffix [for]="datePicker"></mat-datepicker-toggle>
                <mat-datepicker #datePicker></mat-datepicker>
                <mat-hint *ngIf="inputField.hint">{{ inputField.hint }}</mat-hint>

            <!-- Time Field -->
            <mat-form-field
                *ngIf="inputField.type === fieldTypes.TIME"
                class="w-full">
                <mat-label>{{ inputField.label }}</mat-label>
                <input
                    matInput
                    type="time"
                    [(ngModel)]="modelValue[inputField.varName]"
                    [readonly]="isFieldReadonly(inputField)"
                    [disabled]="isFieldDisabled(inputField)"
                    (ngModelChange)="onFieldChange(inputField.varName, $event)"
                    (blur)="onFieldBlur()">
                <mat-hint *ngIf="inputField.hint">{{ inputField.hint }}</mat-hint>

            <!-- DateTime Field -->
            <mat-form-field
                *ngIf="inputField.type === fieldTypes.DATETIME"
                class="w-full">
                <mat-label>{{ inputField.label }}</mat-label>
                <input
                    matInput
                    type="datetime-local"
                    [(ngModel)]="modelValue[inputField.varName]"
                    [readonly]="isFieldReadonly(inputField)"
                    [disabled]="isFieldDisabled(inputField)"
                    (ngModelChange)="onFieldChange(inputField.varName, $event)"
                    (blur)="onFieldBlur()">
                <mat-hint *ngIf="inputField.hint">{{ inputField.hint }}</mat-hint>

<div class="ingredient-editor">
  <!-- Title Field -->
  <mat-form-field *ngIf="value.title || showTitle" 
                  appearance="outline" 
                  class="title-field w-full">
    <mat-label>Section Title</mat-label>
    <input matInput
           [(ngModel)]="value.title"
           (input)="onTitleChange()"
           (click)="onFieldClick('title')"
           placeholder="Section Title">

  <!-- Ingredient Row -->
  <div class="ingredient-row" [class.md-and-up]="isMdAndUp">
    <!-- Quantity Field -->
    <div *ngIf="!disableAmount" class="quantity-field">
      <mat-form-field appearance="outline" class="w-full"></mat-form-field>
        <mat-label>Quantity</mat-label>
        <input matInput
               type="number"
               [(ngModel)]="value.quantity"
               (input)="onQuantityChange()"
               (keypress)="quantityFilter($event)"
               placeholder="Quantity">
        <mat-icon matPrefix class="handle-icon">unfold_more</mat-icon>

    <!-- Unit Field -->
    <div *ngIf="!disableAmount" class="unit-field">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Unit</mat-label>
        <input matInput
               [(ngModel)]="unitSearch"
               (input)="onUnitSearchChange($event)"
               (keyup.enter)="onUnitEnter()"
               [matAutocomplete]="unitAuto"
               placeholder="Choose unit">
        <mat-autocomplete #unitAuto="matAutocomplete" 
                         (optionSelected)="onUnitChange()">
          <mat-option *ngFor="let unit of units" [value]="unit"></mat-option>
            {{ unit.name }}
          <mat-option *ngIf="unitSearch && !units.find(u => u.name.includes(unitSearch))"></mat-option>
            Press Enter to create "{{ unitSearch }}"
        </mat-form-field>
        <mat-icon matPrefix *ngIf="unitError" 
                  [matTooltip]="unitErrorTooltip"
                  matTooltipPosition="below"
                  class="btn btn-primary">warning</mat-icon>

    <!-- Food Field -->
    <div *ngIf="!disableAmount" class="food-field">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Food</mat-label>
        <input matInput
               [(ngModel)]="foodSearch"
               (input)="onFoodSearchChange($event)"
               (keyup.enter)="onFoodEnter()"
               [matAutocomplete]="foodAuto"
               placeholder="Choose food">
        <mat-autocomplete #foodAuto="matAutocomplete" 
                         (optionSelected)="onFoodChange()">
          <mat-option *ngFor="let food of foods" [value]="food"></mat-option>
            {{ food.name }}
          <mat-option *ngIf="foodSearch && !foods.find(f => f.name.includes(foodSearch))"></mat-option>
            Press Enter to create "{{ foodSearch }}"
        </mat-form-field>
        <mat-icon matPrefix *ngIf="foodError" 
                  [matTooltip]="foodErrorTooltip"
                  matTooltipPosition="below"
                  class="btn btn-primary">warning</mat-icon>

    <!-- Note Field -->
    <div class="note-field">
      <div class="note-input-group">
        <mat-form-field appearance="outline" class="note-input w-full"></mat-form-field>
          <mat-label>Notes</mat-label>
          <input matInput
                 [(ngModel)]="value.note"
                 (input)="onNoteChange()"
                 (click)="onFieldClick('note')"
                 placeholder="Notes">
          <mat-icon matPrefix *ngIf="disableAmount" class="handle-icon">unfold_more</mat-icon>
        
        <app-base-button-group
          [buttons]="buttons"
          [large]="false"
          (buttonClick)="onButtonClick($event)"
          class="action-buttons"></app-base-button-group></<app-base-button-group
          [buttons]="buttons"
          [large]="false"
          (buttonClick)="onButtonClick($event)"
          class="action-buttons"></app-base-button-group>></<app-base-button-group
          [buttons]="buttons"
          [large]="false"
          (buttonClick)="onButtonClick($event)"
          class="action-buttons"></app-base-button-group>>>

  <!-- Original Text -->
  <p *ngIf="showOriginalText" class="original-text text-secondary mb-sm"></p>
    Original text: {{ value.originalText }}

  <!-- Divider for mobile -->
  <mat-divider *ngIf="!isMdAndUp" class="mobile-divider"></mat-divider>

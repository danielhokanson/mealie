<section class="page-container">
  <div class="register-card">
    <mat-card class="card">
      <mat-card-header class="card"></mat-card-header>
        <mat-card-title >Create Account</mat-card-title>
        <mat-card-subtitle >Join Mealie and start organizing your recipes</mat-card-subtitle>

      <mat-card-content class="card">
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
          <!-- Username Field -->
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Username</mat-label>
            <input 
              matInput 
              formControlName="username"
              placeholder="Choose a username"
              autocomplete="username">
            <mat-icon matPrefix>person</mat-icon>
            <mat-error *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched"></mat-error>
              {{ getErrorMessage('username') }}
          </mat-form-field>

          <!-- Full Name Field -->
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Full Name</mat-label>
            <input 
              matInput 
              formControlName="fullName"
              placeholder="Enter your full name"
              autocomplete="name">
            <mat-icon matPrefix>badge</mat-icon>
            <mat-error *ngIf="registerForm.get('fullName')?.invalid && registerForm.get('fullName')?.touched"></mat-error>
              {{ getErrorMessage('fullName') }}
          </mat-form-field>

          <!-- Email Field -->
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Email</mat-label>
            <input 
              matInput 
              type="email"
              formControlName="email"
              placeholder="Enter your email"
              autocomplete="email">
            <mat-icon matPrefix>email</mat-icon>
            <mat-error *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"></mat-error>
              {{ getErrorMessage('email') }}
          </mat-form-field>

          <!-- Password Field -->
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Password</mat-label>
            <input 
              matInput 
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Create a password"
              autocomplete="new-password">
            <mat-icon matPrefix>lock</mat-icon>
            <button 
              mat-icon-button 
              matSuffix 
              type="button"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </mat-form-field>
            <mat-error *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"></mat-error>
              {{ getErrorMessage('password') }}
          </form>

          <!-- Password Strength Indicator -->
          <div *ngIf="registerForm.get('password')?.value" class="password-strength">
            <div class="strength-bar">
              <div 
                class="strength-fill"
                [style.background-color]="getPasswordStrengthColor()"
                [style.width]="getPasswordStrength() === 'weak' ? '33%' : getPasswordStrength() === 'medium' ? '66%' : '100%'">

            <span class="strength-text" [style.color]="getPasswordStrengthColor()"></span>
              Password strength: {{ getPasswordStrength() }}

          <!-- Confirm Password Field -->
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Confirm Password</mat-label>
            <input 
              matInput 
              [type]="showConfirmPassword ? 'text' : 'password'"
              formControlName="confirmPassword"
              placeholder="Confirm your password"
              autocomplete="new-password">
            <mat-icon matPrefix>lock</mat-icon>
            <button 
              mat-icon-button 
              matSuffix 
              type="button"
              (click)="toggleConfirmPasswordVisibility()"
              [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
              <mat-icon>{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </mat-form-field>
            <mat-error *ngIf="registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched"></mat-error>
              {{ getErrorMessage('confirmPassword') }}

          <!-- Terms and Conditions -->
          <div class="terms-checkbox">
            <mat-checkbox formControlName="acceptTerms" class="btn btn-primary"></mat-checkbox>
              I agree to the 
              <a href="#" class="terms-link">Terms of Service</a> 
              and 
              <a href="#" class="privacy-link">Privacy Policy</a>
            <mat-error *ngIf="registerForm.get('acceptTerms')?.invalid && registerForm.get('acceptTerms')?.touched" class="terms-error"></mat-error>
              You must accept the terms and conditions

          <!-- Submit Button -->
          <button 
            mat-raised-button 
            class="btn btn-primary btn btn-primary" 
            type="submit"
            
            [disabled]="loading || registerForm.invalid">
            <mat-spinner *ngIf="loading" diameter="20" class="spinner"></mat-spinner>
            <span *ngIf="!loading">Create Account</span>
          </mat-card>

      </section>

      <mat-card-actions class="flex justify-end gap-sm pt-md card"></mat-card-actions>
        <button 
          mat-button 
          class="btn btn-secondary login-link"
          (click)="onLogin()"
          >
          Already have an account? Sign in

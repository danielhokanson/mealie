<section class="page-container">
    <h2 mat-dialog-title class="dialog-title text-xl font-medium mb-md"></h2>
        <mat-icon>language</mat-icon>
        Select Language

    <mat-dialog-content class="dialog-content">
        <mat-list class="flex flex-col gap-sm">
            <mat-list-item
                *ngFor="let language of languages"
                (click)="onLanguageSelect(language.code)"
                [class.selected]="language.code === currentLanguage"
                class="language-item">
                
                <div matListItemIcon class="flag-icon">
                    <span *ngIf="language.flag" class="flag-emoji"></span>
                        {{ getFlagEmoji(language.flag) }}
                    <mat-icon *ngIf="!language.flag">language</mat-icon>

                <div matListItemTitle class="language-name">
                    {{ getLanguageDisplay(language) }}

                <div matListItemLine class="language-code">
                    {{ language.code.toUpperCase() }}

                <mat-icon *ngIf="language.code === currentLanguage" class="selected-icon">check</mat-icon></mat-list-item>
    </mat-list>
        </mat-dialog-content>
    </section>

    <mat-dialog-actions class="dialog-actions"></mat-dialog-actions>
        <buttonmat-button (click)="onCancel()" class="btn btn-secondary"> Cancel</button>

<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Login to Mealie</mat-card-title>
      <mat-card-subtitle>Enter your credentials to continue</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input 
            matInput 
            [(ngModel)]="username" 
            name="username"
            required
            placeholder="Enter your username">
          <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input 
            matInput 
            type="password"
            [(ngModel)]="password" 
            name="password"
            required
            placeholder="Enter your password">
          <mat-icon matPrefix>lock</mat-icon>
        </mat-form-field>
        
        <div class="remember-me">
          <mat-checkbox [(ngModel)]="rememberMe" name="rememberMe">
            Remember me
          </mat-checkbox>
        </div>

        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <div class="button-container">
          <button 
            mat-raised-button 
            color="primary" 
            type="submit"
            [disabled]="isLoading || !username || !password"
            class="login-button">
            <mat-icon *ngIf="!isLoading">login</mat-icon>
            <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
            {{ isLoading ? 'Logging in...' : 'Login' }}
          </button>
          
          <button 
            mat-button 
            type="button"
            (click)="onCancel()"
            class="cancel-button">
            Cancel
          </button>
        </div>
      </form>

      <div class="register-link">
        <p>Don't have an account? 
          <button mat-button color="accent" (click)="navigateToRegister()">
            Register here
          </button>
        </p>
      </div>
    </mat-card-content>
  </mat-card>
</div>

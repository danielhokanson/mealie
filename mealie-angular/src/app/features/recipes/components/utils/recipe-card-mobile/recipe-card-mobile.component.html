<mat-card [class]="cardClass" class="card">
  <div class="card-content">
    <!-- Image Section -->
    <div *ngIf="hasImage" class="image-section">
      <img
        [src]="image"
        [alt]="name"
        class="recipe-image"
        loading="lazy">
    </div>
    
    <!-- Content Section -->
    <div class="content-section">
      <!-- Recipe Name -->
      <h3 class="recipe-name text-lg font-medium mb-sm text-lg font-medium mb-sm">{{ name }}</h3>
      
      <!-- Description -->
      <p *ngIf="description" class="recipe-description text-secondary mb-sm text-secondary mb-sm">
        {{ description }}
      </p>
      
      <!-- Rating -->
      <div *ngIf="displayRating > 0" class="rating-section">
        <mat-chip class="btn btn-primary rating-chip">
          <mat-icon>star</mat-icon>
          {{ displayRating.toFixed(1) }}
        </mat-chip>
      </div>
  </div>
</mat-card>

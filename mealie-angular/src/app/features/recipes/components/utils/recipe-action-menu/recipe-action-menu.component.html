<div class="recipe-action-menu">
  <button
    mat-icon-button
    [matMenuTriggerFor]="menu"
    [matTooltip]="'Recipe Actions'"
    class="action-button">
    <mat-icon>more_vert</mat-icon>
  </button>
  
  <mat-menu #menu="matMenu" class="action-menu">
    <button
      *ngIf="canEdit"
      mat-menu-item
      (click)="onEdit()"
      [matTooltip]="'Edit Recipe'">
      <mat-icon>edit</mat-icon>
      <span>Edit</span>
    </button>
    
    <button
      *ngIf="loggedIn"
      mat-menu-item
      (click)="onPrint()"
      [matTooltip]="'Print Recipe'">
      <mat-icon>print</mat-icon>
      <span>Print</span>
    </button>
    
    <button
      *ngIf="canEdit"
      mat-menu-item
      (click)="onSave()"
      [matTooltip]="'Save Changes'">
      <mat-icon>save</mat-icon>
      <span>Save</span>
    </button>
    
    <button
      *ngIf="canEdit"
      mat-menu-item
      (click)="onDelete()"
      [matTooltip]="'Delete Recipe'"
      class="delete-action">
      <mat-icon>delete</mat-icon>
      <span>Delete</span>
    </button>
  </mat-menu>
</div>

<section class="page-container">
  <!-- Search Container -->
  <section class="page-container">
    <form class="search-box" (ngSubmit)="search()">
      <!-- Search Input -->
      <section class="page-container">
        <mat-form-field appearance="outline" class="search-input w-full">
          <mat-label>Search recipes...</mat-label>
          <input matInput
                 #searchInput
                 [(ngModel)]="state.search"
                 name="search"
                 (keyup.enter)="hideKeyboard()"
                 (input)="onSearchChange()"
                 placeholder="Search recipes...">
          <mat-icon matPrefix>search</mat-icon>
          <button *ngIf="state.search" 
                  matSuffix 
                  mat-icon-button 
                  type="button"
                  (click)="state.search = ''; onSearchChange()">
            <mat-icon>clear</mat-icon>
          </mat-form-field>
        </section>
      </form>

      <!-- Filter Row -->
      <div class="search-row">
        <!-- Category Filter -->
        <div class="filter-section" *ngIf="categories.length > 0">
          <mat-form-field appearance="outline" class="filter-input w-full">
            <mat-label>Categories</mat-label>
            <mat-select [(ngModel)]="selectedCategories" 
                       name="categories"
                       multiple
                       (selectionChange)="onFilterChange()">
              <mat-option *ngFor="let category of categories" [value]="category">
                {{ category.name }}
              </mat-option>
            </mat-form-field>
            <mat-icon matPrefix>category</mat-icon>
          </div>
          <mat-slide-toggle [(ngModel)]="state.requireAllCategories"
                           name="requireAllCategories"
                           (change)="onFilterChange()">
            Require All
          </div>
        </section>

        <!-- Tag Filter -->
        <div class="filter-section" *ngIf="tags.length > 0">
          <mat-form-field appearance="outline" class="filter-input w-full">
            <mat-label>Tags</mat-label>
            <mat-select [(ngModel)]="selectedTags" 
                       name="tags"
                       multiple
                       (selectionChange)="onFilterChange()">
              <mat-option *ngFor="let tag of tags" [value]="tag">
                {{ tag.name }}
              </mat-option>
            </mat-form-field>
            <mat-icon matPrefix>local_offer</mat-icon>
          </div>
          <mat-slide-toggle [(ngModel)]="state.requireAllTags"
                           name="requireAllTags"
                           (change)="onFilterChange()">
            Require All
          </section>

        <!-- Tool Filter -->
        <div class="filter-section" *ngIf="tools.length > 0">
          <mat-form-field appearance="outline" class="filter-input w-full">
            <mat-label>Tools</mat-label>
            <mat-select [(ngModel)]="selectedTools" 
                       name="tools"
                       multiple
                       (selectionChange)="onFilterChange()">
              <mat-option *ngFor="let tool of tools" [value]="tool">
                {{ tool.name }}
              </mat-option>
            </mat-form-field>
            <mat-icon matPrefix>restaurant</mat-icon>
          </div>
          <mat-slide-toggle [(ngModel)]="state.requireAllTools"
                           name="requireAllTools"
                           (change)="onFilterChange()">
            Require All

        <!-- Food Filter -->
        <div class="filter-section" *ngIf="foods.length > 0">
          <mat-form-field appearance="outline" class="filter-input w-full">
            <mat-label>Foods</mat-label>
            <mat-select [(ngModel)]="selectedFoods" 
                       name="foods"
                       multiple
                       (selectionChange)="onFilterChange()">
              <mat-option *ngFor="let food of foods" [value]="food">
                {{ food.name }}
              </mat-option>
            </mat-form-field>
            <mat-icon matPrefix>restaurant_menu</mat-icon>
          </div>
          <mat-slide-toggle [(ngModel)]="state.requireAllFoods"
                           name="requireAllFoods"
                           (change)="onFilterChange()">
            Require All

        <!-- Household Filter -->
        <div class="filter-section" *ngIf="households.length > 1">
          <mat-form-field appearance="outline" class="filter-input w-full">
            <mat-label>Households</mat-label>
            <mat-select [(ngModel)]="selectedHouseholds" 
                       name="households"
                       multiple
                       (selectionChange)="onFilterChange()">
              <mat-option *ngFor="let household of households" [value]="household">
                {{ household.name }}
              </mat-option>
            </mat-form-field>
            <mat-icon matPrefix>home</mat-icon>
          </div>

        <!-- Sort Options -->
        <button mat-icon-button
                [matMenuTriggerFor]="sortMenu"
                class="sort-button">
          <mat-icon>{{ state.orderDirection === 'asc' ? 'sort_ascending' : 'sort_descending' }}</mat-icon>
          <span class="button-text">{{ sortText }}</span>

        <mat-menu #sortMenu="matMenu">
          <mat-list class="flex flex-col gap-sm">
            <mat-list-item (click)="toggleOrderDirection()">
              <mat-icon matListItemIcon>
                {{ state.orderDirection === 'asc' ? 'sort_descending' : 'sort_ascending' }}

              <span matListItemTitle>
                {{ state.orderDirection === 'asc' ? 'Sort Descending' : 'Sort Ascending' }}
              </span>

            <mat-divider></mat-divider>
            <mat-list-item *ngFor="let option of sortable"
                          [class.active]="state.orderBy === option.value"
                          (click)="onOrderByChange(option.value)">
              <mat-icon matListItemIcon>{{ option.icon }}</mat-icon>
              <span matListItemTitle>{{ option.name }}</span>
            </mat-icon>
          </mat-list-item>
        </mat-list>

        <!-- Settings -->
        <button mat-icon-button
                [matMenuTriggerFor]="settingsMenu"
                class="settings-button">
          <mat-icon>settings</mat-icon>

        <mat-menu #settingsMenu="matMenu">
          <mat-card class="card">
            <mat-card-content class="card">
              <mat-slide-toggle [(ngModel)]="state.auto">
                Auto Search
              </mat-slide-toggle>
              <button mat-raised-button
                      class="btn btn-primary"
                      (click)="reset()"
                      class="reset-button">
                Reset
              </mat-card-content>
            </mat-card>
          </mat-menu>

      <!-- Search Button -->
      <div class="search-button-container" *ngIf="!state.auto">
        <button mat-raised-button
                class="btn btn-primary"
                type="submit"
                class="search-button">
          <mat-icon>search</mat-icon>
          Search
        </div>

  <mat-divider></mat-divider>

  <!-- Recipe Cards Section -->
  <section class="page-container">
    <app-recipe-card-section
      *ngIf="state.ready"
      [icon]="'restaurant'"
      [title]="'Recipes'"
      [recipes]="recipes"
      [query]="passedQueryWithSeed"
      [disableSort]="true"
      (itemSelected)="filterItems()"
      (replaceRecipes)="replaceRecipes($event)"
      (appendRecipes)="appendRecipes($event)">
    </section>

</mat-menu>

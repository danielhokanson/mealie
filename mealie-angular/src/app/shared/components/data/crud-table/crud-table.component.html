<section class="page-container">
    <!-- Table Actions -->
    <mat-card-actions class="table-actions card">
        <!-- Column Visibility Menu -->
        <mat-menu *ngIf="tableConfig.hideColumns" #columnMenu="matMenu">
            <ng-template matMenuTrigger>
                <button mat-raised-button class="btn btn-secondary"><mat-icon>settings</mat-icon> <mat-card class="card"> <mat-card-content class="card"></mat-card> <mat-checkbox *ngFor="let header of localHeaders" [checked]="header.show" (change)="onHeaderVisibilityChange(header, $event.checked)"</button>
                        class="column-checkbox">
                        {{ header.text }}

            </mat-menu>
        </mat-card-actions>

        <!-- Bulk Actions -->
        <app-base-overflow-button
            *ngIf="bulkActions.length ></app-base-overflow-button>0"
            [items]="getBulkActionItems()"
            [disabled]="selected.length < 1"
            color="info"
            btnClass="elevated"
            (itemClick)="onBulkAction($event)">
        </section>

        <!-- Custom Button Row -->
        <ng-content select="[slot=button-row]"></ng-content>

    <!-- Search Field -->
    <section class="page-container"></section>
        <mat-form-field class="search-field w-full"></mat-form-field>
            <mat-label>Search</mat-label>
            <input
                matInput
                [(ngModel)]="search"
                (ngModelChange)="onSearchChange()"
                placeholder="Search...">
            <mat-icon matSuffix>search</mat-icon>

    <!-- Data Table -->
    <table mat-table class="w-full data-table"
           [dataSource]="filteredData"
           matSort
           [matSortActive]="sortBy[0]?.active || ''"
           [matSortDirection]="sortBy[0]?.direction || 'asc'"
           (matSortChange)="onSortChange($event)"
           >

        <!-- Selection Column -->
        <ng-container *ngIf="bulkActions.length > 0" matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef></th>
                <mat-checkbox
                    (change)="$event ? masterToggle() : null"
                    [checked]="selection.hasValue() && isAllSelected()"
                    [indeterminate]="selection.hasValue() && !isAllSelected()">
            </ng-container>
            <td mat-cell *matCellDef="let row">
                <mat-checkbox
                    (click)="$event.stopPropagation()"
                    (change)="$event ? selection.toggle(row) : null"
                    [checked]="selection.isSelected(row)">

        <!-- Dynamic Columns -->
        <ng-container *ngFor="let header of headersWithoutActions" [matColumnDef]="header.value">
            <th mat-header-cell *matHeaderCellDef mat-sort-header></th>
                {{ header.text }}
            <td mat-cell *matCellDef="let element">
                <ng-content [attr.select]="'item.' + header.value" [attr.data-item]="element">
                    {{ element[header.value] }}

        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let element">
                <app-base-button-group
                    [buttons]="[
                        {
                            icon: 'edit',
                            text: 'Edit',
                            event: 'edit',
                            color: 'primary'
                        },
                        {
                            icon: 'delete',
                            text: 'Delete',
                            event: 'delete',
                            color: 'warn'
                        }
                    ]"
                    (buttonClick)="onActionClick($event, element)"></app-base-button-group></<app-base-button-group
                    [buttons]="[
                        {
                            icon: 'edit',
                            text: 'Edit',
                            event: 'edit',
                            color: 'primary'
                        },
                        {
                            icon: 'delete',
                            text: 'Delete',
                            event: 'delete',
                            color: 'warn'
                        }
                    ]"
                    (buttonClick)="onActionClick($event, element)"></app-base-button-group>>

            </ng-container>

        <tr mat-header-row *matHeaderRowDef="activeHeaders"></tr>
        <tr mat-row *matRowDef="let row; columns: activeHeaders;" 
            [class.selected]="selection.isSelected(row)"
            (click)="onRowClick(row)">

    <!-- Paginator -->
    <mat-paginator
        [pageSize]="15"
        [pageSizeOptions]="[5, 10, 15, 25, 50]"
        (page)="onPageChange($event)"
        class="table-paginator">

    <!-- Bottom Actions -->
    <mat-card-actions class="bottom-actions card">
        <ng-content select="[slot=button-bottom]"></ng-content>
        
        <app-base-button
            *ngIf="tableConfig.canExport"
            color="info"
            (click)="downloadAsJson(filteredData, 'export.json')"></app-base-button></<app-base-button
            *ngIf="tableConfig.canExport"
            color="info"
            (click)="downloadAsJson(filteredData, 'export.json')"></app-base-button>>
            <mat-icon>download</mat-icon>
            Download
        </mat-card-actions>

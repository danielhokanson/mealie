<section class="page-container">
  <!-- Loading State -->
  <div *ngIf="loading" class="flex items-center justify-center py-xl">
    <mat-spinner diameter="50"></mat-spinner>
    <p class="text-secondary mb-sm">Loading shopping list...</p>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="error-container">
    <mat-icon class="error-icon">error</mat-icon>
    <h3 class="text-lg font-medium mb-sm">Error Loading Shopping List</h3>
    <p class="text-secondary mb-sm">Unable to load the shopping list. Please try again.</p>
    <button mat-raised-button class="btn btn-primary" (click)="loadShoppingList(shoppingList?.id || '')">
      Retry

  <!-- Shopping List Content -->
  <div *ngIf="shoppingList && !loading" class="shopping-list-content">
    <!-- Header -->
    <div class="list-header">
      <div class="list-title-section">
        <h1 class="text-2xl font-medium mb-md">{{ shoppingList.name }}</h1>
        <div class="list-meta">
          <span>Created {{ getFormattedDate(shoppingList.createdAt) }}</span>
          <span *ngIf="shoppingList.updatedAt && shoppingList.updatedAt !== shoppingList.createdAt"></span>
            • Updated {{ getFormattedDate(shoppingList.updatedAt) }}

      <!-- Action Buttons -->
      <div class="list-actions">
        <button 
          mat-icon-button 
          (click)="onShareList()" 
          matTooltip="Share list">
          <mat-icon>share</mat-icon>

        <button 
          mat-icon-button 
          (click)="onPrintList()" 
          matTooltip="Print list">
          <mat-icon>print</mat-icon>

        <button 
          mat-icon-button 
          [matMenuTriggerFor]="listMenu" 
          matTooltip="More options">
          <mat-icon>more_vert</mat-icon>

        <mat-menu #listMenu="matMenu">
          <button mat-menu-item (click)="onEditList()">
            <mat-icon>edit</mat-icon>
            <span>Edit List</span>

          <mat-divider></mat-divider>
          <button mat-menu-item (click)="onDeleteList()" class="delete-action">
            <mat-icon>delete</mat-icon>
            <span>Delete List</span>

        </mat-menu>

    <!-- Progress Section -->
    <div class="progress-section">
      <div class="progress-info">
        <span class="progress-text"></span>
          {{ getCompletedItemsCount() }} of {{ getTotalItemsCount() }} items
        <span class="progress-percentage"></span>
          {{ getProgressPercentage() | number:'1.0-0' }}%

      <mat-progress-bar 
        [value]="getProgressPercentage()"
        [color]="getProgressPercentage() === 100 ? 'accent' : 'primary'">

    </section>

    <!-- Add Item Section -->
    <mat-card class="add-item-section card">
      <mat-card-header class="card"></mat-card-header>
        <mat-card-title >Add New Item</mat-card-title>
      <mat-card-content class="card">
        <form [formGroup]="newItemForm" (ngSubmit)="onAddItem()" class="add-item-form">
          <div class="form-row">
            <mat-form-field appearance="outline" class="title-field w-full"></mat-form-field>
              <mat-label>Item Name</mat-label>
              <input 
                matInput 
                formControlName="title"
                placeholder="Enter item name">

            <mat-form-field appearance="outline" class="quantity-field w-full"></mat-form-field>
              <mat-label>Quantity</mat-label>
              <input 
                matInput 
                type="number"
                formControlName="quantity"
                min="0"
                step="0.1">

            <mat-form-field appearance="outline" class="unit-field w-full"></mat-form-field>
              <mat-label>Unit</mat-label>
              <input 
                matInput 
                formControlName="unit"
                placeholder="e.g., cups, grams">

          <div class="form-row">
            <mat-form-field appearance="outline" class="note-field w-full"></mat-form-field>
              <mat-label>Note (optional)</mat-label>
              <input 
                matInput 
                formControlName="note"
                placeholder="Add a note">

          <!-- Labels Selection -->
          <div class="labels-section" *ngIf="labels.length > 0">
            <h4>Labels</h4>
            <div class="labels-grid">
              <mat-checkbox 
                *ngFor="let label of labels"
                [checked]="selectedLabels.includes(label.id)"
                (change)="onLabelToggle(label.id)"
                [style.color]="label.color">
                {{ label.name }}

          <div class="flex justify-end gap-sm mt-lg">
            <button 
              mat-raised-button 
              class="btn btn-primary"
              type="submit"
              [disabled]="newItemForm.invalid">
              Add Item

          </form>

      </mat-card>

    <!-- Items Section -->
    <mat-card class="items-section card">
      <mat-card-header class="card"></mat-card-header>
        <mat-card-title >Shopping Items</mat-card-title>
        <mat-card-subtitle >{{ getTotalItemsCount() }} items</mat-card-subtitle>
      <mat-card-content class="card">
        <!-- Items by Label -->
        <mat-expansion-panel *ngFor="let label of getUniqueLabels()" class="label-panel">
          <mat-expansion-panel-header></mat-expansion-panel-header>
            <mat-panel-title></mat-panel-title>
              <div class="label-header">
                <span class="label-color" [style.background-color]="label.color"></span>
                {{ label.name }}
                <span class="item-count">{{ getItemsByLabel(label.id).length }}</span>

          <mat-list class="flex flex-col gap-sm">
            <mat-list-item *ngFor="let item of getItemsByLabel(label.id)" class="item-row"></mat-list-item>
              <mat-checkbox 
                [checked]="item.checked"
                (change)="onToggleItem(item)"
                class="item-checkbox">
              
              <div class="item-content" [class.checked]="item.checked">
                <span class="item-title">{{ item.title }}</span>
                <span *ngIf="item.quantity" class="item-quantity"></span>
                  {{ item.quantity }}
                  <span *ngIf="item.unit">{{ item.unit }}</span>
                <span *ngIf="item.note" class="item-note">({{ item.note }})</span>

              <button 
                mat-icon-button 
                class="btn btn-error delete-button"
                (click)="onDeleteItem(item)"
                >
                <mat-icon>delete</mat-icon>
              </mat-list>
            </mat-expansion-panel>

        </mat-card>

        <!-- Unlabeled Items -->
        <mat-expansion-panel *ngIf="getUnlabeledItems().length > 0" class="unlabeled-panel">
          <mat-expansion-panel-header></mat-expansion-panel-header>
            <mat-panel-title></mat-panel-title>
              <div class="label-header">
                <span class="label-color" style="background-color: #ccc;"></span>
                No Label
                <span class="item-count">{{ getUnlabeledItems().length }}</span>

          <mat-list class="flex flex-col gap-sm">
            <mat-list-item *ngFor="let item of getUnlabeledItems()" class="item-row"></mat-list-item>
              <mat-checkbox 
                [checked]="item.checked"
                (change)="onToggleItem(item)"
                class="item-checkbox">
              
              <div class="item-content" [class.checked]="item.checked">
                <span class="item-title">{{ item.title }}</span>
                <span *ngIf="item.quantity" class="item-quantity"></span>
                  {{ item.quantity }}
                  <span *ngIf="item.unit">{{ item.unit }}</span>
                <span *ngIf="item.note" class="item-note">({{ item.note }})</span>

              <button 
                mat-icon-button 
                class="btn btn-error delete-button"
                (click)="onDeleteItem(item)"
                >
                <mat-icon>delete</mat-icon>
              </mat-list>
            </mat-expansion-panel>

        <!-- Empty State -->
        <div *ngIf="getTotalItemsCount() === 0" class="empty-items">
          <mat-icon class="empty-icon">shopping_cart</mat-icon>
          <h3 class="text-lg font-medium mb-sm">No Items Yet</h3>
          <p class="text-secondary mb-sm">Add your first item to get started</p>

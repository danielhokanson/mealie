<mat-card class="shopping-list-card card">
  <mat-card-header class="card">
    <mat-card-title class="list-title card">
      {{ shoppingList.name }}
    </mat-card-title>
    <mat-card-subtitle *ngIf="shoppingList.description" class="card">
      {{ shoppingList.description }}
    </mat-card-subtitle>
    
    <div class="list-actions">
      <button 
        mat-icon-button
        [matMenuTriggerFor]="listMenu"
        class="list-menu-btn">
        <mat-icon>more_vert</mat-icon>
      </div>
      
      <mat-menu #listMenu="matMenu">
        <button mat-menu-item (click)="addItem()">
          <mat-icon>add</mat-icon>
          <span>Add Item</span>
        </button>
        <button mat-menu-item (click)="clearCompleted()" [disabled]="checkedItems.length === 0">
          <mat-icon>clear_all</mat-icon>
          <span>Clear Completed</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="onDeleteList()">
          <mat-icon class="btn btn-error">delete</mat-icon>
          <span>Delete List</span>
        </button>
      </mat-menu>
    </mat-card-header>
  </mat-card>

  <mat-card-content class="card">
    <!-- Progress Bar -->
    <div class="progress-container" *ngIf="shoppingList.items.length > 0">
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="progressPercentage"></div>
      <span class="progress-text">
        {{ checkedItems.length }} of {{ shoppingList.items.length }} completed
      </span>
    </div>

    <!-- Unchecked Items -->
    <div class="items-section" *ngIf="uncheckedItems.length > 0">
      <h3 class="section-title text-lg font-medium mb-sm">To Buy</h3>
      <div class="items-list">
        <app-shopping-list-item
          *ngFor="let item of uncheckedItems; trackBy: trackByItemId"
          [modelValue]="item"
          [showLabel]="showLabels"
          [labels]="labels"
          [units]="units"
          [foods]="foods"
          [recipes]="recipes"
          (checked)="onItemChecked($event)"
          (save)="onItemUpdated($event)"
          (delete)="onItemDeleted($event)">
        </div>
      </div>

    <!-- Checked Items -->
    <div class="items-section" *ngIf="checkedItems.length > 0">
      <mat-divider></mat-divider>
      <h3 class="section-title text-lg font-medium mb-sm">Completed</h3>
      <div class="items-list completed">
        <app-shopping-list-item
          *ngFor="let item of checkedItems; trackBy: trackByItemId"
          [modelValue]="item"
          [showLabel]="showLabels"
          [labels]="labels"
          [units]="units"
          [foods]="foods"
          [recipes]="recipes"
          (checked)="onItemChecked($event)"
          (save)="onItemUpdated($event)"
          (delete)="onItemDeleted($event)">
        </div>
      </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="shoppingList.items.length === 0">
      <mat-icon class="empty-icon">shopping_cart</mat-icon>
      <p class="empty-text text-secondary mb-sm">No items in this shopping list</p>
      <button mat-raised-button class="btn btn-primary" (click)="addItem()">
        <mat-icon>add</mat-icon>
        Add First Item
      </button>
    </div>
  </div>
</mat-card-content>

name: .NET Backend Lint and Test

on:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      ASPNETCORE_ENVIRONMENT: Test

    strategy:
      fail-fast: true
      matrix:
        # Database providers
        Database: [sqlite, postgres]

    # Services
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mealie
          POSTGRES_PASSWORD: mealie
          POSTGRES_DB: mealie
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432

    # Steps
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore
        working-directory: MealieApi

      - name: Build
        run: dotnet build --no-restore -c Release
        working-directory: MealieApi

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore
        working-directory: MealieApi

      - name: Test with SQLite
        if: matrix.Database == 'sqlite'
        run: dotnet test --no-build -c Release --verbosity normal
        working-directory: MealieApi
        env:
          ConnectionStrings__DefaultConnection: "Data Source=test.db"
          DATABASE_PROVIDER: sqlite

      - name: Test with PostgreSQL
        if: matrix.Database == 'postgres'
        run: dotnet test --no-build -c Release --verbosity normal
        working-directory: MealieApi
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=mealie;Username=mealie;Password=mealie"
          DATABASE_PROVIDER: postgres

      - name: Generate Code Coverage Report
        run: |
          dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage
        working-directory: MealieApi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./MealieApi/coverage
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

# https://taskfile.dev

version: "3"
vars:
  GREETING: Hello, World!
env:
  DEFAULT_GROUP: Home
  DEFAULT_HOUSEHOLD: Family
  PRODUCTION: false
  API_PORT: 9000
  API_DOCS: True
  TOKEN_TIME: 256 # hours
  # mailplit SMTP config
  # start dev:services to use mailpit
  SMTP_HOST: localhost
  SMTP_PORT: 1025
  SMTP_FROM_NAME: MealieDev
  SMTP_FROM_EMAIL: mealie@example.com
  SMTP_AUTH_STRATEGY: NONE
  BASE_URL: http://localhost:3000
  LANG: en-US

# loads .env file if it exists
dotenv:
  - .env
  - .dev.env
tasks:
  # ==========================================
  # New Angular + .NET Tasks
  # ==========================================
  
  angular:setup:
    desc: setup Angular frontend dependencies
    dir: mealie-angular
    run: once
    cmds:
      - npm install
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/**

  angular:build:
    desc: builds the Angular frontend for production
    dir: mealie-angular
    deps:
      - angular:setup
    cmds:
      - npm run build -- --configuration production

  angular:dev:
    desc: runs the Angular frontend in development mode
    dir: mealie-angular
    deps:
      - angular:setup
    cmds:
      - npm run start

  angular:test:
    desc: runs Angular frontend tests
    dir: mealie-angular
    cmds:
      - npm run test

  angular:lint:
    desc: runs Angular frontend linter
    dir: mealie-angular
    cmds:
      - npm run lint

  dotnet:restore:
    desc: restore .NET dependencies
    dir: MealieApi
    cmds:
      - dotnet restore

  dotnet:build:
    desc: builds the .NET backend
    dir: MealieApi
    deps:
      - dotnet:restore
    cmds:
      - dotnet build -c Release

  dotnet:test:
    desc: runs .NET backend tests
    dir: MealieApi
    cmds:
      - dotnet test

  dotnet:run:
    desc: runs the .NET backend
    dir: MealieApi/src/MealieApi.WebApi
    deps:
      - dotnet:restore
    cmds:
      - dotnet run

  dotnet:publish:
    desc: publishes the .NET backend for production
    dir: MealieApi
    deps:
      - dotnet:restore
    cmds:
      - dotnet publish src/MealieApi.WebApi/MealieApi.WebApi.csproj -c Release -o publish

  new:dev:
    desc: runs both Angular frontend and .NET backend in development mode
    deps:
      - angular:dev
      - dotnet:run

  new:build:
    desc: builds both Angular frontend and .NET backend for production
    deps:
      - angular:build
      - dotnet:publish

  docker:new:
    desc: builds and runs the new Angular + .NET docker image
    dir: docker
    cmds:
      - docker build -f Dockerfile -t mealie-next:latest ..
      - docker run -p 80:80 mealie-next:latest

  # ==========================================
  # Legacy Vue + Python Tasks (DEPRECATED)
  # ==========================================
  
  docs:gen:
    desc: runs the API documentation generator
    cmds:
      - poetry run python dev/code-generation/gen_docs_api.py

  docs:
    desc: runs the documentation server
    dir: docs
    deps:
      - docs:gen
    cmds:
      - poetry run python -m mkdocs serve

  setup:ui:
    desc: setup frontend dependencies (DEPRECATED - use angular:setup)
    dir: frontend-deprecated
    run: once
    cmds:
      - yarn install
    sources:
      - package.json
      - yarn.lock
    generates:
      - node_modules/**

  setup:py:
    desc: setup python dependencies
    run: once
    cmds:
      - poetry install --with main,dev,postgres
      - poetry run pre-commit install
    sources:
      - poetry.lock
      - pyproject.toml
      - .pre-commit-config.yaml

  setup:
    desc: setup all dependencies
    deps:
      - setup:ui
      - setup:py

  dev:generate:
    desc: run code generators
    cmds:
      - poetry run python dev/code-generation/main.py {{ .CLI_ARGS }}
      - task: py:format

  dev:services:
    desc: starts postgres and mailpit containers
    dir: docker
    cmds:
      - docker compose -f docker-compose.dev.yml up

  dev:clean:
    desc: cleans up dev environment !! removes all data files !!
    vars:
      DEV_DATA: ""
    cmds:
      - rm -r ./dev/data/recipes/
      - rm -r ./dev/data/users/
      - rm -f ./dev/data/mealie*.db
      - rm -f ./dev/data/mealie.log
      - rm -f ./dev/data/.secret

  py:mypy:
    desc: runs python type checking (DEPRECATED)
    cmds:
      - poetry run mypy mealie-deprecated

  py:test:
    desc: runs python tests (support args after '--')
    cmds:
      - poetry run pytest {{ .CLI_ARGS }}

  py:format:
    desc: runs python code formatter
    cmds:
      - poetry run ruff format .

  py:lint:
    desc: runs python linter (DEPRECATED)
    cmds:
      - poetry run ruff check mealie-deprecated

  py:check:
    desc: runs all linters, type checkers, and formatters
    deps:
      - py:format
      - py:lint
      - py:mypy
      - py:test

  py:coverage:
    desc: runs python coverage and generates html report
    cmds:
      - poetry run pytest
      - poetry run coverage report -m
      - poetry run coveragepy-lcov
      - poetry run coverage html
      - open htmlcov/index.html

  py:package:copy-frontend:
    desc: copy the frontend files into the Python package (DEPRECATED)
    internal: true
    deps:
      - ui:generate
    cmds:
      - rm -rf mealie-deprecated/frontend
      - cp -a frontend-deprecated/dist mealie-deprecated/frontend
    sources:
      - frontend-deprecated/dist/**
    generates:
      - mealie-deprecated/frontend/**

  py:package:generate-requirements:
    desc: Generate requirements file to pin all packages, effectively a "pip freeze" before installation begins
    internal: true
    cmds:
      - poetry export -n --only=main --extras=pgsql --output=dist/requirements.txt
      # Include mealie in the requirements, hashing the package that was just built to ensure it's the one installed
      - echo "mealie[pgsql]=={{.MEALIE_VERSION}} \\" >> dist/requirements.txt
      - poetry run pip hash dist/mealie-{{.MEALIE_VERSION}}-py3-none-any.whl | tail -n1 | tr -d '\n' >> dist/requirements.txt
      - echo " \\" >> dist/requirements.txt
      - poetry run pip hash dist/mealie-{{.MEALIE_VERSION}}.tar.gz | tail -n1 >> dist/requirements.txt
    vars:
      MEALIE_VERSION:
         sh: poetry version --short
    sources:
      - poetry.lock
      - pyproject.toml
      - dist/mealie-*.whl
      - dist/mealie-*.tar.gz
    generates:
      - dist/requirements.txt

  py:package:deps-parallel:
    desc: Run py:package dependencies in parallel
    internal: true
    deps:
      - setup:py
      - py:package:copy-frontend

  py:package:deps:
    desc: Dependencies of py:package, skippable by setting SKIP_PACKAGE_DEPS=true
    internal: true
    cmds:
      - task: py:package:deps-parallel
    status:
      - '{{ .SKIP_PACKAGE_DEPS | default "false"}}'

  py:package:
    desc: builds Python packages (sdist and wheel) in top-level dist directory
    deps:
      - py:package:deps
    cmds:
      - poetry build -n --output=dist
      - task: py:package:generate-requirements

  py:
    desc: runs the backend server (DEPRECATED - use dotnet:run)
    cmds:
      - poetry run python mealie-deprecated/app.py

  py:postgres:
    desc: runs the backend server configured for containerized postgres (DEPRECATED - use dotnet:run)
    env:
      DB_ENGINE: postgres
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: mealie
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
    cmds:
      - poetry run python mealie-deprecated/app.py

  py:migrate:
    desc: generates a new database migration file e.g. task py:migrate -- "add new column" (DEPRECATED)
    cmds:
      - poetry run alembic --config mealie-deprecated/alembic/alembic.ini revision --autogenerate -m "{{ .CLI_ARGS }}"
      - task: py:format

  ui:build:
    desc: builds the frontend in frontend/dist (DEPRECATED - use angular:build)
    dir: frontend-deprecated
    cmds:
      - yarn build

  ui:generate:
    desc: generates a static version of the frontend in frontend/dist (DEPRECATED)
    dir: frontend-deprecated
    deps:
      - setup:ui
    cmds:
      - yarn generate

  ui:lint:
    desc: runs the frontend linter (DEPRECATED - use angular:lint)
    dir: frontend-deprecated
    cmds:
      - yarn lint

  ui:test:
    desc: runs the frontend tests (DEPRECATED - use angular:test)
    dir: frontend-deprecated
    cmds:
      - yarn test

  ui:check:
    desc: runs all frontend checks
    deps:
      - ui:lint
      - ui:test

  ui:
    desc: runs the frontend server (DEPRECATED - use angular:dev)
    dir: frontend-deprecated
    cmds:
      - yarn run dev --no-fork

  docker:build-from-package:
    desc: Builds the Docker image from the existing Python package in dist/
    deps:
       - py:package
    cmds:
       - docker build --tag mealie:dev --file docker/Dockerfile --build-arg COMMIT={{.GIT_COMMIT}} --build-context packages=dist .
    vars:
      GIT_COMMIT:
        sh: git rev-parse HEAD

  docker:prod:
    desc: builds and runs the production docker image locally
    dir: docker
    cmds:
      - docker compose -f docker-compose.yml -p mealie up -d --build

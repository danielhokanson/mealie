<mat-card
  [style.min-width]="minWidth"
  [class.clickable]="isClickable"
  (click)="navigateTo()"
  class="stats-card card">

    <div
      class="stats-avatar"
      style="width: 36px; height: 36px; border-radius: 50%; background-color: var(--mat-primary-color, #1976d2); display: flex; align-items: center; justify-content: center;">
      <mat-icon
        style="color: white; font-size: 20px;"
        class="stats-icon">
        {{ activeIcon }}

    <div class="stats-info">
      <div class="stats-title">
        <ng-content select="[slot=title]"></ng-content></mat-icon>
      <div class="stats-value">
        <ng-content select="[slot=value]"></ng-content>

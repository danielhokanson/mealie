<section class="page-container">
    <mat-card 
        class="drop-zone-card"
        [class.drag-over]="isDragOver"
        [class.disabled]="disabled"
        (click)="onBrowseClick()" class="card">
        
        <mat-card-content class="drop-zone-content card">
            <div class="drop-zone-icon">
                <mat-icon>cloud_upload</mat-icon>
            </div>
            
            <div class="drop-zone-text">
                <h3 class="text-lg font-medium mb-sm">{{ text }}</h3>
                <p *ngIf="config.accept && config.accept !== '*/*'" class="text-secondary mb-sm">
                    Accepted types: {{ config.accept }}
                </p>
                <p *ngIf="config.maxSize" class="text-secondary mb-sm">
                    Maximum size: {{ formatFileSize(config.maxSize) }}
                </p>
            </div>
            
            <div *ngIf="selectedFiles.length > 0" class="selected-files">
                <h4>Selected Files:</h4>
                <ul class="file-list">
                    <li *ngFor="let file of selectedFiles" class="file-item">
                        <mat-icon>insert_drive_file</mat-icon>
                        <span class="file-name">{{ file.name }}</span>
                        <span class="file-size">({{ formatFileSize(file.size) }})</span>
                    </li>
                </ul>
            </div>
            
            <div *ngIf="isUploading" class="upload-progress">
                <mat-progress-bar
                    [value]="uploadProgress"
                    class="btn btn-primary">
                </mat-progress-bar>
                <p class="progress-text text-secondary mb-sm">Uploading... {{ uploadProgress | number:'1.0-0' }}%</p>
            </div>
        </mat-card-content>
        
        <mat-card-actions class="drop-zone-actions card">
            <button
                mat-button
                class="btn btn-primary"
                (click)="onBrowseClick(); $event.stopPropagation()"
                [disabled]="disabled">
                <mat-icon>folder_open</mat-icon>
                Browse Files
            </button>
            
            <button
                *ngIf="selectedFiles.length > 0"
                mat-button
                class="btn btn-error"
                (click)="clearFiles(); $event.stopPropagation()">
                <mat-icon>clear</mat-icon>
                Clear
            </button>
        </mat-card-actions>
    </mat-card>
</section>

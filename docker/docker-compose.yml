version: "3.8"

services:
  # Main Mealie Application (Angular + .NET)
  mealie:
    container_name: mealie
    build:
      context: ../
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      # Database Configuration
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=mealie;Username=mealie;Password=${POSTGRES_PASSWORD:-mealie_password}

      # JWT Configuration
      - JWT__SecretKey=${JWT_SECRET_KEY:-change-this-super-secret-jwt-key-in-production}
      - JWT__Issuer=MealieApi
      - JWT__Audience=MealieAngular
      - JWT__ExpirationMinutes=60

      # Application Settings
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://127.0.0.1:5000
      - TZ=${TZ:-UTC}
      - ALLOW_SIGNUP=${ALLOW_SIGNUP:-false}

    ports:
      - "${HTTP_PORT:-9091}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mealie-network
    volumes:
      - mealie_data:/app/data

  # PostgreSQL Database
  postgres:
    container_name: mealie_postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mealie}
      POSTGRES_USER: ${POSTGRES_USER:-mealie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mealie_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mealie-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mealie} -d ${POSTGRES_DB:-mealie}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mealie_data:
    driver: local
  postgres_data:
    driver: local

networks:
  mealie-network:
    driver: bridge

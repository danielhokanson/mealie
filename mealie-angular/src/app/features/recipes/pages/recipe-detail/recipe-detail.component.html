<section class="page-container">
  <!-- Loading State -->
  <div *ngIf="loading" class="flex items-center justify-center py-xl">
    <mat-spinner diameter="50"></mat-spinner>
    <p class="text-secondary mb-sm">Loading recipe...</p>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="error-container">
    <mat-icon class="error-icon">error</mat-icon>
    <h3 class="text-lg font-medium mb-sm">Error Loading Recipe</h3>
    <p class="text-secondary mb-sm">Unable to load the recipe. Please try again.</p>
    <button mat-raised-button class="btn btn-primary" (click)="loadRecipe(recipe?.id || '')">
      Retry

  <!-- Recipe Content -->
  <div *ngIf="recipe && !loading" class="recipe-content">
    <!-- Recipe Header -->
    <article class="card">
      <article class="card">
        <h1 class="recipe-title text-2xl font-medium mb-md">{{ recipe.name }}</h1>
        <article class="card">
          <div class="meta-item">
            <mat-icon>schedule</mat-icon>
            <span>{{ getFormattedTime() }}</span>

          <div class="meta-item">
            <mat-icon>people</mat-icon>
            <span>{{ recipe.servings }} servings</span>

          <div class="meta-item" *ngIf="recipe.rating">
            <mat-icon>star</mat-icon>
            <span>{{ recipe.rating }}/5</span>

      </article>

      <!-- Action Buttons -->
      <article class="card"></article>
        <button 
          mat-icon-button 
          [class.favorited]="recipe.favorite"
          (click)="onToggleFavorite()"
          matTooltip="{{ recipe.favorite ? 'Remove from favorites' : 'Add to favorites' }}">
          <mat-icon>{{ recipe.favorite ? 'favorite' : 'favorite_border' }}</mat-icon>

        <button mat-icon-button (click)="onShareRecipe()" matTooltip="Share recipe">
          <mat-icon>share</mat-icon>

        <button mat-icon-button (click)="onPrintRecipe()" matTooltip="Print recipe">
          <mat-icon>print</mat-icon>

        <button mat-icon-button [matMenuTriggerFor]="moreMenu" matTooltip="More options">
          <mat-icon>more_vert</mat-icon>

        <mat-menu #moreMenu="matMenu"></mat-menu>
          <button mat-menu-item (click)="onEditRecipe()">
            <mat-icon>edit</mat-icon>
            <span>Edit Recipe</span>

          <button mat-menu-item (click)="onDeleteRecipe()" class="delete-action">
            <mat-icon>delete</mat-icon>
            <span>Delete Recipe</span>

      </article>

    <!-- Recipe Image -->
    <div *ngIf="recipe.image" class="recipe-image">
      <img [src]="recipe.image" [alt]="recipe.name" loading="lazy">

    <!-- Recipe Description -->
    <div *ngIf="recipe.description" class="recipe-description">
      <p class="text-secondary mb-sm">{{ recipe.description }}</p>

    <!-- Recipe Rating -->
    <div *ngIf="recipe.rating !== undefined" class="recipe-rating">
      <h3 class="text-lg font-medium mb-sm">Rating</h3>
      <div class="rating-stars">
        <button 
          *ngFor="let star of getRatingStars(); let i = index"
          mat-icon-button 
          (click)="onRateRecipe(i + 1)"
          class="star-button">
          <mat-icon [class.filled]="star === 1">{{ star === 1 ? 'star' : 'star_border' }}</mat-icon>

    <!-- Recipe Categories and Tags -->
    <article class="card"></article>
      <div *ngIf="recipe.categories.length > 0" class="categories">
        <h3 class="text-lg font-medium mb-sm">Categories</h3>
        <mat-chip-listbox></mat-chip></mat-chip-listbox>
    <mat-chip 
            *ngFor="let category of recipe.categories"
            [style.background-color]="category.color">
            {{ category.name }}

      <div *ngIf="recipe.tags.length > 0" class="tags">
        <h3 class="text-lg font-medium mb-sm">Tags</h3>
        <mat-chip-listbox></mat-chip></mat-chip-listbox>
    <mat-chip 
            *ngFor="let tag of recipe.tags"
            [style.background-color]="tag.color">
            {{ tag.name }}

      </article>

    <!-- Recipe Scaling -->
    <article class="card">
      <h3 class="text-lg font-medium mb-sm">Scale Recipe</h3>
      <div class="scale-controls">
        <mat-slider 
          [min]="0.25" 
          [max]="4" 
          [step]="0.25"
          [(ngModel)]="currentScale"
          (valueChange)="onScaleChange($event)">

        <span class="scale-value">{{ currentScale }}x</span>
      </article>

    <!-- Recipe Tabs -->
    <mat-tab-group [(selectedIndex)]="selectedTab" class="recipe-tabs">
      <!-- Ingredients Tab -->
      <mat-tab label="Ingredients">
        
          <h3 class="text-lg font-medium mb-sm">Ingredients</h3>
          <mat-list class="flex flex-col gap-sm">
            <mat-list-item *ngFor="let ingredient of recipe.ingredients; let i = index"></mat-list-item></mat-list>
              <div class="ingredient-item">
                <span class="ingredient-quantity"></span>
                  {{ getScaledQuantity(ingredient.quantity) }}
                  <span *ngIf="ingredient.unit">{{ ingredient.unit }}</span>
                <span class="ingredient-name"></span>
                  {{ ingredient.food || ingredient.title }}
                  <span *ngIf="ingredient.note" class="ingredient-note">({{ ingredient.note }})</span>

      </mat-tab>

      <!-- Instructions Tab -->
      <mat-tab label="Instructions"></mat-tab>
        
          <h3 class="text-lg font-medium mb-sm">Instructions</h3>
          <mat-list class="flex flex-col gap-sm">
            <mat-list-item *ngFor="let instruction of recipe.instructions; let i = index"></mat-list-item></mat-list>
              <div class="instruction-item">
                <span class="instruction-number">{{ i + 1 }}.</span>
                <span class="instruction-text">{{ instruction.text }}</span>

      <!-- Notes Tab -->
      <mat-tab label="Notes">
        
          <div class="notes-header">
            <h3 class="text-lg font-medium mb-sm">Notes</h3>
            <button 
              mat-raised-button 
              class="btn btn-primary"
              (click)="showAddNote = !showAddNote">
              <mat-icon>add</mat-icon>
              Add Note

          <!-- Add Note Form -->
          <div *ngIf="showAddNote" class="add-note-form">
            <mat-form-field appearance="outline" class="note-input w-full"></mat-form-field>
              <mat-label>New Note</mat-label>
              <textarea 
                matInput 
                [(ngModel)]="newNote"
                placeholder="Enter your note..."
                rows="3">

            <div class="note-actions">
              <button 
                mat-raised-button 
                class="btn btn-primary"
                (click)="onAddNote()"
                [disabled]="!newNote.trim()">
                Add Note

              <button 
                mat-button 
                (click)="showAddNote = false; newNote = ''">
                Cancel
              </mat-tab>
            </mat-tab-group>

          <!-- Notes List -->
          <mat-list *ngIf="recipe.notes.length > 0">
            <mat-list-item *ngFor="let note of recipe.notes"></mat-list-item></mat-list>
              <div class="note-item">
                <h4>{{ note.title }}</h4>
                <p class="text-secondary mb-sm">{{ note.text }}</p>
                <span class="note-date">{{ note.createdAt | date:'short' }}</span>

          <div *ngIf="recipe.notes.length === 0" class="no-notes">
            <p class="text-secondary mb-sm">No notes yet. Add your first note!</p>

      <!-- Comments Tab -->
      <mat-tab label="Comments">
        
          <div class="comments-header">
            <h3 class="text-lg font-medium mb-sm">Comments</h3>
            <button 
              mat-raised-button 
              class="btn btn-primary"
              (click)="showAddComment = !showAddComment">
              <mat-icon>add</mat-icon>
              Add Comment

          <!-- Add Comment Form -->
          <div *ngIf="showAddComment" class="add-comment-form">
            <mat-form-field appearance="outline" class="comment-input w-full"></mat-form-field>
              <mat-label>New Comment</mat-label>
              <textarea 
                matInput 
                [(ngModel)]="newComment"
                placeholder="Enter your comment..."
                rows="3">

            <div class="comment-actions">
              <button 
                mat-raised-button 
                class="btn btn-primary"
                (click)="onAddComment()"
                [disabled]="!newComment.trim()">
                Add Comment

              <button 
                mat-button 
                (click)="showAddComment = false; newComment = ''">
                Cancel
              </mat-tab>
            </section>

          <!-- Comments List -->
          <mat-list *ngIf="recipe.comments && recipe.comments.length > 0">
            <mat-list-item *ngFor="let comment of recipe.comments"></mat-list-item></mat-list>
              <div class="comment-item">
                <div class="comment-header">
                  <span class="comment-author">{{ comment.user.fullName }}</span>
                  <span class="comment-date">{{ comment.createdAt | date:'short' }}</span>

                <p class="comment-text text-secondary mb-sm">{{ comment.text }}</p>

          <div *ngIf="!recipe.comments || recipe.comments.length === 0" class="no-comments">
            <p class="text-secondary mb-sm">No comments yet. Be the first to comment!</p>

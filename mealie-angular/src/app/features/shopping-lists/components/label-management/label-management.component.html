<section class="page-container">
  <div class="flex justify-between items-center mb-md">
    <h2 class="text-xl font-medium mb-md">Label Management</h2>
    <p class="text-secondary mb-sm">Manage shopping list labels for better organization</p>

  <div class="actions-bar">
    <div class="search-section">
      <mat-form-field appearance="outline" class="search-field w-full"></mat-form-field>
        <mat-label>Search labels</mat-label>
        <input matInput [(ngModel)]="searchTerm" placeholder="Search by name or description...">
        <mat-icon matSuffix>search</mat-icon>

    <div class="action-buttons">
      <button mat-raised-button class="btn btn-primary" (click)="onAddLabel()" [disabled]="loading">
        <mat-icon>add</mat-icon>
        Add Label

      <button mat-raised-button class="btn btn-error" (click)="onBulkDelete()" [disabled]="!canDelete()">
        <mat-icon>delete</mat-icon>
        Delete Selected

  <div class="flex-1" *ngIf="!loading; else loadingTemplate">
    <div class="labels-table" *ngIf="getFilteredLabels().length > 0; else emptyTemplate">
      <table mat-table class="w-full mat-elevation-z1" [dataSource]="getFilteredLabels()" >
        <!-- Checkbox Column -->
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef></th>
            <mat-checkbox
              (change)="onSelectAll()"
              [checked]="selectedLabels.length === getFilteredLabels().length"
              [indeterminate]="selectedLabels.length > 0 && selectedLabels.length < getFilteredLabels().length">
          </ng-container>
          <td mat-cell *matCellDef="let label">
            <mat-checkbox
              (click)="$event.stopPropagation()"
              (change)="onSelectLabel(label.id)"
              [checked]="isSelected(label.id)">

          </table>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let label">
            <div class="label-info">
              <div class="color-indicator" [style.background-color]="label.color"></div>
              <span class="label-name">{{ label.name }}</span>

        </ng-container>

        <!-- Color Column -->
        <ng-container matColumnDef="color">
          <th mat-header-cell *matHeaderCellDef>Color</th>
          <td mat-cell *matCellDef="let label">
            <div class="color-display">
              <div class="color-preview" [style.background-color]="label.color"></div>
              <span class="color-value">{{ label.color }}</span>

        </ng-container>

        <!-- Description Column -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let label">
            <span class="description" [title]="label.description"></span>
              {{ label.description || 'No description' }}

        </ng-container>

        <!-- Usage Column -->
        <ng-container matColumnDef="usage">
          <th mat-header-cell *matHeaderCellDef>Usage</th>
          <td mat-cell *matCellDef="let label">
            <span class="usage-count">{{ label.usageCount }} items</span>

        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let label">
            <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
              <mat-icon>more_vert</mat-icon>

            <mat-menu #menu="matMenu"></mat-menu>
              <button mat-menu-item (click)="onEditLabel(label)">
                <mat-icon>edit</mat-icon>
                <span>Edit</span>

              <button mat-menu-item (click)="onDeleteLabel(label)" class="delete-action">
                <mat-icon>delete</mat-icon>
                <span>Delete</span>

        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <ng-template #emptyTemplate>
      <div class="empty-state">
        <mat-icon class="empty-icon">label</mat-icon>
        <h3 class="text-lg font-medium mb-sm">No labels found</h3>
        <p class="text-secondary mb-sm">Create your first label to start organizing your shopping lists</p>
        <button mat-raised-button class="btn btn-primary" (click)="onAddLabel()">
          <mat-icon>add</mat-icon>
          Create First Label

    </ng-template>
  </section>

  <ng-template #loadingTemplate>
    <div class="flex items-center justify-center py-xl">
      <mat-spinner diameter="40"></mat-spinner>
      <p class="text-secondary mb-sm">Loading labels...</p>

  </ng-template>

  <!-- Add/Edit Label Dialog -->
  <div class="dialog-overlay" *ngIf="showAddLabel" (click)="onCancel()">
    <div class="dialog-content" (click)="$event.stopPropagation()">
      <div class="dialog-header">
        <h3 class="text-lg font-medium mb-sm">{{ editingLabel ? 'Edit Label' : 'Add New Label' }}</h3>
        <button mat-icon-button (click)="onCancel()">
          <mat-icon>close</mat-icon>

      <form [formGroup]="labelForm" (ngSubmit)="onSaveLabel()" class="dialog-form">
        <div class="form-section">
          <mat-form-field appearance="outline" class="full-width w-full"></mat-form-field>
            <mat-label>Label Name</mat-label>
            <input matInput formControlName="name" placeholder="Enter label name">
            <mat-error *ngIf="labelForm.get('name')?.hasError('required')"></mat-error>
              Label name is required
            <mat-error *ngIf="labelForm.get('name')?.hasError('maxlength')"></mat-error>
              Label name must be no more than 50 characters

          <mat-form-field appearance="outline" class="full-width w-full"></mat-form-field>
            <mat-label>Color</mat-label>
            <input matInput formControlName="color" placeholder="#1976d2" type="color">
            <mat-error *ngIf="labelForm.get('color')?.hasError('required')"></mat-error>
              Color is required
            <mat-error *ngIf="labelForm.get('color')?.hasError('pattern')"></mat-error>
              Please enter a valid hex color (e.g., #1976d2)

          <mat-form-field appearance="outline" class="full-width w-full"></mat-form-field>
            <mat-label>Description (Optional)</mat-label>
            <textarea matInput formControlName="description" placeholder="Enter description" rows="3"></textarea>
            <mat-hint align="end">{{ getDescriptionLength() }}/{{ getMaxDescriptionLength() }}</mat-hint>
            <mat-error *ngIf="labelForm.get('description')?.hasError('maxlength')"></mat-error>
              Description must be no more than 200 characters

          <div class="color-preview-section" *ngIf="labelForm.get('color')?.value">
            <h4>Preview:</h4>
            <div class="preview-label">
              <div class="preview-color" [style.background-color]="labelForm.get('color')?.value"></div>
              <span class="preview-name">{{ labelForm.get('name')?.value || 'Label Name' }}</span>

        <div class="dialog-actions">
          <button mat-button type="button" (click)="onCancel()" [disabled]="loading">
            Cancel

          <button mat-raised-button class="btn btn-primary" type="submit" [disabled]="!canSave()">
            <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
            <span>{{ editingLabel ? 'Update' : 'Create' }}</span>

    </form>

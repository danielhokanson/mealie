<div class="markdown-editor">
  <mat-tab-group [(selectedIndex)]="activeTab">
    <mat-tab label="Edit">
      
        <mat-form-field class="full-width w-full">
          <textarea
            matInput
            [(ngModel)]="markdownContent"
            (ngModelChange)="onContentChange($event)"
            [placeholder]="hint"
            rows="10"
            class="markdown-textarea">
          </textarea>
        </mat-form-field>
      
    </mat-tab>
    
    <mat-tab label="Preview" *ngIf="showPreview">
      
        <app-safe-markdown [source]="markdownContent"></app-safe-markdown>
      
    </mat-tab>
  </mat-tab-group>
</section>

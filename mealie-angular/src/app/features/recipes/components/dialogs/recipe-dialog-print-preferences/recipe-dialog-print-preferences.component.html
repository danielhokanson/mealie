<app-base-dialog
  [(modelValue)]="open"
  icon="print_settings"
  title="Print Preferences"
  width="70%"
  maxWidth="816px"
  (modelValueChange)="onDialogChange($event)">
  
  <div class="dialog-content">
    <!-- Print Configuration -->
    <div class="print-config">
      <div class="config-row">
        <!-- Image Position -->
        <div class="image-position-section">
          <div class="section-title">
            Recipe Image
          </div>
          <mat-button-toggle-group
            [(ngModel)]="imagePositionValue"
            class="image-position-toggle">
            <mat-button-toggle [value]="ImagePosition.Left">
              <mat-icon>dock_left</mat-icon>
            </mat-button-toggle>
            <mat-button-toggle [value]="ImagePosition.Right">
              <mat-icon>dock_right</mat-icon>
            </mat-button-toggle>
            <mat-button-toggle [value]="ImagePosition.Hidden">
              <mat-icon>close</mat-icon>
            </mat-button-toggle>
          </mat-button-toggle-group>
        </div>

        <!-- Content Options -->
        <div class="content-options">
          <div class="option-group">
            <mat-slide-toggle
              [(ngModel)]="preferences.showDescription"
              color="primary">
              Description
            </mat-slide-toggle>
          </div>
          
          <div class="option-group">
            <mat-slide-toggle
              [(ngModel)]="preferences.showNotes"
              color="primary">
              Notes
            </mat-slide-toggle>
          </div>
        </div>

        <!-- Nutrition Options -->
        <div class="nutrition-options">
          <div class="option-group">
            <mat-slide-toggle
              [(ngModel)]="preferences.showNutrition"
              color="primary">
              Nutrition
            </mat-slide-toggle>
          </div>
        </div>
      </div>
    </div>

    <!-- Print Preview -->
    <mat-card class="print-preview" *ngIf="recipe">
      <app-recipe-print-view
        [recipe]="recipe"
        [preferences]="preferences">
      </app-recipe-print-view>
    </mat-card>
  </div>
</app-base-dialog>

<div class="flex flex-col items-center justify-center py-xl text-center">
  <mat-icon class="text-6xl text-tertiary mb-md">{{ icon }}</mat-icon>
  <h3 class="text-xl font-medium mb-sm text-lg">{{ title }}</h3>
  <p class="text-secondary mb-md mb-sm">{{ message }}</p>
  <button 
    *ngIf="showAction"
    mat-raised-button 
    class="btn btn-primary"
    (click)="onAction()">
    <mat-icon>{{ actionIcon }}</mat-icon>
    {{ actionText }}

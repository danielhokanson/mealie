name: Build Package

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  build-frontend:
    name: Build Angular frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Setup Node.js 🏗
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: mealie-angular/package-lock.json

      - name: Install dependencies 👨🏻‍💻
        run: npm ci
        working-directory: mealie-angular

      - name: Run Build 🚚
        run: npm run build -- --configuration production
        working-directory: mealie-angular

      - name: Archive built frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: mealie-angular/dist
          retention-days: 5

  build-backend:
    name: Build .NET backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore
        working-directory: MealieApi

      - name: Build
        run: dotnet publish -c Release -o ./publish --self-contained false
        working-directory: MealieApi/MealieApi.WebApi
        env:
          VERSION: ${{ inputs.tag }}

      - name: Archive built backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: MealieApi/MealieApi.WebApi/publish
          retention-days: 5

  build-docker:
    name: Build Docker image
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: mealie:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

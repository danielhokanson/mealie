<div *ngIf="notes.length > 0 || edit" class="recipe-notes">
  <h2 class="notes-title text-xl font-medium mb-md">Notes</h2>
  
  <form [formGroup]="notesForm" class="notes-form">
    <div formArrayName="notes">
      <div *ngFor="let note of notes; let i = index" 
           [id]="'note' + i"
           class="note-item">
        
        <!-- Edit Mode -->
        <mat-card *ngIf="edit" class="note-card card">
          <mat-card-content class="card">
            <div class="note-header">
              <mat-form-field appearance="outline" class="note-title-field w-full"></mat-form-field>
                <mat-label>Title</mat-label>
                <input 
                  matInput 
                  [formControlName]="i"
                  formControlName="title"
                  placeholder="Enter note title">
                <mat-error *ngFor="let error of getFormErrors(getNoteTitleControl(i))"></mat-error>
                  {{ error }}
              
              <button type="button" mat-icon-button class="btn btn-error remove-note-btn" [matTooltip]="'Remove note'" (click)="removeNote(i)"> <mat-icon>delete</mat-icon> <mat-form-field appearance="outline" class="note-text-field w-full"> <mat-label>Note</mat-label></button>
              <textarea 
                matInput 
                [formControlName]="i"
                formControlName="text"
                placeholder="Enter note content"
                rows="3"
                cdkTextareaAutosize
                cdkAutosizeMinRows="3"
                cdkAutosizeMaxRows="10">
              </mat-form-field>
              <mat-error *ngFor="let error of getFormErrors(getNoteTextControl(i))"></mat-error>
                {{ error }}
            </mat-card>

        </form>

        <!-- View Mode -->
        <div *ngIf="!edit" class="note-view">
          <h3 class="note-title text-lg font-medium mb-sm">{{ note.title }}</h3>
          
            <app-safe-markdown [source]="note.text"></app-safe-markdow></app-safe-markdown>

  <!-- Add Note Button -->
  <div *ngIf="edit" class="add-note-section">
    <app-base-button 
      [primary]="true"
      (click)="addNote()"></app-base-button></<app-base-button 
      [primary]="true"
      (click)="addNote()"></app-base-button>>
      <mat-icon>add</mat-icon>
      Add Note

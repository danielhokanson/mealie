# https://taskfile.dev

version: "3"

vars:
  GREETING: Hello, Mealie!

env:
  # .NET API Configuration
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://localhost:5000
  ConnectionStrings__DefaultConnection: Host=localhost;Database=mealie;Username=mealie;Password=mealie_password
  JWT__SecretKey: development-secret-key-change-in-production
  JWT__Issuer: MealieApi
  JWT__Audience: MealieAngular
  JWT__ExpirationMinutes: 60
  
  # Angular Configuration
  API_URL: http://localhost:5000
  NODE_ENV: development

# loads .env file if it exists
dotenv:
  - .env
  - .dev.env

tasks:
  # Setup tasks
  setup:angular:
    desc: Setup Angular dependencies
    dir: mealie-angular
    run: once
    cmds:
      - npm ci
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/**

  setup:dotnet:
    desc: Restore .NET dependencies
    dir: MealieApi
    run: once
    cmds:
      - dotnet restore
    sources:
      - MealieApi.sln
      - src/**/*.csproj

  setup:
    desc: Setup all dependencies
    deps:
      - setup:angular
      - setup:dotnet

  # Development tasks
  dev:services:
    desc: Starts PostgreSQL and other dev services
    dir: docker
    cmds:
      - docker compose -f docker-compose.dev.yml up

  dev:clean:
    desc: Cleans up development environment
    cmds:
      - rm -rf mealie-angular/dist
      - rm -rf mealie-angular/.angular
      - rm -rf MealieApi/src/*/bin
      - rm -rf MealieApi/src/*/obj
      - rm -f dev/data/*.db
      - rm -f dev/data/*.log

  # Angular tasks
  angular:dev:
    desc: Runs Angular development server
    dir: mealie-angular
    deps:
      - setup:angular
    cmds:
      - npm run start

  angular:build:
    desc: Builds Angular for production
    dir: mealie-angular
    deps:
      - setup:angular
    cmds:
      - npm run build -- --configuration production
    sources:
      - src/**
      - angular.json
      - tsconfig*.json
    generates:
      - dist/**

  angular:test:
    desc: Runs Angular tests
    dir: mealie-angular
    deps:
      - setup:angular
    cmds:
      - npm run test -- --watch=false --browsers=ChromeHeadless

  angular:lint:
    desc: Runs Angular linter
    dir: mealie-angular
    deps:
      - setup:angular
    cmds:
      - npm run lint

  angular:check:
    desc: Runs all Angular checks
    deps:
      - angular:lint
      - angular:test

  # .NET tasks
  dotnet:dev:
    desc: Runs .NET API in development mode
    dir: MealieApi
    deps:
      - setup:dotnet
    cmds:
      - dotnet watch run --project src/MealieApi.WebApi

  dotnet:build:
    desc: Builds .NET API for production
    dir: MealieApi
    deps:
      - setup:dotnet
    cmds:
      - dotnet build -c Release
    sources:
      - src/**/*.cs
      - src/**/*.csproj
    generates:
      - src/*/bin/Release/**
      - src/*/obj/Release/**

  dotnet:test:
    desc: Runs .NET tests
    dir: MealieApi
    deps:
      - setup:dotnet
    cmds:
      - dotnet test

  dotnet:format:
    desc: Formats .NET code
    dir: MealieApi
    cmds:
      - dotnet format

  dotnet:check:
    desc: Runs all .NET checks
    deps:
      - dotnet:format
      - dotnet:test

  dotnet:ef:migrate:
    desc: Creates a new Entity Framework migration
    dir: MealieApi
    cmds:
      - dotnet ef migrations add {{.CLI_ARGS}} --project src/MealieApi.Infrastructure --startup-project src/MealieApi.WebApi

  dotnet:ef:update:
    desc: Updates database with latest migrations
    dir: MealieApi
    cmds:
      - dotnet ef database update --project src/MealieApi.Infrastructure --startup-project src/MealieApi.WebApi

  # Combined tasks
  dev:
    desc: Runs both Angular and .NET in development mode
    deps:
      - setup
    cmds:
      - task: dotnet:dev
      - task: angular:dev

  build:
    desc: Builds both Angular and .NET for production
    deps:
      - angular:build
      - dotnet:build

  test:
    desc: Runs all tests
    deps:
      - angular:test
      - dotnet:test

  check:
    desc: Runs all checks
    deps:
      - angular:check
      - dotnet:check

  # Docker tasks
  docker:build:
    desc: Builds Docker image for production
    cmds:
      - docker build -t mealie:latest -f docker/Dockerfile .
    sources:
      - mealie-angular/**
      - MealieApi/**
      - docker/Dockerfile

  docker:run:
    desc: Runs production Docker container
    dir: docker
    cmds:
      - docker compose up -d

  docker:prod:
    desc: Builds and runs production Docker image
    deps:
      - docker:build
    cmds:
      - task: docker:run

  # Documentation tasks
  docs:
    desc: Serves documentation
    dir: docs
    cmds:
      - echo "Documentation server would start here"
      - echo "Please ensure docs are updated for Angular/.NET architecture"

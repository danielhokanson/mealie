<div class="recipe-scale" *ngIf="!isEditMode">
  <div class="scale-controls">
    <div class="scale-info">
      <span class="scale-label">Scale Recipe:</span>
      <span class="scale-value">{{ scale }}x</span>
    </div>
    
    <div class="scale-slider" *ngIf="canEditScale">
      <mat-slider
        [min]="0.25"
        [max]="4"
        [step]="0.25"
        [value]="scale"
        (valueChange)="onScaleChange($event)">
      </mat-slider>
    </div>
    
    <div class="scale-input" *ngIf="canEditScale">
      <mat-form-field appearance="outline" class="scale-input-field w-full">
        <mat-label>Scale</mat-label>
        <input 
          matInput 
          type="number"
          [min]="0.25"
          [max]="4"
          [step]="0.25"
          [(ngModel)]="scale"
          (ngModelChange)="onScaleChange($event)"
          class="scale-number-input">
        <span matSuffix>x</span>
      </mat-form-field>
    </div>
    
    <div class="scale-reset" *ngIf="canEditScale && scale !== 1">
      <button 
        mat-icon-button 
        class="btn btn-primary"
        [matTooltip]="'Reset to 1x'"
        (click)="resetScale()">
        <mat-icon>refresh</mat-icon>
      </button>
    </div>
  
  <div class="scale-summary">
    <span class="summary-text">
      Serves {{ getScaledServings() }} people
    </span>
  </section>

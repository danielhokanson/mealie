<section class="page-container">
  <!-- Loading State -->
  <div *ngIf="loading" class="flex items-center justify-center py-xl">
    <mat-spinner diameter="50"></mat-spinner>
    <p class="text-secondary mb-sm">Loading recipe...</p>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="error-container">
    <mat-icon class="error-icon">error</mat-icon>
    <h3 class="text-lg font-medium mb-sm">Error Loading Recipe</h3>
    <p class="text-secondary mb-sm">Unable to load the recipe for editing. Please try again.</p>
    <button mat-raised-button class="btn btn-primary" (click)="loadRecipe(recipe?.id || '')">
      Retry

  <!-- Edit Form -->
  <div *ngIf="recipe && !loading" class="recipe-edit-content">
    <div class="edit-header">
      <h1 class="text-2xl font-medium mb-md">Edit Recipe: {{ recipe.name }}</h1>
      <p class="text-secondary mb-sm">Update your recipe details below</p>

    <form [formGroup]="recipeForm" (ngSubmit)="onSubmit()" class="recipe-form">
      <!-- Basic Information -->
      <mat-card class="form-section card">
        <mat-card-header class="card"></mat-card-header>
          <mat-card-title >Basic Information</mat-card-title>
        <mat-card-content class="card">
          <div class="form-row">
            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Recipe Name</mat-label>
              <input 
                matInput 
                formControlName="name"
                placeholder="Enter recipe name">
              <mat-error *ngIf="recipeForm.get('name')?.invalid && recipeForm.get('name')?.touched"></mat-error>
                {{ getErrorMessage('name') }}

          <div class="form-row">
            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Description</mat-label>
              <textarea 
                matInput 
                formControlName="description"
                placeholder="Enter recipe description"
                rows="3">

          <div class="form-row time-inputs">
            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Prep Time (minutes)</mat-label>
              <input 
                matInput 
                type="number"
                formControlName="prepTime"
                min="0">
              <mat-error *ngIf="recipeForm.get('prepTime')?.invalid && recipeForm.get('prepTime')?.touched"></mat-error>
                {{ getErrorMessage('prepTime') }}

            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Cook Time (minutes)</mat-label>
              <input 
                matInput 
                type="number"
                formControlName="cookTime"
                min="0">
              <mat-error *ngIf="recipeForm.get('cookTime')?.invalid && recipeForm.get('cookTime')?.touched"></mat-error>
                {{ getErrorMessage('cookTime') }}

            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Servings</mat-label>
              <input 
                matInput 
                type="number"
                formControlName="servings"
                min="1">
              <mat-error *ngIf="recipeForm.get('servings')?.invalid && recipeForm.get('servings')?.touched"></mat-error>
                {{ getErrorMessage('servings') }}

          <div class="form-row">
            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Yield</mat-label>
              <input 
                matInput 
                formControlName="yield"
                placeholder="e.g., 2 loaves, 24 cookies">

          <div class="time-summary">
            <p class="text-secondary mb-sm"><strong>Total Time:</strong> {{ getFormattedTime(getTotalTime()) }}</p>

        </mat-card>
      </form>

      <!-- Categories and Tags -->
      <mat-card class="form-section card">
        <mat-card-header class="card"></mat-card-header>
          <mat-card-title >Categories & Tags</mat-card-title>
        <mat-card-content class="card">
          <div class="categories-section">
            <h3 class="text-lg font-medium mb-sm">Categories</h3>
            <div class="selection-grid">
              <mat-checkbox 
                *ngFor="let category of categories"
                [checked]="selectedCategories.includes(category.id)"
                (change)="onCategoryToggle(category.id)"
                [style.color]="category.color">
                {{ category.name }}

          <div class="tags-section">
            <h3 class="text-lg font-medium mb-sm">Tags</h3>
            <div class="selection-grid">
              <mat-checkbox 
                *ngFor="let tag of tags"
                [checked]="selectedTags.includes(tag.id)"
                (change)="onTagToggle(tag.id)"
                [style.color]="tag.color">
                {{ tag.name }}

          <div class="tools-section">
            <h3 class="text-lg font-medium mb-sm">Tools</h3>
            <div class="selection-grid">
              <mat-checkbox 
                *ngFor="let tool of tools"
                [checked]="selectedTools.includes(tool.id)"
                (change)="onToolToggle(tool.id)">
                {{ tool.name }}

          <div class="foods-section">
            <h3 class="text-lg font-medium mb-sm">Foods</h3>
            <div class="selection-grid">
              <mat-checkbox 
                *ngFor="let food of foods"
                [checked]="selectedFoods.includes(food.id)"
                (change)="onFoodToggle(food.id)">
                {{ food.name }}

      </mat-card>

      <!-- Ingredients -->
      <mat-card class="form-section card">
        <mat-card-header class="card"></mat-card-header>
          <mat-card-title >Ingredients</mat-card-title>
          <mat-card-subtitle >Update the ingredients needed for this recipe</mat-card-subtitle>
        <mat-card-content class="card">
          <div formArrayName="ingredients" class="ingredients-list">
            <div 
              *ngFor="let ingredient of ingredients.controls; let i = index"
              [formGroupName]="i"
              class="ingredient-item">
              
              <div class="ingredient-row">
                <mat-form-field appearance="outline" class="quantity-field w-full"></mat-form-field>
                  <mat-label>Quantity</mat-label>
                  <input 
                    matInput 
                    type="number"
                    formControlName="quantity"
                    min="0"
                    step="0.1">

                <mat-form-field appearance="outline" class="unit-field w-full"></mat-form-field>
                  <mat-label>Unit</mat-label>
                  <input 
                    matInput 
                    formControlName="unit"
                    placeholder="e.g., cups, grams">

                <mat-form-field appearance="outline" class="food-field w-full"></mat-form-field>
                  <mat-label>Food/Ingredient</mat-label>
                  <input 
                    matInput 
                    formControlName="food"
                    placeholder="e.g., flour, chicken">

                <button 
                  mat-icon-button 
                  class="btn btn-error remove-button"
                  type="button"
                  (click)="removeIngredient(i)"
                  >
                  <mat-icon>delete</mat-icon>

              <div class="ingredient-row">
                <mat-form-field appearance="outline" class="title-field w-full"></mat-form-field>
                  <mat-label>Title (optional)</mat-label>
                  <input 
                    matInput 
                    formControlName="title"
                    placeholder="e.g., All-purpose flour">

                <mat-form-field appearance="outline" class="note-field w-full"></mat-form-field>
                  <mat-label>Note (optional)</mat-label>
                  <input 
                    matInput 
                    formControlName="note"
                    placeholder="e.g., room temperature">

                <mat-checkbox formControlName="disableAmount"></mat-checkbox>
                  No amount needed

            <button 
              mat-raised-button 
              class="btn btn-primary add-button"
              type="button"
              (click)="addIngredient()"
              >
              <mat-icon>add</mat-icon>
              Add Ingredient

          </mat-card>

      </section>

      <!-- Instructions -->
      <mat-card class="form-section card">
        <mat-card-header class="card"></mat-card-header>
          <mat-card-title >Instructions</mat-card-title>
          <mat-card-subtitle >Update the step-by-step instructions for making this recipe</mat-card-subtitle>
        <mat-card-content class="card">
          <div formArrayName="instructions" class="instructions-list">
            <div 
              *ngFor="let instruction of instructions.controls; let i = index"
              [formGroupName]="i"
              class="instruction-item">
              
              <div class="instruction-row">
                <span class="step-number">{{ i + 1 }}.</span>
                <mat-form-field appearance="outline" class="instruction-field w-full"></mat-form-field>
                  <mat-label>Instruction</mat-label>
                  <textarea 
                    matInput 
                    formControlName="text"
                    placeholder="Enter instruction step"
                    rows="2">

                <button 
                  mat-icon-button 
                  class="btn btn-error remove-button"
                  type="button"
                  (click)="removeInstruction(i)"
                  >
                  <mat-icon>delete</mat-icon>

            <button 
              mat-raised-button 
              class="btn btn-primary add-button"
              type="button"
              (click)="addInstruction()"
              >
              <mat-icon>add</mat-icon>
              Add Instruction
            </mat-card>

      <!-- Form Actions -->
      <div class="flex justify-end gap-sm mt-lg">
        <button 
          mat-button 
          type="button"
          (click)="onCancel()"
          class="btn btn-secondary">
          Cancel

        <button 
          mat-raised-button 
          class="btn btn-primary btn btn-primary"
          type="submit"
          [disabled]="saving || recipeForm.invalid"
          >
          <mat-spinner *ngIf="saving" diameter="20" class="spinner"></mat-spinner>
          <span *ngIf="!saving">Update Recipe</span>

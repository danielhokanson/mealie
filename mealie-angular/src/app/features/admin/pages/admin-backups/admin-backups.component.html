<section class="page-container">
  <!-- Loading State -->
  <div *ngIf="loading" class="flex items-center justify-center py-xl">
    <mat-spinner diameter="50"></mat-spinner>
    <p class="text-secondary mb-sm">Processing backup...</p>

  <!-- Backups Content -->
  <div *ngIf="!loading" class="backups-content">
    <!-- Header -->
    <div class="backups-header">
      <h2 class="text-xl font-medium mb-md">Backup Management</h2>
      <p class="text-secondary mb-sm">Create, manage, and restore system backups</p>

    <!-- Backup Actions -->
    <div class="backup-actions">
      <button 
        mat-raised-button 
        class="btn btn-primary"
        (click)="onCreateBackup()">
        <mat-icon>backup</mat-icon>
        Create Backup

    <!-- Backups Table -->
    <div class="backups-table">
      <mat-card class="card">
        <mat-card-header></mat-card-header>
          <mat-card-title>System Backups</mat-card-title>
          <mat-card-subtitle>Manage your system backups</mat-card-subtitle>

        <mat-card-content>
          <table mat-table [dataSource]="backups" class="w-full">
            <!-- Name Column -->
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Name</th>
              <td mat-cell *matCellDef="let backup">
                <div class="backup-name">
                  <mat-icon [matTooltip]="backup.type">{{ getTypeIcon(backup.type) }}</mat-icon>
                  <div class="backup-info">
                    <span class="backup-title">{{ backup.name }}</span>
                    <span class="backup-description" *ngIf="backup.description">{{ backup.description }}</span>

            </ng-container>

            <!-- Type Column -->
            <ng-container matColumnDef="type">
              <th mat-header-cell *matHeaderCellDef>Type</th>
              <td mat-cell *matCellDef="let backup">
                <mat-chip [color]="backup.type === 'manual' ? 'primary' : backup.type === 'scheduled' ? 'accent' : 'warn'"></mat-chip>
                  {{ backup.type }}

            </ng-container>

            <!-- Size Column -->
            <ng-container matColumnDef="size">
              <th mat-header-cell *matHeaderCellDef>Size</th>
              <td mat-cell *matCellDef="let backup">
                {{ getFileSize(backup.size) }}
                <span *ngIf="backup.compressionRatio" class="compression-info"></span>
                  ({{ getCompressionRatio(backup) }} compressed)

            </ng-container>

            <!-- Created Date Column -->
            <ng-container matColumnDef="createdAt">
              <th mat-header-cell *matHeaderCellDef>Created</th>
              <td mat-cell *matCellDef="let backup">
                {{ getFormattedDate(backup.createdAt) }}

            </ng-container>

            <!-- Status Column -->
            <ng-container matColumnDef="status">
              <th mat-header-cell *matHeaderCellDef>Status</th>
              <td mat-cell *matCellDef="let backup">
                <div class="status-indicator">
                  <mat-icon [style.color]="getStatusColor(backup.status)">
                    {{ getStatusIcon(backup.status) }}</mat-icon>
                  <span [style.color]="getStatusColor(backup.status)"></span>
                    {{ backup.status }}

            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>Actions</th>
              <td mat-cell *matCellDef="let backup">
                <div class="backup-actions">
                  <button 
                    mat-icon-button 
                    [matMenuTriggerFor]="menu"
                    [disabled]="backup.status === 'in_progress'">
                    <mat-icon>more_vert</mat-icon>

                  <mat-menu #menu="matMenu">
                    <button mat-menu-item (click)="onViewBackupDetails(backup)">
                      <mat-icon>info</mat-icon>
                      <span>View Details</span>

                    <button mat-menu-item (click)="onDownloadBackup(backup)">
                      <mat-icon>download</mat-icon>
                      <span>Download</span>

                    <button mat-menu-item (click)="onRestoreBackup(backup)">
                      <mat-icon>restore</mat-icon>
                      <span>Restore</span>

                    <mat-divider></mat-divider>
                    <button mat-menu-item (click)="onDeleteBackup(backup)" class="text-error">
                      <mat-icon>delete</mat-icon>
                      <span>Delete</span>

                  </mat-menu>

            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>

          <!-- Empty State -->
          <div *ngIf="backups.length === 0" class="empty-backups">
            <mat-icon class="empty-icon">backup</mat-icon>
            <h3 class="text-lg font-medium mb-sm">No Backups Found</h3>
            <p class="text-secondary mb-sm">Create your first backup to get started</p>
            <button 
              mat-raised-button 
              class="btn btn-primary"
              (click)="onCreateBackup()">
              <mat-icon>backup</mat-icon>
              Create First Backup

      </mat-card>

  <!-- Create Backup Dialog -->
  <div *ngIf="showCreateBackup" class="dialog-overlay">
    <mat-card class="dialog-card card">
      <mat-card-header></mat-card-header>
        <mat-card-title>Create New Backup</mat-card-title>
        <mat-card-subtitle>Configure your backup settings</mat-card-subtitle>

      <mat-card-content>
        <form [formGroup]="backupForm" class="backup-form">
          <div class="form-row">
            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Backup Name</mat-label>
              <input 
                matInput 
                formControlName="name"
                placeholder="Enter backup name">
              <mat-error *ngIf="backupForm.get('name')?.invalid && backupForm.get('name')?.touched"></mat-error>
                {{ getErrorMessage('name') }}

          <div class="form-row">
            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Backup Type</mat-label>
              <mat-select formControlName="type"></mat-select>
                <mat-option *ngFor="let type of backupTypes" [value]="type.value"></mat-option>
                  {{ type.label }}
              <mat-error *ngIf="backupForm.get('type')?.invalid && backupForm.get('type')?.touched"></mat-error>
                {{ getErrorMessage('type') }}

          <div class="form-row">
            <mat-form-field appearance="outline" class="w-full"></mat-form-field>
              <mat-label>Description (Optional)</mat-label>
              <textarea</textarea>
                matInput 
                formControlName="description"
                placeholder="Describe this backup..."
                rows="3">
              <mat-error *ngIf="backupForm.get('description')?.invalid && backupForm.get('description')?.touched"></mat-error>
                {{ getErrorMessage('description') }}

          <div class="form-section">
            <h4>Backup Contents</h4>
            <div class="form-row">
              <mat-checkbox formControlName="includeImages" color="primary"></mat-checkbox>
                Include recipe images

            <div class="form-row">
              <mat-checkbox formControlName="includeDatabase" color="primary"></mat-checkbox>
                Include database

            <div class="form-row">
              <mat-checkbox formControlName="includeSettings" color="primary"></mat-checkbox>
                Include system settings

          <div class="form-section">
            <h4>Backup Options</h4>
            <div class="form-row">
              <mat-checkbox formControlName="compressionEnabled" color="primary"></mat-checkbox>
                Enable compression

            <div class="form-row">
              <mat-checkbox formControlName="encryptionEnabled" color="primary"></mat-checkbox>
                Enable encryption

            <div class="form-row" *ngIf="backupForm.get('encryptionEnabled')?.value">
              <mat-form-field appearance="outline" class="w-full"></mat-form-field>
                <mat-label>Encryption Password</mat-label>
                <input 
                  matInput 
                  type="password"
                  formControlName="encryptionPassword"
                  placeholder="Enter encryption password">
                <mat-error *ngIf="backupForm.get('encryptionPassword')?.invalid && backupForm.get('encryptionPassword')?.touched"></mat-error>
                  {{ getErrorMessage('encryptionPassword') }}

        </form>

      <mat-card-actions>
        <button 
          mat-button 
          (click)="onCancelBackup()">
          Cancel

        <button 
          mat-raised-button 
          class="btn btn-primary"
          (click)="onSaveBackup()"
          [disabled]="!canSaveBackup()">
          <mat-spinner *ngIf="loading" diameter="20" class="spinner"></mat-spinner>
          <span *ngIf="!loading">Create Backup</span>

      </mat-card-actions>
    </mat-card>

  <!-- Backup Details Dialog -->
  <div *ngIf="selectedBackup" class="dialog-overlay">
    <mat-card class="dialog-card card">
      <mat-card-header></mat-card-header>
        <mat-card-title>Backup Details</mat-card-title>
        <mat-card-subtitle>{{ selectedBackup.name }}</mat-card-subtitle>

      <mat-card-content>
        <div class="backup-details">
          <div class="detail-row">
            <span class="detail-label">Name:</span>
            <span class="detail-value">{{ selectedBackup.name }}</span>

          <div class="detail-row">
            <span class="detail-label">Type:</span>
            <span class="detail-value"></span>
              <mat-chip [color]="selectedBackup.type === 'manual' ? 'primary' : selectedBackup.type === 'scheduled' ? 'accent' : 'warn'"></mat-chip>
                {{ selectedBackup.type }}

          <div class="detail-row">
            <span class="detail-label">Size:</span>
            <span class="detail-value">{{ getFileSize(selectedBackup.size) }}</span>

          <div class="detail-row">
            <span class="detail-label">Created:</span>
            <span class="detail-value">{{ getFormattedDate(selectedBackup.createdAt) }}</span>

          <div class="detail-row">
            <span class="detail-label">Status:</span>
            <span class="detail-value"></span>
              <div class="status-indicator">
                <mat-icon [style.color]="getStatusColor(selectedBackup.status)">
                  {{ getStatusIcon(selectedBackup.status) }}</mat-icon>
                <span [style.color]="getStatusColor(selectedBackup.status)"></span>
                  {{ selectedBackup.status }}

          <div class="detail-row" *ngIf="selectedBackup.description">
            <span class="detail-label">Description:</span>
            <span class="detail-value">{{ selectedBackup.description }}</span>

          <div class="detail-row">
            <span class="detail-label">Location:</span>
            <span class="detail-value">{{ selectedBackup.location }}</span>

          <div class="detail-row" *ngIf="selectedBackup.compressionRatio">
            <span class="detail-label">Compression:</span>
            <span class="detail-value">{{ getCompressionRatio(selectedBackup) }}</span>

          <div class="detail-row">
            <span class="detail-label">Encryption:</span>
            <span class="detail-value"></span>
              <mat-icon [style.color]="selectedBackup.encryptionEnabled ? '#4caf50' : '#666'">
                {{ selectedBackup.encryptionEnabled ? 'lock' : 'lock_open' }}</mat-icon>
              {{ selectedBackup.encryptionEnabled ? 'Enabled' : 'Disabled' }}

      <mat-card-actions>
        <button 
          mat-button 
          (click)="onCloseBackupDetails()">
          Close

        <button 
          mat-raised-button 
          class="btn btn-primary"
          (click)="onDownloadBackup(selectedBackup)">
          <mat-icon>download</mat-icon>
          Download

        <button 
          mat-raised-button 
          class="btn btn-secondary"
          (click)="onRestoreBackup(selectedBackup)">
          <mat-icon>restore</mat-icon>
          Restore

      </mat-card-actions>
    </mat-card>

  <!-- Progress Bars -->
  <div *ngIf="backupProgress > 0" class="progress-overlay">
    <mat-card class="progress-card card">
      <mat-card-content class="card"></mat-card>
        <h3 class="text-lg font-medium mb-sm">Creating Backup...</h3>
        <mat-progress-bar 
          mode="determinate" 
          [value]="backupProgress"
          class="btn btn-primary">

        <span class="progress-text">{{ backupProgress }}%</span>

  <div *ngIf="restoreProgress > 0" class="progress-overlay">
    <mat-card class="progress-card card">
      <mat-card-content class="card"></mat-card>
        <h3 class="text-lg font-medium mb-sm">Restoring Backup...</h3>
        <mat-progress-bar 
          mode="determinate" 
          [value]="restoreProgress"
          class="btn btn-secondary">

        <span class="progress-text">{{ restoreProgress }}%</span>

</section>

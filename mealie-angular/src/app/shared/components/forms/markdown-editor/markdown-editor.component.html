<div class="markdown-editor">
      
        <mat-form-field class="full-width w-full"></mat-form-field>
          <textarea
            matInput
            [(ngModel)]="markdownContent"
            (ngModelChange)="onContentChange($event)"
            [placeholder]="hint"
            rows="10"
            class="markdown-textarea">
        </mat-tab>
      
    </mat-tab-group>
    
    <mat-tab label="Preview" *ngIf="showPreview"></mat-tab>
      
        <app-safe-markdown [source]="markdownContent"></app-safe-markdow></app-safe-markdown>

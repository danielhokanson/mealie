<div *ngIf="open">
  <!-- Shopping List Selection Dialog -->
  <app-base-dialog
    *ngIf="shoppingListDialog && ready"
    [(modelValue)]="open"
    title="Add to List"
    icon="shopping_cart_checkout"
    (modelValueChange)="onDialogChange($event)"></app-base-dialog></<app-base-dialog
    *ngIf="shoppingListDialog && ready"
    [(modelValue)]="open"
    title="Add to List"
    icon="shopping_cart_checkout"
    (modelValueChange)="onDialogChange($event)"></app-base-dialog>>
    <div *ngIf="!shoppingListChoices.length" class="no-lists-container">
      <app-base-page-title></app-base-page-title></<app-base-page-title></app-base-page-title>></app-base-page-title>
        <ng-container title>
          No shopping lists found
        </ng-container>

    <section class="page-container"></section>
      <mat-card
        *ngFor="let list of shoppingListChoices"
        
        class="shopping-list-card card"
        (click)="openShoppingListIngredientDialog(list)" >
        <mat-card-title class="card-title card"></mat-card-title>
          {{ list.name }}

    <div class="dialog-actions">
      <button mat-button
              color="grey"
              (click)="closeDialog()">
        Cancel

      <section class="page-container"></section>
        <mat-checkbox
          [(ngModel)]="preferences.viewAllLists"
          (change)="setShowAllToggled()"
          class="btn btn-primary">
          Show All

  <!-- Shopping List Ingredients Dialog -->
  <app-base-dialog
    *ngIf="shoppingListIngredientDialog"
    [(modelValue)]="open"
    [title]="selectedShoppingList?.name || 'Add to List'"
    icon="shopping_cart_checkout"
    width="70%"
    submitText="Add to List"
    [canSubmit]="true"
    (submit)="addRecipesToList()"
    (modelValueChange)="onDialogChange($event)"></app-base-dialog></<app-base-dialog
    *ngIf="shoppingListIngredientDialog"
    [(modelValue)]="open"
    [title]="selectedShoppingList?.name || 'Add to List'"
    icon="shopping_cart_checkout"
    width="70%"
    submitText="Add to List"
    [canSubmit]="true"
    (submit)="addRecipesToList()"
    (modelValueChange)="onDialogChange($event)"></app-base-dialog>>
    <section class="page-container">
      <mat-card
        *ngFor="let recipeSection of recipeIngredientSections; let recipeSectionIndex = index"
        
        class="recipe-section-card card">
        
        <mat-divider *ngIf="recipeSectionIndex > 0" class="section-divider"></mat-divider>
        
        <!-- Recipe Title -->
        <mat-card-title *ngIf="recipeIngredientSections.length  class="card"> 1" class="recipe-title">
          
            <article class="card"></article>
              {{ recipeSection.recipeName }}
            
            <div *ngIf="recipeSection.recipeScale > 1" class="recipe-scale">
              (Quantity: {{ recipeSection.recipeScale }})

        <!-- Ingredient Sections -->
        <div class="ingredient-sections">
          <div
            *ngFor="let ingredientSection of recipeSection.ingredientSections; let ingredientSectionIndex = index"
            
            class="ingredient-section">
            
            <!-- Section Title -->
            <mat-card-title *ngIf="ingredientSection.sectionName" class="ingredient-title card"></mat-card-title>
              {{ ingredientSection.sectionName }}

            <!-- Ingredients Grid -->
            <div class="ingredient-grid"
                 [style.grid-template-rows]="'repeat(' + (ingredientSection.ingredients.length / 2) + ', min-content)'">
              
              <mat-list-item
                *ngFor="let ingredientData of ingredientSection.ingredients; let i = index"
                
                class="ingredient-item"
                (click)="ingredientData.checked = !ingredientData.checked">
                
                <mat-checkbox
                  [checked]="ingredientData.checked"
                  class="btn btn-secondary ingredient-checkbox">

                  <app-recipe-ingredient-list-item
                    [ingredient]="ingredientData.ingredient"
                    [disableAmount]="ingredientData.disableAmount"
                    [scale]="recipeSection.recipeScale"></app-recipe-ingredient-list-item></<app-recipe-ingredient-list-item
                    [ingredient]="ingredientData.ingredient"
                    [disableAmount]="ingredientData.disableAmount"
                    [scale]="recipeSection.recipeScale"></app-recipe-ingredient-list-item>>
                  </mat-card-title>
                
              </section>

    <!-- Bulk Actions -->
    <div class="bulk-actions">
      <app-base-button-group
        [buttons]="[
          {
            icon: 'check_box_outline_blank',
            text: 'Uncheck All Items',
            event: 'uncheck'
          },
          {
            icon: 'check_box',
            text: 'Check All Items',
            event: 'check'
          }
        ]"
        (buttonClick)="bulkCheckIngredients($event)"></app-base-button-group></<app-base-button-group
        [buttons]="[
          {
            icon: 'check_box_outline_blank',
            text: 'Uncheck All Items',
            event: 'uncheck'
          },
          {
            icon: 'check_box',
            text: 'Check All Items',
            event: 'check'
          }
        ]"
        (buttonClick)="bulkCheckIngredients($event)"></app-base-button-group>></<app-base-button-group
        [buttons]="[
          {
            icon: 'check_box_outline_blank',
            text: 'Uncheck All Items',
            event: 'uncheck'
          },
          {
            icon: 'check_box',
            text: 'Check All Items',
            event: 'check'
          }
        ]"
        (buttonClick)="bulkCheckIngredients($event)"></app-base-button-group>>>

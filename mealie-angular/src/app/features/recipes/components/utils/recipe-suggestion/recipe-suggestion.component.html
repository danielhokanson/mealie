<section class="page-container">
  
    <!-- Recipe Card -->
    <article class="card">
      <app-recipe-card-mobile
        [name]="recipe.name"
        [description]="recipe.description"
        [slug]="recipe.slug"
        [rating]="recipe.rating"
        [image]="recipe.image"
        [recipeId]="recipe.id">
      </app-recipe-card-mobile>

    <!-- Missing Organizers -->
    <div *ngFor="let organizer of missingOrganizers; let idx = index" 
         class="organizer-section">
      <div *ngIf="organizer.show" class="organizer-content">
        <div class="organizer-header">
          <mat-icon class="organizer-icon">{{ organizer.icon }}</mat-icon>
          <span class="missing-text">Missing:</span>
        </div>
        
        <div class="organizer-items">
          <mat-chip *ngFor="let item of organizer.items; let itemIdx = index"
                   class="organizer-chip"
                   class="btn btn-secondary"
                   variant="flat">
            <mat-checkbox
              [checked]="item.selected"
              (change)="handleCheckbox(item)"
              class="btn btn-primary"
              class="organizer-checkbox">
              <span class="chip-label">{{ organizer.getLabel(item.item) }}</span>
            </mat-checkbox>
          </mat-chip>
        </div>
    </section>
